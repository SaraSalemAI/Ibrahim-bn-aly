gypt's Vision 2030: Sustainable development strategy. Arab Republic of Egypt. https://mped.gov.eg/Files/Egypt_Vision_2030_EnglishDigitalUse.pdf"}, {"s": "References (APA 7th Edition)", "t": "Schaltegger, S., & Burritt, R. (2000). Contemporary environmental accounting: Issues, concepts and practice. Greenleaf Publishing."}, {"s": "References (APA 7th Edition)", "t": "Silva, R., Inácio, H., & Marques, R. P. (2022). Blockchain implications for auditing: A systematic literature review and bibliometric analysis. International Journal of Digital Accounting Research, 22, 163–192. https://doi.org/10.4192/1577-8517-v22_6"}, {"s": "References (APA 7th Edition)", "t": "Spanò, R., Massaro, M., Ferri, L., Dumay, J., & Schmitz, J. (2022). Blockchain in accounting, accountability and assurance: An overview. Accounting, Auditing & Accountability Journal, 35(7), 1493–1506. https://doi.org/10.1108/AAAJ-06-2022-5850"}, {"s": "References (APA 7th Edition)", "t": "Spence, M. (1973). Job market signaling. The Quarterly Journal of Economics, 87(3), 355–374. https://doi.org/10.2307/1882010"}, {"s": "References (APA 7th Edition)", "t": "Suchman, M. C. (1995). Managing legitimacy: Strategic and institutional approaches. Academy of Management Review, 20(3), 571–610. https://doi.org/10.2307/258788"}, {"s": "References (APA 7th Edition)", "t": "Task Force on Climate-related Financial Disclosures. (2017). Recommendations of the Task Force on Climate-related Financial Disclosures: Final report. Financial Stability Board."}, {"s": "References (APA 7th Edition)", "t": "Tornatzky, L. G., & Fleischer, M. (1990). The processes of technological innovation. Lexington Books."}, {"s": "References (APA 7th Edition)", "t": "Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478. https://doi.org/10.2307/30036540"}, {"s": "References (APA 7th Edition)", "t": "World Bank. (2022). Supporting Egypt's inaugural green bond issuance. The World Bank Group. https://www.worldbank.org/en/news/feature/2022/03/02/supporting-egypt-s-inaugural-green-bond-issuance"}, {"s": "References (MLA 9th Edition)", "t": "Abdelmoneim, Zakia, and Mohamed Samy El-Deeb. \"BOD Characteristics and Their Impact on the Link between ESG Disclosure and Integrated Reporting Disclosure Quality: A Study of Egyptian Non-Financial Firms.\" Future Business Journal, vol. 10, no. 1, 2024, pp. 1–20."}, {"s": "References (MLA 9th Edition)", "t": "Burritt, Roger L., and Stefan Schaltegger. \"Sustainability Accounting and Reporting: Fad or Trend?\" Accounting, Auditing & Accountability Journal, vol. 23, no. 7, 2010, pp. 829–846."}, {"s": "References (MLA 9th Edition)", "t": "Dai, Jun, and Miklos A. Vasarhelyi. \"Toward Blockchain-Based Accounting and Assurance.\" Journal of Information Systems, vol. 31, no. 3, 2017, pp. 5–21."}, {"s": "References (MLA 9th Edition)", "t": "DiMaggio, Paul J., and Walter W. Powell. \"The Iron Cage Revisited: Institutional Isomorphism and Collective Rationality in Organizational Fields.\" American Sociological Review, vol. 48, no. 2, 1983, pp. 147–160."}, {"s": "References (MLA 9th Edition)", "t": "Financial Regulatory Authority. Decrees No. 107 and No. 108 of 2021 concerning Environmental, Social and Governance Disclosure and Climate-Related Financial Disclosure. Arab Republic of Egypt, 2021."}, {"s": "References (MLA 9th Edition)", "t": "Freeman, R. Edward. Strategic Management: A Stakeholder Approach. Pitman Publishing, 1984."}, {"s": "References (MLA 9th Edition)", "t": "Garanina, Tatiana, et al. \"Blockchain in Accounting Research: Current Trends and Emerging Topics.\" Accounting, Auditing & Accountability Journal, vol. 35, no. 7, 2022, pp. 1507–1533."}, {"s": "References (MLA 9th Edition)", "t": "Global Reporting Initiative. GRI Universal Standards: GRI 1, GRI 2 and GRI 3. Global Sustainability Standards Board, 2021."}, {"s": "References (MLA 9th Edition)", "t": "Gray, Rob. \"Is Accounting for Sustainability Actually Accounting for Sustainability… and How Would We Know? An Exploration of Narratives of Organisations and the Planet.\" Accounting, Organizations and Society, vol. 35, no. 1, 2010, pp. 47–62."}, {"s": "References (MLA 9th Edition)", "t": "Han, Hongdan, et al. \"Accounting and Auditing with Blockchain Technology and Artificial Intelligence: A Literature Review.\" International Journal of Accounting Information Systems, vol. 48, 2023, article 100598."}, {"s": "References (MLA 9th Edition)", "t": "IFRS Foundation. IFRS S1 General Requirements for Disclosure of Sustainability-Related Financial Information. International Sustainability Standards Board, 2023."}, {"s": "References (MLA 9th Edition)", "t": "IFRS Foundation. IFRS S2 Climate-Related Disclosures. International Sustainability Standards Board, 2023."}, {"s": "References (MLA 9th Edition)", "t": "IFRS Foundation. \"IFRS Foundation Publishes Jurisdictional Profiles Providing Transparency and Evidencing Progress towards Adoption of ISSB Standards.\" IFRS, 2025, www.ifrs.org/news-and-events/news/2025/06/ifrs-foundation-publishes-jurisdictional-profiles-issb-standards/."}, {"s": "References (MLA 9th Edition)", "t": "Jackson, Denise, et al. \"New Technology and Desired Skills of Early Career Accountants.\" Pacific Accounting Review, vol. 34, no. 4, 2022, pp. 548–568."}, {"s": "References (MLA 9th Edition)", "t": "Jędrzejka, Dariusz. \"Robotic Process Automation and Its Impact on Accounting.\" Zeszyty Teoretyczne Rachunkowości, vol. 105, no. 161, 2019, pp. 137–166."}, {"s": "References (MLA 9th Edition)", "t": "Ministry of Planning and Economic Development. Egypt's Vision 2030: Sustainable Development Strategy. Arab Republic of Egypt, 2023, mped.gov.eg/Files/Egypt_Vision_2030_EnglishDigitalUse.pdf."}, {"s": "References (MLA 9th Edition)", "t": "Schaltegger, Stefan, and Roger Burritt. Contemporary Environmental Accounting: Issues, Concepts and Practice. Greenleaf Publishing, 2000."}, {"s": "References (MLA 9th Edition)", "t": "Silva, Rui, et al. \"Blockchain Implications for Auditing: A Systematic Literature Review and Bibliometric Analysis.\" International Journal of Digital Accounting Research, vol. 22, 2022, pp. 163–192."}, {"s": "References (MLA 9th Edition)", "t": "Spanò, Rosanna, et al. \"Blockchain in Accounting, Accountability and Assurance: An Overview.\" Accounting, Auditing & Accountability Journal, vol. 35, no. 7, 2022, pp. 1493–1506."}, {"s": "References (MLA 9th Edition)", "t": "Spence, Michael. \"Job Market Signaling.\" The Quarterly Journal of Economics, vol. 87, no. 3, 1973, pp. 355–374."}, {"s": "References (MLA 9th Edition)", "t": "Suchman, Mark C. \"Managing Legitimacy: Strategic and Institutional Approaches.\" Academy of Management Review, vol. 20, no. 3, 1995, pp. 571–610."}, {"s": "References (MLA 9th Edition)", "t": "Task Force on Climate-related Financial Disclosures. Recommendations of the Task Force on Climate-Related Financial Disclosures: Final Report. Financial Stability Board, 2017."}, {"s": "References (MLA 9th Edition)", "t": "Tornatzky, Louis G., and Mitchell Fleischer. The Processes of Technological Innovation. Lexington Books, 1990."}, {"s": "References (MLA 9th Edition)", "t": "Venkatesh, Viswanath, et al. \"User Acceptance of Information Technology: Toward a Unified View.\" MIS Quarterly, vol. 27, no. 3, 2003, pp. 425–478."}, {"s": "References (MLA 9th Edition)", "t": "World Bank. \"Supporting Egypt's Inaugural Green Bond Issuance.\" The World Bank Group, 2022, www.worldbank.org/en/news/feature/2022/03/02/supporting-egypt-s-inaugural-green-bond-issuance."}];/*PF-END*/
/*KB-START*/const PAPER_KB="The convergence of digital transformation and sustainability has redefined the boundaries of the accounting discipline, shifting it from a retrospective record of financial transactions towards a real-time, multi-dimensional information system that reports on financial, environmental, social and governance performance simultaneously. This study examines that convergence in the Egyptian context, where a state-led digitalisation agenda and a maturing sustainability disclosure regime have advanced in parallel under the Sustainable Development Strategy known as Egypt Vision 2030. The study aims to analyse the drivers and current state of the transition to digital accounting and financial reporting in Egypt, to examine how the regulatory architecture of sustainability disclosure has reshaped the reporting function, to assess the extent to which green accounting can be embedded within digital infrastructure rather than layered upon it, and to identify the institutional, professional and technical constraints that impede integration. A descriptive-analytical method is adopted, relying on the documentary analysis of secondary sources comprising peer-reviewed literature, regulatory instruments, national strategy documents and reports of international standard-setters issued between 2016 and 2026. The analysis concludes that digitalisation in Egypt has advanced more rapidly in transaction capture and tax administration than in sustainability measurement and assurance; that mandatory disclosure has produced compliance-oriented rather than decision-oriented reporting; that green accounting remains largely detached from core accounting information systems; and that the binding constraint is institutional and human rather than technological. The study recommends that sustainability data be governed, controlled and assured with the same rigour applied to financial data, through a unified digital reporting architecture rather than a parallel one.\n1. Introduction\nAccounting has historically derived its authority from its capacity to represent economic reality in a form that is verifiable, comparable and useful for decision-making. Two simultaneous developments have unsettled that settlement. The first is technological: enterprise resource planning systems, cloud computing, robotic process automation, data analytics, artificial intelligence and distributed ledger technologies have altered how accounting data are captured, processed, verified and communicated, compressing the reporting cycle and displacing many of the manual procedures around which the profession organised itself (Han et al., 2023; Jędrzejka, 2019). The second is normative: the recognition that environmental degradation and climate change constitute financially material risks has extended the reporting boundary beyond the transactions of the reporting entity to encompass its resource consumption, emissions and social externalities (Burritt & Schaltegger, 2010; IFRS Foundation, 2023a).\nIn Egypt these two developments have unfolded within an explicit national policy frame. Egypt Vision 2030 identifies digital transformation and technological innovation among the instruments through which sustainable development is to be delivered, while treating environmental sustainability as one of its three constitutive dimensions (Ministry of Planning and Economic Development, 2023). The state has translated this orientation into concrete infrastructure, most visibly through the mandatory electronic invoicing and electronic receipt systems administered by the Egyptian Tax Authority, and into concrete disclosure obligations, most visibly through Decrees No. 107 and No. 108 of 2021 issued by the Financial Regulatory Authority, which require entities listed on the Egyptian Exchange and non-bank financial institutions above defined capital thresholds to publish annual environmental, social and governance disclosures, with additional climate-related financial disclosures for larger entities (Financial Regulatory Authority, 2021).\nThe difficulty is that these two tracks have progressed largely in isolation from one another. Digitalisation has been driven primarily by fiscal and administrative imperatives concerned with transaction visibility and revenue protection, whereas sustainability reporting has been driven by capital-market and regulatory imperatives concerned with disclosure. A plausible implication — theoretical rather than documented, since this study draws on no survey, interview or case-study evidence of individual entities' internal practices — is that environmental and social data in many Egyptian entities are compiled outside the accounting information system, for instance in spreadsheets maintained by sustainability functions, rather than through the controls that govern financial data. If that expectation holds, green accounting, understood as the systematic identification, measurement and allocation of environmental costs and benefits within the entity's accounting system, would remain a reporting exercise rather than a measurement discipline.\nThe research problem may therefore be stated as follows: to what extent does the transition to digital accounting and financial reporting in Egypt provide an operative infrastructure for institutionalising green accounting and digital sustainability, and what conditions must be satisfied for that potential to be realised in alignment with Egypt Vision 2030?\nThe principal question addressed by this study is: how can the transition to digital accounting and financial reporting in Egypt be leveraged to institutionalise green accounting and digital sustainability in a manner consistent with Egypt Vision 2030?\nThis principal question is decomposed into four subsidiary questions:\n1. What are the drivers and defining features of the transition to digital accounting and financial reporting in Egypt, and how far has that transition progressed?\n2. How has the sustainability disclosure regime introduced by the Financial Regulatory Authority altered the digital financial reporting function, and how does it relate to the emerging global baseline for sustainability disclosure?\n3. Under what conditions can green accounting be embedded within the digital accounting information system rather than operated alongside it?\n4. What institutional, professional and technical constraints impede this integration in Egypt, and what framework would address them?\n3. Research Objectives\nThis study pursues four objectives:\n1. To analyse the drivers, components and current state of the transition to digital accounting and financial reporting in Egypt during the period 2016–2026.\n2. To examine the manner in which the Egyptian regulatory architecture for sustainability disclosure has reshaped the digital financial reporting function and its relationship to emerging international standards.\n3. To assess the extent to which green accounting practices can be embedded within digital accounting infrastructure rather than maintained as a parallel reporting activity.\n4. To identify the institutional, professional and technical constraints that limit the integration of digital transformation with sustainability accounting in Egypt, and to derive from that analysis an integrated framework consistent with the priorities of Egypt Vision 2030.\nTwo limitations follow from this design and are stated explicitly. First, the study does not collect primary data through questionnaires, interviews or archival content analysis; its findings are therefore presented as reasoned analytical conclusions derived from documented evidence, and not as statistically generalisable empirical results — a limitation that bears directly on any statement made in this study about the internal practices of individual Egyptian entities, which should be read as a theoretical expectation grounded in the institutional logic reviewed rather than as an observed fact. Second, the study addresses the institutional and systemic level rather than the level of individual entity practice, and does not assess the disclosure quality of specific reporting entities.\n6.1 Conceptual Delimitation\nDigital accounting denotes the reconstitution of the accounting information system around digital technologies such that transaction capture, classification, processing and reporting are performed through integrated electronic systems with substantially reduced manual intervention. Its defining characteristic is not the automation of discrete tasks but the alteration of the accounting cycle itself: where conventional accounting processes transactions in periodic batches, digital accounting moves towards continuous capture and near-real-time processing, which in turn makes continuous reporting and continuous auditing conceivable (Han et al., 2023).\nDigital financial reporting denotes the preparation and dissemination of financial and non-financial reports in structured, machine-readable formats permitting automated extraction, aggregation and comparison, distinguished from mere electronic publication by a taxonomy assigning standardised meaning to each element, rendering information computable rather than merely readable.\nDigital sustainability is used here in a dual sense: the deployment of digital technologies to advance environmental and social objectives (measuring resource consumption, optimising energy and materials use, tracing supply chains), and the sustainability of digital systems themselves (the energy consumption of data centres and computation, hardware lifecycle, and governance and security of digital infrastructure). Both senses must be retained, since a digitalisation programme that improves environmental reporting while enlarging the footprint of its own infrastructure achieves an ambiguous outcome.\nGreen accounting, used here interchangeably with environmental accounting, denotes the systematic identification, measurement, recording and allocation of the environmental costs and benefits associated with an entity's activities, together with the disclosure of that information to internal and external users. Its analytical claim is that conventional accounting systematically obscures environmental cost by aggregating it within general overhead, thereby preventing management from attributing cost to the products, processes and decisions that generate it; the corrective is to disaggregate and trace those costs so that they inform pricing, investment appraisal and process design (Schaltegger & Burritt, 2000). Green accounting is therefore properly understood as a measurement discipline serving management decisions, and only derivatively as a disclosure practice.\nSustainability reporting and ESG disclosure denote the communication to external stakeholders of an entity's environmental, social and governance performance. A consequential distinction separates impact materiality — the entity's effect upon society and the environment, underpinning the Global Reporting Initiative framework — from financial materiality, concerning sustainability's effect on cash flows, access to finance and cost of capital, underpinning the standards of the International Sustainability Standards Board (Global Reporting Initiative, 2021; IFRS Foundation, 2023a). This is not merely technical: the two conceptions imply different reporting boundaries, audiences and measurement obligations.\n8.1 The Digital Infrastructure Layer: Depth Without Breadth\nThe transition to digital accounting in Egypt has been driven principally by the state rather than by the profession or the capital market. The electronic invoicing and electronic receipt systems administered by the Egyptian Tax Authority require value-added-tax-registered businesses to issue and transmit transaction documents electronically through a central clearance platform, spanning business-to-business, business-to-consumer and business-to-government transactions. Its stated objectives concern transparency, contracting the informal economy and tax-administration efficiency, and it has been situated by the authorities within the digital transformation agenda of Egypt Vision 2030.\nThree consequences follow for accounting practice. The first is structural: compliance obliges entities to maintain enterprise systems capable of generating structured, validated transaction data, which raises the baseline quality of accounting data across the formal economy independently of any voluntary decision to modernise. The second is evidential: where transaction data are validated at the point of issuance against a central platform, the character of audit evidence changes, since the auditor confronts a systemically validated data population rather than a set of documents of uncertain provenance. This is the practical realisation, within a fiscal rather than a commercial architecture, of the continuous-verification logic anticipated in the literature on distributed ledgers (Dai & Vasarhelyi, 2017; Silva et al., 2022). The third is behavioural: the mandate's near-universal scope has diffused digital accounting competence into segments of the economy that would not otherwise have acquired it.\nThe limitation of this achievement is one of breadth rather than depth. The infrastructure has been constructed around the transaction, because the transaction is the object of fiscal interest, yet environmental and social phenomena are frequently not transactions. The energy a production line consumes, the water an aquifer loses, the emissions a fleet releases and the waste diverted from landfill generate no invoice and so leave no trace within the electronic invoicing architecture. Where an environmental phenomenon does generate a transaction, the invoice records its financial dimension — the amount paid to a utility — while omitting the physical dimension: the quantity consumed and its emissions intensity. Since environmental measurement is conducted in physical units before translation into monetary ones, an infrastructure capturing only the monetary layer cannot support it without substantial extension. Egypt has thus built deep digital capability in a domain adjacent to, rather than inclusive of, the domain sustainability accounting requires.\n8.2 The Regulatory Layer: Mandate Without Measurement Architecture\nThe sustainability disclosure regime established by Decrees No. 107 and No. 108 of 2021 requires listed companies and non-bank financial institutions meeting defined capital or equity thresholds to make annual ESG disclosures, with entities above a higher threshold additionally required to provide climate-related financial disclosures structured according to the governance, strategy, risk management, and metrics and targets architecture of the Task Force on Climate-related Financial Disclosures (Financial Regulatory Authority, 2021; TCFD, 2017). The disclosures are rendered through prescribed forms annexed to the decrees rather than narrative reports of the preparer's own design, and covered entities must also report periodically on their implementation procedures.\nAssessed against the institutional framework adopted in this study, the regime's design displays notable strengths. Standardised forms address the comparability deficit that has undermined voluntary sustainability reporting, since prescribed fields constrain the selective presentation through which entities have historically managed impressions. The tiered thresholds embody a defensible proportionality, concentrating the climate-related obligation upon entities whose scale makes compliance feasible. Alignment with the Task Force on Climate-related Financial Disclosures positions Egypt advantageously relative to the emerging global baseline, since those recommendations have been absorbed into the climate standard of the International Sustainability Standards Board (IFRS Foundation, 2023b). With more than thirty jurisdictions moving towards adopting or using those standards (IFRS Foundation, 2025), this continuity is a material advantage for future convergence.\nThe regime's limitation lies in what it does not specify. A disclosure mandate prescribes an output. It does not prescribe the measurement system that produces the output, the internal controls that govern that system, or the assurance to which its results are subject. Where an obligation to disclose is imposed without corresponding obligations concerning measurement methodology, data governance and independent verification, the entity may satisfy the requirement through ad hoc compilation, and theory suggests the rational preparer would tend to do so, since the cost of building a controlled measurement system materially exceeds the cost of assembling a return. Legitimacy theory anticipates this outcome directly: where disclosure is oriented towards the satisfaction of an external expectation, the disclosing entity has an incentive to invest in the appearance rather than in the substance of performance (Suchman, 1995), and institutional theory identifies the resulting decoupling of formal structure from operational practice as the characteristic response of organisations to coercive pressure (DiMaggio & Powell, 1983). The finding of Abdelmoneim and El-Deeb (2024) that board characteristics moderate the relationship between disclosure and disclosure quality among Egyptian listed firms is consistent with this reading, since it indicates that the quality of reported information is determined by internal governance rather than by the existence of the mandate alone — though that study, too, examines disclosure quality rather than internal measurement practice directly, so the inference from disclosure quality to measurement architecture remains an extrapolation rather than a directly tested finding.\nThe consequence is a systematic asymmetry in reliability between the two categories of information now appearing in the annual report. Financial information is produced by a controlled system, subject to recognised standards, and independently audited; sustainability information, in the general case, satisfies none of these three conditions as a matter of regulatory requirement, whatever individual entities may do voluntarily. Yet both are presented within a single reporting package and may be used by investors as though comparable in reliability. Signalling theory identifies the difficulty precisely: an unverified signal that is costless to emit cannot discriminate between entities and so conveys limited information (Spence, 1973).\nThe contrast with Egypt's sovereign green bond issuance of 2020 is suggestive, though the comparison must be drawn carefully, since sovereign and corporate borrowing differ in their credit determinants, investor base and pricing mechanics, and the sovereign experience cannot be read as direct evidence about corporate-level financing costs. With that qualification, the instrument remains illustrative of the underlying mechanism: it was supported by a published financing framework, an independent external review and subsequent impact reporting, and it attracted subscription substantially in excess of the offering at a yield below that of comparable conventional issuance (World Bank, 2022). At the sovereign level, where sustainability claims were structured, externally verified and reported against, the market responded; whether an analogous effect holds for corporate issuers in Egypt is a tentative and, at present, untested question, since the existing corporate disclosure regime has not yet built the measurement and assurance conditions under which it could be observed.\n8.3 The Green Accounting Layer: Reporting Without Measurement\nGreen accounting is a measurement discipline before it is a disclosure practice. Its foundational claim is that conventional cost systems conceal environmental cost within general overhead, preventing management from attributing that cost to the products, processes and decisions generating it, and so from managing it (Schaltegger & Burritt, 2000). The corrective is to disaggregate environmental costs and trace them to their sources, so that they enter pricing, capital budgeting and process design as decision-relevant data — through instruments such as environmental cost accounting, material flow cost accounting, life-cycle costing and carbon accounting.\nThe incentive structure created by a disclosure mandate points current Egyptian practice towards the opposite configuration — an expectation grounded in the theoretical framework of Section 6.2 rather than a documented empirical finding, since this study did not collect entity-level evidence on internal measurement systems. On this reasoning, because the operative driver is a disclosure mandate, the expected sequence begins with the regulator's prescribed form, proceeds to the identification of the data required to complete it, and terminates once the return has been filed. This is the outside-in configuration described by Burritt and Schaltegger (2010), and on this reading it would be defective in three respects. First, the data collected are likely to be those required by the form rather than those required for management, so environmental information would not readily enter operational decision-making. Second, because the exercise is periodic and externally directed, a permanent measurement capability is unlikely to accumulate within the entity, so that each reporting cycle would substantially repeat the effort of the last. Third, to the extent that the resulting data are compiled outside the accounting system, they would not be reconcilable to financial records, which would preclude the analysis that gives green accounting its managerial value, namely the joint examination of physical and monetary flows.\nAn inside-out configuration would reverse this sequence: identifying the environmental cost drivers material to operations first, building measurement systems around those drivers, and generating external reporting as a by-product of the resulting internal data. Gray (2010) supplies a necessary qualification: even a well-constructed inside-out system accounts for organisational performance rather than ecological sustainability in any absolute sense, a limitation inherent in accounting's entity-based boundary rather than remediable through technique. The appropriate response is to characterise its output as information about an entity's environmental performance, disclosed alongside an explicit statement of the boundary within which it was measured.\n8.4 The Convergence: Digital Sustainability as an Architectural Problem\nThe foregoing analysis situates the three layers in a specific relation: substantial digital transaction infrastructure that does not extend to physical resource flows; a mandatory disclosure regime that specifies outputs without specifying the measurement systems producing them; and, on the theoretical reading developed above, a green accounting practice oriented towards external reporting rather than internal measurement. Digital sustainability, in the sense used here, is the architectural principle that would connect them.\nIts operative requirement is that sustainability data be admitted into the accounting information system as a first-class data class rather than a parallel compilation. Four conditions define such an architecture: capture at source, with physical consumption and emission data recorded at the point of occurrence through metering and sensor instrumentation, at the discipline applied to transaction capture; unified data governance, with sustainability data subject to defined ownership, documented methodology, version control and access control on the same basis as financial data; structured, taxonomy-based reporting, so disclosures become computable and comparable across entities and periods; and designed assurability, so an independent verifier can trace a reported figure to underlying evidence and re-perform its computation, since untraceable data cannot be assured, and unassured data will not command capital markets' confidence.\nThe technologies required for these conditions are available and, in significant part, already deployed within Egyptian industry — though for purposes distinct from sustainability measurement, a distinction worth making explicit since it might otherwise appear to sit uneasily beside the preceding account of manual, spreadsheet-based environmental data compilation. Enterprise resource planning systems, sensor networks and industrial internet-of-things instrumentation are used in Egyptian manufacturing and utilities chiefly for process control, predictive maintenance and quality assurance; they are not, on the available evidence, generally wired into sustainability reporting pipelines. There is, in other words, no contradiction between the presence of this operational instrumentation and the outside-in, largely manual compilation of ESG data described above: the two observations concern different uses of related technology. Enterprise resource planning systems can accommodate physical unit dimensions alongside monetary ones; the same sensor and internet-of-things instrumentation already installed for operational purposes can, in principle, be extended to capture consumption and emissions data automatically; analytical tools can process the resulting volumes; and distributed ledger technology can, where warranted, provide tamper-evident records of supply-chain provenance, though the literature indicates that its accounting applications remain predominantly conceptual and its governance requirements frequently underestimated (Garanina et al., 2022; Spanò et al., 2022). The binding constraint is therefore not the availability of underlying technology but the absence of a requirement — and, in most entities, the absence of an internal decision — to extend that technology's use to sustainability data with the same architectural discipline applied to financial data, together with the absence within the profession of the competence to construct and audit such an extension.\n8.5 Constraints and Tensions\nFive constraints require explicit acknowledgement, since a framework that ignores them cannot be implemented.\nThe first is professional competence. The integration described above requires practitioners capable of moving between accounting, environmental measurement and data engineering. Accounting education in Egypt, as in most jurisdictions, treats these as separate domains, and employers expect technological competence to supplement rather than replace conventional professional knowledge (Jackson et al., 2022). The supply of practitioners possessing the combined competence is presently insufficient, and this is the most severe near-term constraint upon implementation.\nThe second is assurance capability. Assuring automatically captured environmental data requires methods substantially different from those developed for documentary evidence, since reliability depends upon the calibration of instrumentation, the configuration of data pipelines and the controls governing them rather than upon the authenticity of documents. The continuous auditing literature anticipates this shift without yet supplying a settled methodology, and Egyptian practice has limited accumulated experience in the area.\nThe third is the environmental cost of digital infrastructure itself. Data centres, network infrastructure, computation and the hardware lifecycle carry material energy and resource consequences; a reporting architecture that expands data capture without accounting for its own footprint reproduces, at the level of the information system, the externalisation it was designed to correct. Analytical consistency requires that this footprint be included within the reporting boundary.\nThe fourth is cybersecurity. Centralising financial, operational and environmental data within integrated systems concentrates risk, and a breach affecting environmental data would compromise reported figures as directly as one affecting financial records — security is a condition of reporting reliability, not a separate technical concern.\nThe fifth is proportionality with respect to smaller entities. The disclosure regime applies capital thresholds that exempt smaller companies, and this exemption is defensible in respect of reporting burden. It nonetheless produces a structural consequence, since smaller entities constitute a substantial share of employment and environmental impact in Egypt and are frequently situated within the supply chains of reporting entities. As reporting entities are increasingly required to account for value-chain emissions, the data burden migrates towards suppliers that are exempt from the obligation and lack the capability to respond. Any workable national framework must therefore incorporate a simplified measurement pathway for smaller entities.\n8.6 Alignment with Egypt Vision 2030\nThe framework outlined above corresponds to the architecture of Egypt Vision 2030 in three respects. In its economic dimension, reliable and comparable sustainability information would reduce the informational friction that raises emerging-market issuers' cost of capital, supporting the strategy's investment and competitiveness objectives; the sovereign green bond experience offers a tentative, illustrative precedent, since credible signalling attracted capital on improved terms at the sovereign level (World Bank, 2022), though extending that inference to corporate issuers requires the caution noted in Section 8.2. In its environmental dimension, the measurement discipline green accounting supplies is a precondition of the strategy's resource-efficiency, emissions-reduction and circular-economy objectives, since unmeasured consumption cannot be verifiably reduced (Ministry of Planning and Economic Development, 2023). In its governance dimension, structured, machine-readable reporting advances the strategy's transparency and accountability objectives, since computable disclosure permits systematic supervisory analysis rather than document-by-document review.\nThe correspondence extends to the strategy's own logic: Egypt Vision 2030 treats digital transformation as an instrument for delivering sustainable development, not an objective in itself. The framework proposed here applies that logic to accounting specifically, treating its digitalisation not as an efficiency programme but as the infrastructure upon which credible sustainability measurement depends.\nThe study yields four analytical conclusions, derived from the documentary evidence and theoretical analysis presented above rather than from primary empirical data, corresponding respectively to the four research objectives and questions.\nFirst, the transition to digital accounting and financial reporting in Egypt has been state-led, fiscally motivated and structurally significant, but it is asymmetrically developed. Its achievements are concentrated in transaction capture, validation and tax administration, and it has raised the baseline quality of transactional accounting data across the formal economy. Its architecture is nonetheless organised around the transaction as the unit of record, and consequently does not capture the physical resource flows in which environmental performance is measured. The transition has therefore created a necessary but insufficient foundation for sustainability measurement.\nSecond, the sustainability disclosure regime introduced by Decrees No. 107 and No. 108 of 2021 has established comparability at the level of reported output and has aligned Egypt with the architecture of the emerging international baseline through its adoption of the climate-related disclosure structure of the Task Force on Climate-related Financial Disclosures. It has not, however, established corresponding requirements concerning measurement methodology, data governance or independent assurance. The regime therefore mandates disclosure without mandating the measurement architecture that would render the disclosure reliable, and the predictable outcome, consistent with legitimacy and institutional theory, is compliance-oriented reporting at risk of decoupling from operational practice.\nThird, green accounting in Egypt is, on the theoretical reading developed in this study, presently configured along outside-in lines, in which the regulator's prescribed form determines what is measured, with the consequence that environmental data would be compiled periodically outside the accounting information system, would not be reconcilable to financial records, and would not readily inform managerial decisions. Embedding green accounting within digital accounting infrastructure is technically feasible and requires four conditions: capture of physical data at source, unified governance of sustainability and financial data, structured taxonomy-based reporting, and system design that permits independent verification. Satisfaction of these conditions would convert environmental reporting from a periodic compliance exercise into a continuous measurement capability.\nFourth, the binding constraint upon integration is institutional and human rather than technological. The requisite technologies are available and substantially deployed for operational purposes, but not extended to sustainability measurement; what is absent is a regulatory requirement that sustainability data be produced under the governance and control discipline applied to financial data, a settled assurance methodology for automatically captured non-financial data, and a supply of practitioners competent across accounting, environmental measurement and data engineering. Three further constraints qualify any implementation: the environmental footprint of the reporting infrastructure itself, the concentration of cybersecurity risk within integrated systems, and the migration of data burdens towards smaller entities that are exempt from the disclosure obligation yet situated within the value chains of reporting entities.\n10. Recommendations\n10.1 Practical Recommendations\nAddressed to regulatory authorities, and following from the second and fourth findings, it is recommended that the existing disclosure requirement be complemented by minimum requirements on the measurement basis of reported sustainability data — documented methodology, defined organisational and reporting boundaries, and retention of underlying evidence — and that a phased pathway towards independent limited assurance of core metrics be published in advance so preparers and audit firms can build capability against a known timetable. A national, machine-readable sustainability taxonomy is further recommended, enabling systematic supervisory analysis and cross-entity comparison, together with a simplified measurement pathway for smaller entities in reporting entities' value chains, so the exemption threshold does not generate an unmet data burden.\nAddressed to preparers, and following from the third finding, it is recommended that sustainability measurement be repositioned as an inside-out capability originating in material environmental cost drivers; that physical unit dimensions be incorporated within existing enterprise resource planning systems rather than parallel spreadsheets; that ownership of sustainability data be assigned within finance under the same control framework as financial data; and that operational sensor and internet-of-things instrumentation already installed for process purposes be extended, where feasible, to feed sustainability reporting rather than treated as a separate future investment, with the reporting infrastructure's own footprint brought within the reporting boundary.\nAddressed to the auditing profession, and following from the fourth finding, it is recommended that professional bodies develop and publish guidance on assurance over automatically captured non-financial data, addressing in particular the evaluation of instrumentation integrity, data pipeline controls and computational reproducibility, since the migration of evidence from documents to systems requires a corresponding migration of audit methodology.\nAddressed to universities and professional education providers, and following from the fourth finding, it is recommended that accounting curricula integrate environmental measurement and data analytics within the accounting programme itself rather than treating them as separate electives, in order to develop the combined competence that implementation requires.\n10.2 Recommendations for Future Research\nFollowing from the first and second findings, empirical investigation into the actual quality of disclosures filed under Decrees No. 107 and No. 108 — through content analysis of filed returns across successive cycles — would establish whether quality has improved over time and which entity characteristics predict improvement. Following from the third finding, case-based research within Egyptian entities — through surveys, interviews or documented case studies — would test directly the theoretical expectation advanced in this study regarding outside-in measurement practice, and would establish the organisational conditions under which an inside-out configuration is achievable, and at what cost; this is, in the present study's own assessment, the most pressing empirical gap it leaves open. Following from the fourth finding, research into the association between assurance of sustainability information and the cost of capital for Egyptian issuers would test directly the signalling proposition advanced in this study, including whether the sovereign-level effect observed in the green bond market extends, in any degree, to corporate issuers. Finally, comparative research across Middle Eastern and North African jurisdictions pursuing convergence with the standards of the International Sustainability Standards Board would situate the Egyptian trajectory within its regional context and identify transferable implementation lessons.\n11. Conclusion\nThis study examined whether the transition to digital accounting and financial reporting in Egypt provides an operative infrastructure for institutionalising green accounting and digital sustainability under Egypt Vision 2030. Employing a descriptive-analytical method grounded in documentary analysis of regulatory instruments, national strategy documents, standard-setter pronouncements and peer-reviewed literature covering the period from 2016 to 2026, and interpreting that evidence through stakeholder, legitimacy, institutional, signalling and technology-adoption perspectives, the analysis established that Egypt has constructed substantial digital capability organised around the transaction and a mandatory disclosure regime organised around prescribed output, while leaving unaddressed the measurement architecture that would connect them. Claims in this study about internal entity-level practice are advanced as theoretical expectations consistent with that architecture, not as documented empirical findings, and are offered as hypotheses for the primary research recommended in Section 10.2. The principal conclusion is that the decisive constraint is institutional rather than technological: sustainability information will attain the reliability of financial information only when it is produced within the same system, under the same governance, and subject to the same verification. The contribution of the study lies in reframing digital sustainability in accounting as an architectural and governance question rather than a technological one, and in specifying, for a mandated emerging-market disclosure regime, the four conditions under which green accounting can be embedded within digital accounting infrastructure rather than layered upon it.";/*KB-END*/

function calc(st){
  st=st||S;
  const fac=c=>(st.factors||[]).find(f=>f.cat===c)||{kg:0,scope:3,src:""};
  const R=(st.rows||[]).map(r=>{const f=fac(r.cat);return {...r,t:(+r.qty||0)*f.kg/1000,scope:f.scope,doc:!!(f.src&&f.src.trim())}});
  const tot=R.reduce((a,r)=>a+r.t,0)||0, cost=R.reduce((a,r)=>a+(+r.cost||0),0);
  const sc={1:0,2:0,3:0}; R.forEach(r=>sc[r.scope]+=r.t);
  const months=MONTHS.map(()=>({1:0,2:0,3:0,cost:0}));
  R.forEach(r=>{const k=months[(r.m||1)-1];k[r.scope]+=r.t;k.cost+=+r.cost||0});
  const cats={};R.forEach(r=>{const c=cats[r.cat]||(cats[r.cat]={t:0,cost:0,qty:0,n:0});c.t+=r.t;c.cost+=+r.cost||0;c.qty+=+r.qty||0;c.n++});
  const W=R.map(r=>r.t||0), sw=W.reduce((a,b)=>a+b,0)||1;
  const wavg=fn=>R.reduce((a,r,i)=>a+fn(r)*W[i],0)/sw*100;
  const c1=wavg(r=>METHODS[r.method]?METHODS[r.method].w:0);
  const c2=(wavg(r=>r.owner==="finance"?1:0)+wavg(r=>r.doc?1:0))/2;
  const c3=wavg(r=>(r.cat&&r.site&&r.m&&(+r.qty>0)&&(+r.cost>0))?1:0);
  const c4=(wavg(r=>r.ev?1:0)+wavg(r=>(r.inv&&r.inv.trim())||r.method==="meter"?1:0))/2;
  const idx=R.length?(c1+c2+c3+c4)/4:0;
  const recon=R.length?R.filter(r=>r.inv&&r.inv.trim()).length/R.length*100:0;
  const evid=R.length?R.filter(r=>r.ev).length/R.length*100:0;
  const finOwn=R.length?R.filter(r=>r.owner==="finance").length/R.length*100:0;
  return {R,tot,cost,sc,months,cats,c:[c1,c2,c3,c4],idx,recon,evid,finOwn};
}

function copy(txt,okMsg){

}

}

}

  if(!out.length)out.push({k:"✓",h:tr("All four conditions are met","الشروط الأربعة مستوفاة"),d:tr("Next step from the paper: a phased path to independent limited assurance of core metrics.","الخطوة التالية وفق البحث: مسار مرحلي نحو تأكيد محدود مستقل للمؤشرات الأساسية.")});

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function monthChart(C){
  const el=$("mchart");if(!el)return;
  const W=560,H=250,L=44,B=26,T=10,Rr=8,iw=W-L-Rr,ih=H-T-B;
  const tots=C.months.map(m=>m[1]+m[2]+m[3]);const mx=Math.max(...tots,1);
  const step=niceStep(mx/4),top=Math.ceil(mx/step)*step;const y=v=>T+ih-v/top*ih;
  const bw=iw/12, w=Math.max(6,bw*.62);
  let g="";for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`}
  let bars="";
  C.months.forEach((m,i)=>{
    const x=L+i*bw+(bw-w)/2;let acc=0;const segs=[1,2,3].filter(s=>m[s]>0);
    segs.forEach((s,j)=>{const y0=y(acc);acc+=m[s];const y1=y(acc);const bot=j>0?y0-2:y0,h=bot-y1;if(h<=0)return;
      if(j===segs.length-1){const r=Math.min(4,h/2,w/2);bars+=`<path d="M${x},${bot} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+w-r} Q${x+w},${y1} ${x+w},${y1+r} V${bot} Z" fill="var(--s${s})"/>`}
      else bars+=`<rect x="${x}" y="${y1}" width="${w}" height="${h}" fill="var(--s${s})"/>`;});
    bars+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-m="${i}"/>`;
    bars+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(AR()?String(i+1):t(MONTHS[i]))}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(tr("Monthly emissions by scope","الانبعاثات الشهرية حسب النطاق")))}">${g}<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>${bars}</svg><div class="tip" hidden></div>`;
  const tip=el.querySelector(".tip"),svg=el.querySelector("svg");
  svg.querySelectorAll("[data-m]").forEach(r=>{
    const show=()=>{const i=+r.dataset.m,m=C.months[i];
      tip.innerHTML=`<b>${esc(t(MONTHS[i]))} ${esc(S.entity.year)}</b>${[1,2,3].map(s=>`<div><span>${esc(t(tr("Scope ","النطاق ")))}${s}</span><span class="num">${nf(m[s],1)}</span></div>`).join("")}<div><span>${esc(t(tr("Total","الإجمالي")))}</span><span class="num">${nf(m[1]+m[2]+m[3],1)}</span></div>`;
      tip.hidden=false;const bb=svg.getBoundingClientRect(),sx=bb.width/W;let px=(L+i*bw+bw/2)*sx;
      px=Math.min(Math.max(px-80,0),bb.width-170);tip.style.left=px+"px";tip.style.top="0px";
      r.setAttribute("fill","var(--grid)");r.setAttribute("fill-opacity",".35")};
    const hide=()=>{tip.hidden=true;r.setAttribute("fill","transparent")};
    r.addEventListener("mouseenter",show);r.addEventListener("mouseleave",hide);r.addEventListener("click",show);
  });
  $("mtable").innerHTML=`<div class="tw"><table><thead><tr><th>${esc(t(tr("Month","الشهر")))}</th>${[1,2,3].map(s=>`<th class="n">${esc(t(tr("Scope ","النطاق ")))}${s}</th>`).join("")}<th class="n">${esc(t(tr("Total","الإجمالي")))}</th></tr></thead><tbody>${C.months.map((m,i)=>`<tr><td>${esc(t(MONTHS[i]))}</td>${[1,2,3].map(s=>`<td class="n">${nf(m[s],1)}</td>`).join("")}<td class="n">${nf(m[1]+m[2]+m[3],1)}</td></tr>`).join("")}</tbody></table></div>`;
}

      <div class="slider"><div class="mh"><label for="eff">${esc(t(tr("Electricity efficiency saving","وفر كفاءة الكهرباء")))}</label><b class="mono">${S.eff}%</b></div><input type="range" id="eff" min="0" max="40" step="1" value="${S.eff}"></div>
      <div class="slider" style="margin-block-start:10px"><div class="mh"><label for="solar">${esc(t(tr("Share of remaining electricity from on-site solar","حصة الطاقة الشمسية الذاتية من الكهرباء المتبقية")))}</label><b class="mono">${S.solar}%</b></div><input type="range" id="solar" min="0" max="60" step="1" value="${S.solar}"></div>
      <div class="kpis" style="margin-block-start:14px">
        ${kpi(tr("Emissions after levers","الانبعاثات بعد التدابير"),nf(Z.newTot,1),"tCO₂e · −"+nf(C.tot?(1-Z.newTot/C.tot)*100:0,1)+"%",tr("The footprint if both levers were applied for a full year. The percentage is the cut against today.","البصمة لو طُبقت الرافعتان لعام كامل. النسبة هي التخفيض مقارنة باليوم."))}
        ${kpi(tr("Energy bill saved by efficiency","وفر فاتورة الكهرباء من الكفاءة"),nf(Z.effC/1e6,2),t(tr("EGP million per year","مليون جنيه سنوياً")),tr("Cash saved on electricity from efficiency alone. Solar savings are left out because they depend on the investment cost.","النقد الموفر من الكهرباء بالكفاءة فقط. وفر الطاقة الشمسية غير محتسب لأنه يعتمد على تكلفة الاستثمار."))}
        ${kpi(tr("Carbon cost avoided","تكلفة الكربون المتجنبة"),nf((Z.shadow-Z.shadowNew)/1e6,2),t(tr("EGP million at your price","مليون جنيه بسعرك")),tr("The hidden carbon cost removed by the two levers, at your internal price. Use it in capital budgeting next to the cash saving.","تكلفة الكربون الخفية التي تزيلها الرافعتان بسعرك الداخلي. استخدمها في الموازنة الرأسمالية بجانب الوفر النقدي."))}
      </div>
      <p class="small muted" style="margin-block-start:10px">${esc(t(tr("Solar capex and its own lifecycle footprint are outside this sketch. The paper asks that the footprint of the digital and energy infrastructure be brought inside the boundary (§8.5).","تكلفة الاستثمار في الطاقة الشمسية وبصمتها خلال دورة حياتها خارج هذا التقدير. يطالب البحث بإدخال بصمة البنية الرقمية والطاقية داخل الحدود (§8.5).")))}</p>
    </div>
  </section>
  <section class="panel">
    <div class="head"><div><h2>${esc(t(tr("Cost per category, with carbon priced in","التكلفة لكل فئة مع تسعير الكربون")))}</h2><p class="muted small">${esc(t(tr("Paid cost from the ledger plus emissions at your internal price.","التكلفة المدفوعة من الدفتر مضافاً إليها الانبعاثات بسعرك الداخلي.")))}</p></div></div>
    <div class="tw"><table><thead><tr><th>${esc(t(tr("Category","الفئة")))}</th><th class="n">${esc(t(tr("Paid (EGP)","المدفوع (جنيه)")))}</th><th class="n">${esc(t(tr("Carbon at internal price","الكربون بالسعر الداخلي")))}</th><th class="n">${esc(t(tr("Full cost","التكلفة الكاملة")))}</th><th class="n">${esc(t(tr("Uplift","الزيادة")))}</th></tr></thead><tbody>
    ${Object.keys(CATS).filter(k=>C.cats[k]).map(k=>{const c=C.cats[k],cc=c.t*S.price;return `<tr><td>${esc(t(CATS[k].n))}</td><td class="n">${nf(c.cost)}</td><td class="n">${nf(cc)}</td><td class="n">${nf(c.cost+cc)}</td><td class="n">${c.cost?"+"+nf(cc/c.cost*100,1)+"%":"—"}</td></tr>`}).join("")}
    </tbody></table></div>
    ${howto(tr("“Uplift” is how much the full cost exceeds the bill. The category with the highest uplift is where a product's price most understates its environmental cost.","«الزيادة» هي مقدار تجاوز التكلفة الكاملة للفاتورة. الفئة ذات الزيادة الأعلى هي التي يقلل فيها السعر أكثر من التكلفة البيئية."))}
  </section>`;
};

/* ---------- disclosure & report ---------- */
VIEWS.disclose=function(C){
  const e=S.entity, b=band(C.idx), sup=e.tier==="supplier";
  const undoc=S.factors.filter(f=>!(f.src&&f.src.trim())&&C.cats[f.cat]).map(f=>t(CATS[f.cat].n));
  const bnd={operational:tr("operational control","السيطرة التشغيلية"),financial:tr("financial control","السيطرة المالية"),equity:tr("equity share","حصة الملكية")}[e.boundary];
  const L=AR();
  const metrics=`<ul>
    <li>${esc(t(tr("Scope 1","النطاق 1")))}: <b class="num">${nf(C.sc[1],1)}</b> tCO₂e</li>
    <li>${esc(t(tr("Scope 2 (location-based)","النطاق 2 (على أساس الموقع)")))}: <b class="num">${nf(C.sc[2],1)}</b> tCO₂e</li>
    ${sup?"":`<li>${esc(t(tr("Scope 3 (water supply, waste to landfill only)","النطاق 3 (إمدادات المياه والنفايات للمدافن فقط)")))}: <b class="num">${nf(C.sc[3],1)}</b> tCO₂e</li>`}
    ${Object.keys(CATS).filter(k=>C.cats[k]&&(!sup||["electricity","natgas","diesel","petrol"].includes(k))).map(k=>`<li>${esc(t(CATS[k].n))}: <span class="num">${nf(C.cats[k].qty)} ${CATS[k].u}</span></li>`).join("")}
  </ul>`;
  const quality=`<p>${esc(L?`مؤشر القابلية للتأكيد: ${nf(C.idx,0)}/100 (${t(b.n)}). ${nf(C.c[0],0)}٪ من الانبعاثات مرصودة عند المصدر، و${nf(C.recon,0)}٪ من السجلات مطابقة مع فاتورة إلكترونية. ${undoc.length?`معاملات غير موثقة بعد: ${undoc.join("، ")}.`:"جميع المعاملات موثقة المصدر."} لم تخضع هذه البيانات لتأكيد مستقل.`:`Assurability index: ${nf(C.idx,0)}/100 (${t(b.n)}). ${nf(C.c[0],0)}% of emissions are captured at source and ${nf(C.recon,0)}% of records reconcile to an e-invoice. ${undoc.length?`Factors not yet documented: ${undoc.join(", ")}.`:"All factors have a documented source."} These data have not been independently assured.`)}</p>`;
  const body=sup?`
    <h3>${esc(t(tr("Supplier data sheet (simplified pathway)","ورقة بيانات المورد (المسار المبسط)")))}</h3>
    <p>${esc(L?`${e.name} غير مشمولة بالإفصاح الإلزامي، لكنها تقع في سلسلة قيمة جهات مُفصِحة. تقدم هذه الورقة الحد الأدنى من بيانات الطاقة والوقود التي يحتاجها العملاء لحساب انبعاثات النطاق 3، وفق المسار المبسط الذي يوصي به البحث (§8.5، §10.1).`:`${e.name} is outside the mandatory disclosure threshold but sits in the value chain of reporting entities. This sheet gives customers the minimum energy and fuel data they need for their Scope 3, following the simplified pathway the paper recommends (§8.5, §10.1).`)}</p>
    <h3>${esc(t(tr("Metrics","المؤشرات")))} · ${esc(e.year)}</h3>${metrics}
    <h3>${esc(t(tr("Data quality","جودة البيانات")))}</h3>${quality}`:`
    <h3>${esc(t(tr("1 · Governance","1 · الحوكمة")))}</h3>
    <p>${esc(L?`تُسند ملكية بيانات الاستدامة إلى ${C.c[1]>=70?"الإدارة المالية وتخضع لإطار الرقابة الداخلية المطبق على البيانات المالية":"عدة إدارات، ويجري نقلها إلى الإدارة المالية تحت إطار الرقابة الداخلية"}. [أضف: دور مجلس الإدارة ولجنة المراجعة في الإشراف على المخاطر المناخية].`:`Ownership of sustainability data ${C.c[1]>=70?"sits with Finance under the internal control framework applied to financial data":"is spread across functions and is being moved under Finance and the internal control framework"}. [Add: the board's and audit committee's oversight of climate-related risks.]`)}</p>
    <h3>${esc(t(tr("2 · Strategy","2 · الاستراتيجية")))}</h3>
    <p>${esc(L?`عند سعر كربون داخلي قدره ${nf(S.price)} جنيه للطن، تبلغ تكلفة الكربون غير المسعرة ${nf(C.tot*S.price/1e6,2)} مليون جنيه، أي ${C.cost?nf(C.tot*S.price/C.cost*100,1):0}٪ فوق التكلفة البيئية المدفوعة. [أضف: المخاطر والفرص المناخية الجوهرية وأثرها على خطة العمل].`:`At an internal carbon price of EGP ${nf(S.price)} per tonne, unpriced carbon cost is EGP ${nf(C.tot*S.price/1e6,2)} million, ${C.cost?nf(C.tot*S.price/C.cost*100,1):0}% above the environmental cost actually paid. [Add: material climate-related risks and opportunities and their effect on the business plan.]`)}</p>
    <h3>${esc(t(tr("3 · Risk management","3 · إدارة المخاطر")))}</h3>
    <p>${esc(L?`تُرصد تدفقات الطاقة والمياه والنفايات شهرياً لكل موقع في الدفتر نفسه الذي يسجل تكلفتها، مما يسمح بمطابقتها مع السجلات المالية. [أضف: كيفية دمج المخاطر المناخية في إدارة المخاطر المؤسسية].`:`Energy, water and waste flows are recorded monthly per site in the same ledger as their cost, so they reconcile to financial records. [Add: how climate risks are integrated into enterprise risk management.]`)}</p>
    <h3>${esc(t(tr("4 · Metrics & targets","4 · المؤشرات والمستهدفات")))} · ${esc(e.year)}</h3>${metrics}
    <p>${esc(L?`كثافة الانبعاثات: ${C.cost?nf(C.tot/(C.cost/1e6),1):0} طن CO₂e لكل مليون جنيه من التكلفة البيئية المتتبعة. [أضف: المستهدفات وسنة الأساس].`:`Intensity: ${C.cost?nf(C.tot/(C.cost/1e6),1):0} tCO₂e per EGP million of traced environmental cost. [Add: targets and base year.]`)}</p>`;
  return `
  <section class="panel">
    <div class="head"><div><h2>${esc(t(tr("Download the full report","تنزيل التقرير الكامل")))}</h2><p class="muted small">${esc(t(tr("One Word document with the dashboard figures and their meaning, the four conditions, the disclosure draft, the governance self-assessment and the auditor checklist. For PDF, open it in Word and choose Save as PDF.","ملف Word واحد يضم أرقام اللوحة ومعانيها، والشروط الأربعة، ومسودة الإفصاح، والتقييم الذاتي للحوكمة، وقائمة فحص المراجع. للحصول على PDF افتحه في Word واختر «حفظ بتنسيق PDF».")))}</p></div>
      <div class="row"><button class="btn pri" type="button" data-act="report">${esc(t(tr("Download Word report","تنزيل تقرير Word")))}</button><button class="btn" type="button" data-act="reportCopy">${esc(t(tr("Copy report as text","نسخ التقرير كنص")))}</button></div></div>
  </section>
  <section class="panel">
    <div class="head"><div><h2>${esc(t(sup?tr("Supplier data sheet","ورقة بيانات المورد"):tr("Climate disclosure draft","مسودة الإفصاح المناخي")))}</h2><p class="muted small">${esc(t(sup?tr("Generated from the ledger for an entity below the FRA thresholds.","مولدة من الدفتر لجهة دون حدود الرقابة المالية."):tr("Generated from the ledger and structured on the four TCFD pillars that FRA climate disclosure follows. This is a working draft for the preparer, not the official FRA form. Text in [brackets] needs management input.","مولدة من الدفتر ومنظمة على ركائز TCFD الأربع التي يتبعها الإفصاح المناخي لدى الرقابة المالية. هذه مسودة عمل للمُعِدّ وليست النموذج الرسمي. النص بين [أقواس] يحتاج مدخلات الإدارة.")))}</p></div>
      <div class="row"><button class="btn" type="button" data-act="copyDraft">${esc(t(tr("Copy draft text","نسخ نص المسودة")))}</button></div></div>
    <div class="out" id="draft">
      <p class="small muted">${esc(e.name)} · ${esc(e.sector)} · ${esc(t(TIERS[e.tier]))}</p>
      ${body}
      <h3>${esc(t(tr("Boundary & methodology","الحدود والمنهجية")))}</h3>
      <p>${esc(L?`تغطي الأرقام العمليات الخاضعة لـ${t(bnd)} لدى ${e.name} خلال ${e.year}. وهي معلومات عن الأداء البيئي للمنشأة داخل هذه الحدود، وليست قياساً للاستدامة البيئية بالمعنى المطلق. المعاملات المستخدمة:`:`Figures cover operations under the ${t(bnd)} of ${e.name} for ${e.year}. They are information about the entity's environmental performance within that boundary, not a measure of ecological sustainability in an absolute sense. Factors used:`)}</p>
      <ul>${S.factors.filter(f=>C.cats[f.cat]).map(f=>`<li>${esc(t(CATS[f.cat].n))}: <span class="num">${f.kg}</span> kg CO₂e/${CATS[f.cat].u} · ${esc(f.src&&f.src.trim()?f.src:t(tr("source not documented","المصدر غير موثق")))}</li>`).join("")}</ul>
      ${sup?"":`<h3>${esc(t(tr("Data quality","جودة البيانات")))}</h3>${quality}`}
    </div>
  </section>
  <section class="panel">
    <div class="head"><div><h2>${esc(t(tr("Machine-readable version","النسخة القابلة للقراءة آلياً")))}</h2><p class="muted small">${esc(t(tr("The paper recommends a national, machine-readable sustainability taxonomy (§10.1). This JSON shows what a computable disclosure looks like: every value tagged, traceable to the ledger.","يوصي البحث بتصنيف وطني للاستدامة قابل للقراءة آلياً (§10.1). يوضح هذا الملف شكل الإفصاح القابل للحساب: كل قيمة موسومة ويمكن تتبعها إلى الدفتر.")))}</p></div>
      <button class="btn" type="button" data-act="copyJson">${esc(t(tr("Copy JSON","نسخ JSON")))}</button></div>
    <pre class="json" id="djson" dir="ltr">${esc(JSON.stringify(taxo(C),null,2))}</pre>
    ${howto(tr("each key is a tag (for example env.ghg.scope1.tco2e = Scope 1 emissions in tonnes). A regulator's system could read thousands of these files and compare companies automatically.","كل مفتاح وسم (مثلاً env.ghg.scope1.tco2e = انبعاثات النطاق 1 بالطن). يستطيع نظام الجهة الرقابية قراءة آلاف هذه الملفات ومقارنة الشركات آلياً."))}
  </section>`;
};
function taxo(C){
  const r=v=>Math.round(v*100)/100;
  return {
    "eg.entity":{name:S.entity.name,sector:S.entity.sector,period:S.entity.year,obligation:S.entity.tier,consolidation:S.entity.boundary},
    "env.ghg.scope1.tco2e":r(C.sc[1]),"env.ghg.scope2.location.tco2e":r(C.sc[2]),"env.ghg.scope3.partial.tco2e":r(C.sc[3]),
    "env.activity":Object.fromEntries(Object.keys(C.cats).map(k=>[k,{quantity:r(C.cats[k].qty),unit:CATS[k].u,cost_egp:r(C.cats[k].cost),tco2e:r(C.cats[k].t),records:C.cats[k].n}])),
    "env.methodology.factors":S.factors.map(f=>({category:f.cat,kgco2e_per_unit:f.kg,scope:f.scope,source:f.src||null})),
    "dq.assurability":{index:r(C.idx),capture_at_source:r(C.c[0]),unified_governance:r(C.c[1]),structured_reporting:r(C.c[2]),designed_assurability:r(C.c[3]),einvoice_reconciled_pct:r(C.recon),independently_assured:false},
    "gov.self_assessment":Object.fromEntries(THEMES.map(th=>[th.id,{egypt:(S.gov[th.id]||{}).eg??null,global:(S.gov[th.id]||{}).gl??null}])),
    "mgmt.internal_carbon_price_egp":S.price
  };
}

    return `<div class="q"><b>${esc(t(x.n))}</b><span class="small"><span class="tag">${esc(t(tr("Egypt","مصر")))}</span> ${esc(t(x.qe))}</span>${sc("eg")}<span class="small"><span class="tag">${esc(t(tr("Global","عالمي")))}</span> ${esc(t(x.qg))}</span>${sc("gl")}</div>`}).join("")}
  </section>`;

function radarChart(){
  const el=$("radar");if(!el)return;const G=govScores();
  const W=440,H=380,cx=220,cy=190,R=130,n=THEMES.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/3,cy+Math.sin(a)*R*v/3]};
  let g="";for(let k=1;k<=3;k++){g+=`<polygon points="${THEMES.map((_,i)=>pt(i,k).join(",")).join(" ")}" fill="none" stroke="var(--grid)"/>`}
  THEMES.forEach((x,i)=>{const [x2,y2]=pt(i,3);g+=`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--grid)"/>`;
    const [lx,ly]=pt(i,3.55);const anc=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";g+=`<text class="lbl" x="${lx}" y="${ly+4}" text-anchor="${anc}">${esc(t(x.s))}</text>`});
  const poly=(arr,c)=>`<polygon points="${arr.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="var(${c})" fill-opacity=".16" stroke="var(${c})" stroke-width="2"/>`+arr.map((v,i)=>{const [x,y]=pt(i,v);return `<circle cx="${x}" cy="${y}" r="4" fill="var(${c})" stroke="var(--surface)" stroke-width="2"/>`}).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="radar">${g}${[1,2,3].map(k=>`<text x="${cx+4}" y="${cy-R*k/3+4}">${k}</text>`).join("")}${poly(G.eg,"--s1")}${poly(G.gl,"--s3")}</svg>`;
}

async function saveFile(name,data,type){
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:new Blob([data],{type})});return}
  }catch(e){if(e&&e.code&&e.code!=="unavailable"){if(e.code!=="cancelled"&&e.code!=="declined")toast(t(tr("Download was not completed","لم يكتمل التنزيل")));return}}
  try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast(t(tr("Downloads are blocked here. Use the copy button instead.","التنزيل محظور هنا. استخدم زر النسخ.")))}
}

 {k:["digital sustainability","الاستدامة الرقمية"],a:tr("Digital sustainability has two senses in the paper (§6.1): using digital technology to advance environmental and social goals, and the sustainability of digital systems themselves (data-centre energy, hardware lifecycle, security). Both must be kept in view.","للاستدامة الرقمية معنيان في البحث (§6.1): استخدام التقنية الرقمية لخدمة الأهداف البيئية والاجتماعية، واستدامة الأنظمة الرقمية ذاتها (طاقة مراكز البيانات، دورة حياة الأجهزة، الأمن). ويجب مراعاة الاثنين.")},
 {k:["107","108","decree","fra","قرار","الرقابة المالية"],a:tr("FRA Decrees 107 and 108 of 2021 require EGX-listed companies and non-bank financial institutions above capital thresholds to publish annual ESG disclosures on prescribed forms, with TCFD-structured climate disclosure for larger entities. Their limit: they prescribe the output, not the measurement system, controls or assurance (§8.2).","يُلزم قرارا الرقابة المالية 107 و108 لسنة 2021 الشركات المقيدة والمؤسسات المالية غير المصرفية فوق حدود رأس مال معينة بإفصاح سنوي عن ESG بنماذج محددة، مع إفصاح مناخي وفق TCFD للجهات الأكبر. حدودهما: يحددان المخرج لا نظام القياس أو الرقابة أو التأكيد (§8.2).")},
 {k:["invoice","e-invoice","فاتورة","الفاتورة"],a:tr("Egypt's e-invoice and e-receipt systems raised data quality across the formal economy and changed audit evidence, but they record the money paid, not the kWh, m³ or emissions behind it. That is why the workbench stores both (§8.1).","رفعت منظومتا الفاتورة والإيصال الإلكتروني جودة البيانات في الاقتصاد الرسمي وغيرتا طبيعة أدلة المراجعة، لكنهما تسجلان المبلغ المدفوع لا الكيلوواط ساعة أو المتر المكعب أو الانبعاثات. لذلك تخزن المنصة الاثنين معاً (§8.1).")},
 {k:["outside","inside","الخارج","الداخل"],a:tr("Outside-in (Burritt & Schaltegger, 2010): the regulator's form decides what is measured. Inside-out: management first identifies material environmental cost drivers, measures them, and reporting follows as a by-product. The paper expects Egyptian practice to be outside-in (§8.3).","من الخارج للداخل (Burritt & Schaltegger, 2010): نموذج الجهة الرقابية يحدد ما يُقاس. من الداخل للخارج: تحدد الإدارة أولاً محركات التكلفة البيئية الجوهرية وتقيسها، ثم يأتي التقرير كناتج ثانوي. يتوقع البحث أن الممارسة المصرية من الخارج للداخل (§8.3).")},
 {k:["recommend","توصي","توصيات"],a:tr("Recommendations (§10.1): regulators add minimum measurement requirements and a phased path to limited assurance, a machine-readable taxonomy, and a simplified pathway for SMEs; preparers move to inside-out measurement inside the ERP under Finance; auditors get guidance on assuring system-captured data; universities integrate environmental measurement and analytics into accounting curricula.","التوصيات (§10.1): الجهات الرقابية تضيف حداً أدنى لمتطلبات القياس ومساراً مرحلياً للتأكيد المحدود، وتصنيفاً قابلاً للقراءة آلياً، ومساراً مبسطاً للشركات الصغيرة؛ والمُعِدّون ينتقلون للقياس من الداخل للخارج داخل ERP تحت الإدارة المالية؛ والمراجعون يحصلون على إرشادات لتأكيد البيانات المرصودة آلياً؛ والجامعات تدمج القياس البيئي والتحليلات في مناهج المحاسبة.")},
 {k:["unesco","يونسكو","اليونسكو","ethic","أخلاق"],a:tr("The UNESCO Recommendation on the Ethics of AI (2021) sets 4 values, 10 principles and 11 policy areas, with the RAM and EIA tools. For green accounting the key principles are transparency, accountability, human oversight, privacy and sustainability, including assessing the footprint of digital systems themselves. See the Egypt & global frameworks tab.","توصية اليونسكو بشأن أخلاقيات الذكاء الاصطناعي (2021) تضع 4 قيم و10 مبادئ و11 مجالاً سياساتياً، مع أداتي RAM وEIA. أهم المبادئ للمحاسبة الخضراء: الشفافية والمساءلة والإشراف البشري والخصوصية والاستدامة، بما فيها تقييم بصمة الأنظمة الرقمية ذاتها. راجع تبويب «الأطر المصرية والعالمية».")},
 {k:["governance","حوكمة","الحوكمة","align","توافق"],a:tr("Egypt and global governance align on board accountability and data protection, partly align on disclosure, human oversight of AI, environmental footprint, skills and stakeholders, and show a gap on assurance of sustainability data. Details and meanings are in the alignment matrix.","تتوافق الحوكمة المصرية والعالمية في مساءلة المجلس وحماية البيانات، وتتوافق جزئياً في الإفصاح والإشراف البشري على الذكاء الاصطناعي والبصمة البيئية والمهارات وأصحاب المصالح، وتظهر فجوة في تأكيد بيانات الاستدامة. التفاصيل والمعاني في مصفوفة التوافق.")},
 {k:["index","score","assurab","مؤشر","درجة"],f:()=>{const C=calc(),b=band(C.idx);return tr(`The current assurability index is ${nf(C.idx,0)}/100 (${b.n.en}). Conditions: capture at source ${nf(C.c[0],0)}, governance ${nf(C.c[1],0)}, structured ${nf(C.c[2],0)}, assurability ${nf(C.c[3],0)}. ${b.m.en}`,`مؤشر القابلية للتأكيد حالياً ${nf(C.idx,0)}/100 (${b.n.ar}). الشروط: الرصد عند المصدر ${nf(C.c[0],0)}، الحوكمة ${nf(C.c[1],0)}، الهيكلة ${nf(C.c[2],0)}، قابلية التأكيد ${nf(C.c[3],0)}. ${b.m.ar}`)}},
 {k:["emission","scope","انبعاث","النطاق","كربون"],f:()=>{const C=calc();return tr(`Total emissions are ${nf(C.tot,1)} tCO₂e: Scope 1 ${nf(C.sc[1],1)} (fuels burned directly), Scope 2 ${nf(C.sc[2],1)} (purchased electricity), Scope 3 ${nf(C.sc[3],1)} (water and landfilled waste only).`,`إجمالي الانبعاثات ${nf(C.tot,1)} طن CO₂e: النطاق 1 ${nf(C.sc[1],1)} (وقود يُحرق مباشرة)، والنطاق 2 ${nf(C.sc[2],1)} (كهرباء مشتراة)، والنطاق 3 ${nf(C.sc[3],1)} (المياه والنفايات المدفونة فقط).`)}},
 {k:["sdg","vision","2030","رؤية","التنمية"],a:tr("The paper links the framework to Vision 2030's economic, environmental and governance dimensions (§8.6). The Vision 2030 & SDGs tab maps live figures to SDG targets 7.2, 7.3, 6.4, 12.5, 12.6, 13.2, 16.6, 4.4 and 8.2.","يربط البحث الإطار بالأبعاد الاقتصادية والبيئية والحوكمية لرؤية 2030 (§8.6). تبويب «رؤية 2030 وأهداف التنمية» يربط الأرقام الحية بالغايات 7.2 و7.3 و6.4 و12.5 و12.6 و13.2 و16.6 و4.4 و8.2.")},
 {k:["method","منهج","منهجية"],a:tr("Descriptive-analytical method using documentary analysis of secondary sources (2016–2026): peer-reviewed literature, Egyptian regulations and strategy, standard-setters (ISSB, GRI, TCFD) and multilateral reports. No primary data were collected, so findings are reasoned analytical conclusions (§5).","منهج وصفي تحليلي يعتمد على التحليل الوثائقي لمصادر ثانوية (2016–2026): أدبيات محكمة، وتشريعات واستراتيجيات مصرية، وجهات إصدار المعايير (ISSB وGRI وTCFD)، وتقارير مؤسسات دولية. لم تُجمع بيانات أولية، لذا النتائج استنتاجات تحليلية مسببة (§5).")},
 {k:["constraint","limit","قيود","معوق","عائق"],a:tr("Five constraints (§8.5): professional competence, assurance capability, the environmental cost of digital infrastructure itself, cybersecurity concentration, and the data burden that migrates to smaller suppliers exempt from disclosure.","خمسة معوقات (§8.5): الكفاءة المهنية، وقدرة التأكيد، والتكلفة البيئية للبنية الرقمية ذاتها، وتركز المخاطر السيبرانية، وانتقال عبء البيانات إلى الموردين الصغار المعفيين من الإفصاح.")},
 {k:["survey","questionnaire","استبيان"],a:tr("The Research survey tab collects primary data from companies on the four conditions and governance. Responses are private to the researcher and feed the Compare tab: the evidence §10.2 calls the most pressing gap.","تبويب «استبيان البحث» يجمع بيانات أولية من الشركات عن الشروط الأربعة والحوكمة. الردود خاصة بالباحثة وتغذي تبويب المقارنة: وهي الأدلة التي يعدها §10.2 أهم فجوة.")},
 {k:["carbon price","shadow","سعر الكربون","ظلي"],f:()=>{const C=calc();return tr(`At your internal price of EGP ${nf(S.price)} per tonne, the hidden carbon cost is EGP ${nf(C.tot*S.price/1e6,2)} million a year, ${C.cost?nf(C.tot*S.price/C.cost*100,1):0}% on top of the environmental cost actually paid.`,`بسعرك الداخلي ${nf(S.price)} جنيه للطن، تبلغ تكلفة الكربون الخفية ${nf(C.tot*S.price/1e6,2)} مليون جنيه سنوياً، أي ${C.cost?nf(C.tot*S.price/C.cost*100,1):0}٪ فوق التكلفة البيئية المدفوعة فعلاً.`)}}

const AR2EN={"فاتور":"invoic","حوكم":"governance","تأكيد":"assurance","مراجع":"audit","قياس":"measur","انبعاث":"emission","إفصاح":"disclos","افصاح":"disclos","رقمن":"digital","رقمي":"digital","خضراء":"green","استدام":"sustainab","رؤية":"Vision 2030","مهار":"competence","كفاء":"competence","سيبران":"cyber","أمن":"security","مورد":"supplier","صغير":"smaller","سندات":"green bond","معوق":"constraint","توصي":"recommend","نتائج":"finding","منهج":"methodolog","شرعي":"legitimacy","مؤسسي":"institutional","إشار":"signalling","مجلس":"board","عداد":"meter","حساس":"sensor","إنترنت الأشياء":"internet-of-things","ضريب":"tax","فجوة":"gap","الخارج":"outside-in","الداخل":"inside-out","تصنيف":"taxonomy","جامع":"universit","تعليم":"curricul","مخاطر":"risk","مستثمر":"investor","تكلفة":"cost","طاقة":"energy","مياه":"water","نفايات":"waste","بنية":"architecture","نظري":"theor","أصحاب المصالح":"stakeholder","الرقابة المالية":"Financial Regulatory Authority","قرار":"Decree"};
const STOP=new Set("the and for with that this what does how why are was were from into about which their there have has had not but can its our your you who whom when where will would should could".split(" "));
function paperHits(q){
  const terms=new Set();const low=q.toLowerCase();
  low.replace(/[^a-z0-9؀-ۿ\- ]+/g," ").split(/\s+/).forEach(w=>{if(/^[a-z0-9-]{3,}$/.test(w)&&!STOP.has(w))terms.add(w.replace(/(ing|ed|es|s)$/,""))});
  Object.entries(AR2EN).forEach(([a,e])=>{if(q.includes(a))terms.add(e.toLowerCase())});
  if(!terms.size)return [];
  return PAPER_FULL.filter(p=>!p.s.startsWith("References")).map(p=>{const tl=p.t.toLowerCase();let sc=0;terms.forEach(tm=>{if(tl.includes(tm))sc+=1+(p.s.toLowerCase().includes(tm)?1:0)});return {p,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,2).map(x=>x.p);
}
function offlineAnswer(q){
  const s=q.toLowerCase();let best=null,bs=0;
  FAQ.forEach(f=>{const sc=f.k.filter(k=>s.includes(k.toLowerCase())).length;if(sc>bs){bs=sc;best=f}});
  const hits=paperHits(q);
  const ex=hits.length?"\n\n"+t(tr("From the paper:","من نص البحث (بالإنجليزية):"))+hits.map(p=>`\n• ${p.s} — ${p.t.length>420?p.t.slice(0,420)+"…":p.t}`).join(""):"";
  if(!best&&!hits.length)return t(tr("I can answer from the paper and this platform on: the research problem, findings, the four conditions, green accounting, digital sustainability, Decrees 107/108, e-invoicing, outside-in vs inside-out, recommendations, UNESCO and governance alignment, the index, emissions, carbon price, CBAM, SDGs, methodology, constraints and the survey. Try one of these words.","أستطيع الإجابة من البحث والمنصة عن: مشكلة البحث، والنتائج، والشروط الأربعة، والمحاسبة الخضراء، والاستدامة الرقمية، والقرارين 107/108، والفاتورة الإلكترونية، ومن الخارج للداخل، والتوصيات، واليونسكو وتوافق الحوكمة، والمؤشر، والانبعاثات، وسعر الكربون، وCBAM، وأهداف التنمية، والمنهجية، والمعوقات، والاستبيان. جرّب إحدى هذه الكلمات."));
  return (best?t(best.f?best.f():best.a):t(tr("Here is what the paper says about this.","إليك ما يقوله البحث عن هذا.")))+ex;
}
