function rulesStable(){
  const gov=THEMES.map(x=>`- ${x.n.en}: Egypt = ${x.eg.en}; Global = ${x.gl.en}; alignment = ${x.lv}; meaning = ${x.m.en}`).join("\n");
  const inst=[...EG,...GL].map(x=>`- ${x.n.en}: ${x.d.en}`).join("\n");
  return `You are the research assistant on the "Green Ledger Workbench" platform, prepared by Dr. Sara Salem (Alexandria University Faculty of Business, Digital Sustainability Conference 2026). Answer questions about her paper, green and digital accounting, sustainability disclosure, governance in Egypt and globally (UNESCO, G20/OECD, ISSB, GRI), Egypt Vision 2030, the SDGs, and the numbers on this platform.
Rules:
- Reply in the language of the user's question. If they write Arabic, reply in clear Modern Standard Arabic.
- Ground answers in the PAPER and GOVERNANCE material below and the CURRENT DATA. Cite paper sections like (§8.2) when you use them.
- Explain the meaning of any number you mention, in plain words.
- The paper is a documentary, descriptive-analytical study with no primary data: never present its expectations about company practice as empirical findings.
- If something is not covered by the material, say so plainly; answer from general knowledge only if you are confident, and mark it as general knowledge. Never invent laws, decree numbers, dates or statistics.
- The demo company is fictitious; say so if the user treats it as real.
- Keep answers focused: short paragraphs or a short list, under about 250 words unless asked for more. Plain text, no markdown headings.

GOVERNANCE INSTRUMENTS:
${inst}

GOVERNANCE ALIGNMENT MATRIX (author's analytical reading):
${gov}

UNESCO values: ${UNESCO_V.map(v=>v.en).join("; ")}. UNESCO principles: ${UNESCO_P.map(v=>v.en).join("; ")}.

PAPER (selected sections, verbatim):
${PAPER_KB}`;
}

div>
  <div class="msgs" id="msgs">${chat.length?"":`<div class="msg a">${esc(t(tr("Ask me anything about the research, green accounting, governance in Egypt and globally, or any number on this platform.","اسألني عن أي شيء في البحث أو المحاسبة الخضراء أو الحوكمة في مصر وعالمياً أو أي رقم في المنصة.")))}</div>`}${chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}</div>

function importCSV(txt,replace){
  const lines=txt.trim().split(/\r?\n/).filter(Boolean);if(!lines.length){toast(t(tr("Paste CSV rows first","الصق صفوف CSV أولاً")));return}
  if(/month/i.test(lines[0]))lines.shift();
  const out=[],bad=[];
  lines.forEach((ln,i)=>{const c=ln.split(",").map(s=>s.trim());const cat=(c[2]||"").toLowerCase();
    if(!CATS[cat]||!(+c[0]>=1&&+c[0]<=12)){bad.push(i+1);return}
    const me=(c[6]||"").toLowerCase(),ow=(c[7]||"").toLowerCase();
    out.push({m:+c[0],site:c[1]||"—",cat,qty:+c[3]||0,cost:+c[4]||0,inv:c[5]||"",method:METHODS[me]?me:"estimate",owner:OWNERS[ow]?ow:"",ev:/^(y|yes|1|true|نعم)$/i.test(c[8]||"")})});
  if(!out.length){toast(t(tr("No valid rows. Check the month (1–12) and category columns.","لا توجد صفوف صالحة. راجع عمودي الشهر (1–12) والفئة.")));return}
  if(replace){S.rows=[];S.demo=false;S.entity.name=S.entity.name.replace(/\s*\(fictitious demo\)/,"")}
  out.forEach(r=>{r.id=S.nextId++;S.rows.push(r)});save();render();
  toast(t(tr(`${out.length} rows added`+(bad.length?`, ${bad.length} skipped (lines ${bad.slice(0,5).join(", ")})`:""),`تمت إضافة ${out.length} صفاً`+(bad.length?`، وتم تخطي ${bad.length}`:""))));
}

function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-5395239384953e-18];let y=x,tm=x+5.5;tm-=(x+.5)*Math.log(tm);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -tm+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break}return h}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
const pT=(tv,df)=>ibeta(df/2,.5,df/(df+tv*tv));
const meanA=a=>a.reduce((s,v)=>s+v,0)/a.length,varA=a=>{const m=meanA(a);return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1)};
function welch(a,b){if(a.length<2||b.length<2)return null;const va=varA(a)/a.length,vb=varA(b)/b.length;const tv=(meanA(a)-meanA(b))/Math.sqrt(va+vb||1e-12);const df=(va+vb)**2/((va*va)/(a.length-1)+(vb*vb)/(b.length-1)||1e-12);return {t:tv,df,p:pT(tv,df),ma:meanA(a),mb:meanA(b),na:a.length,nb:b.length}}
function pearson(x,y){const n=x.length;if(n<4)return null;const mx=meanA(x),my=meanA(y);let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)**2;sy+=(y[i]-my)**2}const r=sxy/Math.sqrt(sx*sy||1e-12);const tv=r*Math.sqrt((n-2)/Math.max(1e-12,1-r*r));return {r,n,p:pT(tv,n-2)}}
function alpha(rows,ids){const R=rows.filter(r=>ids.every(i=>(r.cond||{})[i]));if(R.length<3)return null;const k=ids.length;const it=ids.map(i=>varA(R.map(r=>r.cond[i])));const tot=varA(R.map(r=>ids.reduce((s,i)=>s+r.cond[i],0)));return {a:k/(k-1)*(1-it.reduce((s,v)=>s+v,0)/(tot||1e-12)),n:R.length}}

 en:[["Purpose","To examine whether Egypt's state-led transition to digital accounting and financial reporting provides an operative infrastructure for institutionalising green accounting and digital sustainability under Egypt Vision 2030, and what conditions that requires."],["Design/methodology/approach","A descriptive-analytical study based on documentary analysis of peer-reviewed literature, Egyptian regulatory instruments (including FRA Decrees 107 and 108 of 2021), national strategy documents and standard-setter pronouncements (2016–2026), interpreted through stakeholder, legitimacy, institutional, signalling and technology-adoption theories."],["Findings","Digitalisation is deep but transaction-bound: e-invoicing captures the monetary layer, not physical resource flows. The disclosure regime secures comparable output aligned with TCFD but specifies no measurement methodology, data governance or assurance. Green accounting is therefore expected to be configured outside-in and detached from the accounting information system. The binding constraint is institutional and human rather than technological."],["Practical implications","Regulators should add minimum measurement requirements, a phased path to limited assurance, a machine-readable taxonomy and a simplified pathway for smaller suppliers; preparers should embed physical-unit data in the ERP under Finance; the profession needs assurance guidance for system-captured data; universities should integrate environmental measurement and analytics into accounting curricula."],["Originality/value","The study treats digitalisation and sustainability accounting as one architectural problem and specifies four conditions (capture at source, unified governance, structured reporting, designed assurability) under which green accounting can be embedded in, rather than layered on, digital accounting infrastructure in a mandated emerging-market regime."],["Research limitations","No primary data were collected; claims about en function injectData(html,data){
  const OPEN='<scr'+'ipt id="glw-data">window.__DATA=',CLOSE='</'+'script>',MARK='<scr'+'ipt>window.__STANDALONE=1';
  for(let a=html.indexOf(OPEN);a>=0;a=html.indexOf(OPEN)){const b=html.indexOf(CLOSE,a);if(b<0)break;let e=b+CLOSE.length;if(html[e]==="\n")e++;html=html.slice(0,a)+html.slice(e)}
  const k=html.indexOf(MARK);if(k<0)throw new Error("marker");
  return html.slice(0,k)+OPEN+JSON.stringify(data.S?data:{}).replace(/<\//g,"<\\/")+";"+CLOSE+"\n"+html.slice(k);
}

function enKey(txt){
  let s=(txt||"").replace(/\s+/g," ").trim();
  const strip=x=>x.replace(/\s*[·(]\s*[\d\/\s]+\)?\s*$/,"").replace(/\s+\d+\/\d+$/,"").trim();
  for(const c of [s,strip(s),strip(strip(s))]){if(EXPL[c]||COLX[c])return c;if(TRM.has(c))return TRM.get(c)}
  return strip(s);
}

  let body="";
  if(DRV==="chat")body=`<div class="msgs" id="msgs">${chat.length?"":`<div class="msg a">${esc(t(tr("Ask me anything about the research, green accounting, governance in Egypt and globally, or any number on this platform. Or open “All questions”.","اسألني عن أي شيء في البحث أو المحاسبة الخضراء أو الحوكمة في مصر وعالمياً أو أي رقم في المنصة، أو افتح «كل الأسئلة».")))}</div>`}${chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}</div>
  <div class="compose"><div class="chips">${SUGG.map((s,i)=>`<button class="chip" type="button" data-sugg="${i}" style="font-size:.78rem">${esc(t(s))}</button>`).join("")}</div>
  <form id="askForm"><input class="inp" id="askIn" autocomplete="off" placeholder="${esc(t(tr("Type your question…","اكتب سؤالك…")))}" ${asking?"disabled":""}><button class="btn pri" type="submit" ${asking?"disabled":""}>${esc(t(tr("Ask","اسأل")))}</button>${asking?`<button class="btn" type="button" data-act="stopAsk">${esc(t(tr("Stop","إيقاف")))}</button>`:""}</form>
  <div class="row small"><button class="btn" type="button" data-act="chatDl" style="font-size:.78rem"${chat.length?"":" disabled"}>${esc(t(tr("Download conversation","تنزيل المحادثة")))}</button><button class="btn" type="button" data-act="chatCopy" style="font-size:.78rem"${chat.length?"":" disabled"}>${esc(t(tr("Copy","نسخ")))}</button><button class="btn danger" type="button" data-act="chatClear" style="font-size:.78rem"${chat.length?"":" disabled"}>${esc(t(tr("Clear","مسح")))}</button></div></div>`;
  if(DRV==="lib"){const q=LIBQ.toLowerCase();const L=lib.map((f,i)=>({f,i:FAQ.indexOf(f)})).filter(x=>!q||t(x.f.q).toLowerCase().includes(q)||libAnswer(x.f).toLowerCase().includes(q));
    body=`<div class="msgs"><input class="inp" id="libQ" value="${esc(LIBQ)}" placeholder="${esc(t(tr("Search questions…","ابحث في الأسئلة…")))}"><p class="small muted">${esc(t(tr(`${L.length} questions with answers. Tap one to read the answer${live?", or ask the live AI to go deeper":""}.`,`${L.length} سؤالاً بإجاباتها. اضغطي على سؤال لقراءة الإجابة${live?" أو اطلبي من الذكاء الاصطناعي التعمق":""}.`)))}</p>
    ${L.map(x=>`<details class="step"><summary style="cursor:pointer;font-weight:600">${esc(t(x.f.q))}</summary><p class="small" style="white-space:pre-wrap;margin-block:6px">${esc(libAnswer(x.f))}</p><div class="row"><button class="btn" type="button" data-libask="${x.i}" style="font-size:.78rem">${esc(t(live?tr("Ask the AI for more","اطلب المزيد من الذكاء الاصطناعي"):tr("Send to chat","إرسال للمحادثة")))}</button><button class="btn" type="button" data-libcopy="${x.i}" style="font-size:.78rem">${esc(t(tr("Copy","نسخ")))}</button></div></details>`).join("")}
    <button class="btn" type="button" data-act="libDl">${esc(t(tr("Download all questions & answers","تنزيل كل الأسئلة والإجابات")))}</button></div>`}
  if(DRV==="set")body=`<div class="msgs">${SAMPLE?`<div class="step"><b>${esc(t(tr("Inside Claude: live AI is on","داخل Claude: الذكاء الاصطناعي مفعّل")))}</b><p class="small muted">${esc(t(tr("No key is needed here. The answers use Claude through your Claude account. In the HTML file or on GitHub Pages, connect an Anthropic API key below.","لا حاجة لمفتاح هنا. الإجابات تستخدم Claude عبر حسابك في Claude. في ملف HTML أو GitHub Pages فعّلي مفتاح Anthropic API بالأسفل.")))}</p></div>`:""}
    <div class="step"><b>${esc(t(tr("Anthropic API (Claude)","Anthropic API (Claude)")))}</b>${apiKey()?`<span class="pill p-ok">${esc(t(tr("Key saved on this device","المفتاح محفوظ على هذا الجهاز")))}</span>`:""}
     <p class="small muted">${esc(t(tr("1) Sign in at console.anthropic.com → API keys → Create key. 2) Paste it here and save. The key is stored only in this browser, never placed in files you save or share, and usage is billed to your Anthropic account. Model: Claude Opus 5.5, with automatic fallback if a request is declined.","1) سجّلي الدخول في console.anthropic.com ← API keys ← Create key. 2) الصقيه هنا واحفظي. يُخزن المفتاح في هذا المتصفح فقط، ولا يُضمّن أبداً في الملفات التي تحفظينها أو تشاركينها، والاستخدام يُحاسب على حسابك في Anthropic. النموذج: Claude Opus 5.5 مع تحويل تلقائي إذا رُفض الطلب.")))}</p>
     <input class="inp" id="apiKeyIn" type="password" dir="ltr" placeholder="sk-ant-…" value="${apiKey()?"••••••••":""}" autocomplete="off">
     <div class="row"><button class="btn pri" type="button" data-act="keySave">${esc(t(tr("Save key","حفظ المفتاح")))}</button><button class="btn" type="button" data-act="keyTest"${apiKey()?"":" disabled"}>${esc(t(tr("Test connection","اختبار الاتصال")))}</button>${apiKey()?`<button class="btn danger" type="button" data-act="keyDel">${esc(t(tr("Remove key","حذف المفتاح")))}</button>`:""}</div>
     ${IN_CLAUDE()?`<p class="small muted">${esc(t(tr("Note: inside Claude the page cannot call the API directly; the key is used in the HTML file and on GitHub Pages.","ملاحظة: داخل Claude لا تستطيع الصفحة الاتصال بالـ API مباشرة؛ يُستخدم المفتاح في ملف HTML وعلى GitHub Pages.")))}</p>`:""}</div>
    <div class="step"><b>${esc(t(tr("Without AI","بدون ذكاء اصطناعي")))}</b><p class="small muted">${esc(t(tr(`The assistant still answers ${lib.length} prepared questions and quotes the matching paragraphs of the paper, with no internet.`,`يجيب المساعد على ${lib.length} سؤالاً جاهزاً ويقتبس الفقرات المناسبة من البحث بدون إنترنت.`)))}</p></div></div>`;
  d.innerHTML=`<div class="dh"><div><b style="font-family:var(--f-display)">${esc(t(tr("Research assistant","المساعد البحثي")))}</b><div class="small muted">${esc(t(tr("Prepared by Dr. Sara Salem · answers from the paper, governance frameworks and your data","إعداد: د. سارة سالم · يجيب من البحث وأطر الحوكمة وبياناتك")))}</div>${badge}</div><button class="btn" type="button" data-act="closeAsk" aria-label="close">✕</button></div>
  <div style="display:grid;grid-template-rows:auto 1fr;min-height:0">${tabsH}<div style="display:grid;grid-template-rows:1fr auto;min-height:0;overflow:hidden">${body}</div></div>`;
  d.style.gridTemplateRows="auto 1fr";
  const ms=$("msgs");if(ms)ms.scrollTop=ms.scrollHeight;
  const f=$("askForm");if(f)f.addEventListener("submit",ev=>{ev.preventDefault();const v=$("askIn").value.trim();if(v)ask_(v)});
  const lq=$("libQ");if(lq)lq.addEventListener("input",e=>{LIBQ=e.target.value;const pos=e.target.selectionStart;renderDrawer();const n=$("libQ");n.focus();n.setSelectionRange(pos,pos)});
  if(!asking){saveChat();const ai=$("askIn");if(ai&&DRV==="chat")ai.focus()}

function chatText(){return chat.map(m=>(m.role==="user"?t(tr("Question: ","سؤال: ")):t(tr("Answer: ","إجابة: ")))+m.content).join("\n\n")}
function libText(){return FAQ.filter(f=>f.q).map((f,i)=>`${i+1}. ${t(f.q)}\n${libAnswer(f)}`).join("\n\n")}
document.addEventListener("click",e=>{
  const dv=e.target.closest("[data-drv]");if(dv){DRV=dv.dataset.drv;renderDrawer();return}
  const la=e.target.closest("[data-libask]");if(la){const f=FAQ[+la.dataset.libask];DRV="chat";if(!!SAMPLE||!!apiKey()){if(!asking)ask_(t(f.q))}else{chat.push({role:"user",content:t(f.q)},{role:"assistant",content:libAnswer(f)});renderDrawer()}return}
  const lc=e.target.closest("[data-libcopy]");if(lc){const f=FAQ[+lc.dataset.libcopy];copy(t(f.q)+"\n"+libAnswer(f));return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="chatDl")saveFile("assistant-conversation.txt","﻿"+t(UI.byline)+"\n\n"+chatText(),"text/plain");
  if(act==="chatCopy")copy(chatText());
  if(act==="chatClear"){chat=[];saveChat();renderDrawer()}
  if(act==="libDl")saveFile("assistant-questions-answers.txt","﻿"+t(UI.byline)+"\n\n"+libText(),"text/plain");
  if(act==="keyTest"){a.disabled=true;askAPI([{role:"user",content:"Reply with the single word OK."}]).then(r=>toast(t(tr("Connected. Claude replied: ","تم الاتصال. رد Claude: "))+r.slice(0,40))).catch(err=>toast(t(tr("Connection failed: ","فشل الاتصال: "))+err.message)).finally(()=>{a.disabled=false})}
});

function parseCSVText(txt){

  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cell);cell=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=ch}

  if(dz){["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));dz.addEventListener("drop",e=>{const f=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(f.length)ingestFiles(f)})}
}
document.addEventListener("click",async e=>{
  const op=e.target.closest("[data-cmpopen]");if(op){const i=+op.dataset.cmpopen;const sw=()=>{const nx=PREF.imported[i];const cur=JSON.parse(JSON.stringify(S));PREF.imported[i]=cur;S=nx;S.gov=S.gov||{};S.audit=S.audit||{};save();savePref();go("dash");toast(t(tr("Opened: ","تم الفتح: "))+((S.entity||{}).name||""))};modalConfirm(t(tr("Open this company in the dashboard? The current company stays in the comparison list.","فتح هذه الشركة في اللوحة؟ تبقى الشركة الحالية في قائمة المقارنة.")),sw);return}
  const dl=e.target.closest("[data-cmpdel]");if(dl){PREF.imported.splice(+dl.dataset.cmpdel,1);savePref();render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="tplCsv")saveFile("company-data-template.csv","﻿"+[TPL_HEAD,...tplRows()].map(r=>r.join(",")).join("\n"),"text/csv");
  if(act==="tplXlsx"){try{const X=await loadXLSX();const wb=X.utils.book_new();X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([TPL_HEAD,...tplRows()]),"companies");const help=[["column","meaning","allowed values"],["company","company name","any text"],["month","month number","1-12"],["site","plant, office, fleet","any text"],["category","resource","electricity | natgas | diesel | petrol | water | waste (Arabic names also work)"],["quantity","physical amount","kWh, m3, litres or tonnes"],["cost_egp","amount paid","number"],["einvoice_ref","tax document reference","text, may be empty"],["method","how measured","meter | invoice | estimate"],["owner","data owner","finance | sustainability | operations"],["evidence","evidence kept?","yes | no"]];X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(help),"how to fill");saveFile("company-data-template.xlsx",new Blob([X.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}catch(err){toast(err.message)}}
  if(act==="cmpClearFiles"){modalConfirm(t(tr("Remove every uploaded company from the comparison?","حذف كل الشركات المرفوعة من المقارنة؟")),()=>{PREF.imported=PREF.imported.filter(o=>!o.rows);savePref();render()})}
  if(act==="cmpCsv"){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const L=companies();saveFile("company-comparison.csv","﻿"+["rank,company,assurability_index,capture_at_source,unified_governance,structured_reporting,designed_assurability,total_tco2e,env_cost_egp,intensity_tco2e_per_egp_m,einvoice_pct,global_governance_pct,source",...L.map((x,i)=>[i+1,x.name,Math.round(x.idx),...x.c.map(v=>Math.round(v)),x.ledger?x.tot.toFixed(1):"",x.ledger?Math.round(x.cost):"",x.ledger&&x.cost?x.inten.toFixed(1):"",x.ledger?Math.round(x.recon):"",Math.round(x.gov),t(x.src)].map(q).join(","))].join("\n"),"text/csv")}
});
