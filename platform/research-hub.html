<title>Digital Sustainability Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bilingual top bar, tab rail, one working panel per tab. Palette and type follow the conference flyer (forest green, lighthouse navy). */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface2:#e9efec; --ink:#10242c; --muted:#506068; --line:#cfdad5;
  --green:#0f7a45; --green-soft:#d8eee2; --navy:#12303d; --navy-soft:#dbe6ec;
  --ok:#0f7a45; --warn:#9a6200; --warn-soft:#f6e8c8; --bad:#b3362b; --bad-soft:#f6dcd8; --info:#2a5f8f; --info-soft:#dce9f5; --idle:#6b7a80; --idle-soft:#e3e8ea;
  --f-display:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c171c; --surface:#13242b; --surface2:#1a2f37; --ink:#e6eef0; --muted:#9bb0b6; --line:#27424c;
  --green:#3fc27d; --green-soft:#17382b; --navy:#8fc1d6; --navy-soft:#1b3340;
  --ok:#3fc27d; --warn:#e3b04a; --warn-soft:#3a2f14; --bad:#ef7d70; --bad-soft:#3c1f1c; --info:#7db4e6; --info-soft:#17304a; --idle:#93a5ab; --idle-soft:#20353d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c171c; --surface:#13242b; --surface2:#1a2f37; --ink:#e6eef0; --muted:#9bb0b6; --line:#27424c;
  --green:#3fc27d; --green-soft:#17382b; --navy:#8fc1d6; --navy-soft:#1b3340;
  --ok:#3fc27d; --warn:#e3b04a; --warn-soft:#3a2f14; --bad:#ef7d70; --bad-soft:#3c1f1c; --info:#7db4e6; --info-soft:#17304a; --idle:#93a5ab; --idle-soft:#20353d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1120px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 280px}
.mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:12px;display:block}
.ctl{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--green)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:thin}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--surface2);color:var(--ink)}

main{padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
.panel[hidden]{display:none}
.panel{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:600}
[dir=rtl] .eyebrow{letter-spacing:0}
.sec-h{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sec-h h2{font-size:22px}
.sec-h p{color:var(--muted);max-width:68ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{font-size:16px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--idle-soft);color:var(--ink)}
.pill.ok{background:var(--green-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{background:var(--navy);color:var(--bg);border-radius:12px;padding:26px 28px;display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .hero-main,:root:not([data-theme="light"]) .hero-main{--hm:var(--ink)}
.hero-main h1{font-size:clamp(22px,3.4vw,32px);font-weight:800}
.hero-main .sub{opacity:.85;font-size:14px}
.hero-main .eyebrow{color:#7fe0aa}
.hero-main .rq{border-top:1px solid rgba(255,255,255,.25);padding-top:14px;font-size:14.5px}
.hero-main .rq b{display:block;font-family:var(--f-display);margin-bottom:4px;color:#7fe0aa}
.stat{display:flex;flex-direction:column;gap:10px}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown .n{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;color:var(--green)}
.facts{display:grid;gap:8px;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.facts span:first-child{color:var(--muted)}
.facts span:last-child{font-weight:600;text-align:end}
.meter{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}

/* findings */
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.find .no{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--green);line-height:1}

/* axes */
.axis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.axis:first-of-type{border-top:0}
.axis .an{font-family:var(--f-display);font-weight:800;color:var(--navy);width:28px}
.axis h4{font-size:14px;font-weight:700}
.axis p{font-size:13.5px;color:var(--muted)}
.axis.dim h4{color:var(--muted)}

/* layer selector */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;text-align:start;min-width:0;flex:1 1 200px}
.seg button b{font-family:var(--f-display);display:block;font-size:15px}
.seg button span{font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.detail{margin-top:12px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.detail .card h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
[dir=rtl] .detail .card h4{letter-spacing:0}
.detail .card p{color:var(--ink)}

/* conditions */
.cond{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;min-width:0}
.cond>button{width:100%;background:none;border:0;text-align:start;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.cond .ic{width:36px;height:36px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.cond h3{font-size:15px}
.cond .body{padding:0 16px 14px;color:var(--muted);font-size:14px;display:grid;gap:8px}
.cond .body b{color:var(--ink)}

/* diagnostic */
.diag{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.diag{grid-template-columns:minmax(0,1fr)}}
.diag .res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
@media(max-width:900px){.diag .res{position:static}}
.q{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.q:first-of-type{border-top:0}
.q p{font-size:14.5px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.scale span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 2px;font-size:12px;background:var(--surface);color:var(--muted);line-height:1.3;font-family:var(--f-mono)}
.scale input:checked+span{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.scale input:focus-visible+span{outline:3px solid var(--green);outline-offset:1px}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:10px;margin-top:18px}
.grp-h:first-child{margin-top:0}
.grp-h h3{font-size:16px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.bar .m{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;grid-column:1}
.bar .m i{display:block;height:100%;background:var(--green)}
.bar.risk .m i{background:var(--warn)}
.bar .v{text-align:end;font-family:var(--f-mono);font-size:13px;grid-column:2}
.level{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;background:var(--navy-soft)}
.level b{font-family:var(--f-display);font-size:18px;color:var(--navy)}
svg text{font-family:var(--f-body)}
.actions{display:grid;gap:8px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14px}
.act .tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--surface2);height:fit-content;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--warn);padding-inline-start:10px}

/* roadmap */
.rm li{margin-bottom:8px}
.rm ul{margin:0;padding-inline-start:18px;display:grid;gap:8px}
.finding-ref{font-size:12px;color:var(--muted)}

/* ledger */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:start;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
[dir=rtl] th{letter-spacing:0}
td.say{color:var(--muted)}

/* library */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit}
.lit h3{font-size:15px}
.lit .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.lit .role{margin-top:8px;font-size:13px;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.lit .role b{color:var(--green)}
.ref{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;display:grid;gap:2px}
.ref a{color:var(--info);overflow-wrap:anywhere}
.ref .au{color:var(--ink)}
.ref .ti{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:18px 40px;color:var(--muted);font-size:12.5px;margin-inline:0}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:360px;margin-inline:auto;background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media(prefers-reduced-motion:no-preference){.meter i,.bar .m i{transition:width .3s}}
</style>

  gap:tr("Built around the transaction because the transaction is the object of fiscal interest. Energy, water, emissions and waste generate no invoice, and an invoice records the amount paid, not the quantity consumed.","بُنيت حول المعاملة لأنها محل الاهتمام الضريبي. الطاقة والمياه والانبعاثات والنفايات لا تنتج فاتورة، والفاتورة تسجل المبلغ المدفوع لا الكمية المستهلكة."),
  lens:tr("Technology adoption (TOE / UTAUT): a mandate alone is not enough for effective use.","تبني التكنولوجيا (TOE / UTAUT): الإلزام وحده لا يكفي لتحقيق استخدام فعّال.")},
 {k:"reg",ic:"R",name:tr("Disclosure regulation","تنظيم الإفصاح"),tag:tr("Mandate, no method","إلزام بلا منهجية"),
  does:tr("FRA Decrees 107 and 108 of 2021 require annual ESG disclosure through prescribed forms, with TCFD-structured climate disclosure for larger entities. This gives comparability and ISSB continuity.","يُلزم القراران 107 و108 لسنة 2021 بإفصاح ESG سنوي عبر نماذج محددة، مع إفصاح مناخي وفق TCFD للكيانات الأكبر، مما يحقق قابلية المقارنة والاتساق مع ISSB."),
  gap:tr("A mandate prescribes an output, not the measurement system, the internal controls or the assurance behind it. The rational preparer assembles a return instead of building a controlled system.","الإلزام يحدد المخرج لا نظام القياس ولا الضوابط الداخلية ولا التأكيد. فيميل المُعِد إلى تجميع نموذج بدلاً من بناء نظام منضبط."),
  lens:tr("Legitimacy and institutional theory: symbolic compliance and decoupling of form from practice.","نظريتا الشرعية والمؤسسية: الامتثال الرمزي وانفصال الشكل عن الممارسة.")},
 {k:"green",ic:"G",name:tr("Green accounting","المحاسبة الخضراء"),tag:tr("Reporting, not measuring","إفصاح لا قياس"),
  does:tr("In principle a measurement discipline: environmental costs are traced to products, processes and decisions (environmental cost accounting, material flow cost accounting, life-cycle costing, carbon accounting).","من حيث المبدأ انضباط قياس: تُتتبع التكاليف البيئية إلى المنتجات والعمليات والقرارات (محاسبة التكلفة البيئية، تكلفة تدفق المواد، تكلفة دورة الحياة، محاسبة الكربون)."),
  gap:tr("Theoretical expectation, not an observed fact: the regulator's form drives collection (outside-in), so data are compiled periodically outside the accounting system and cannot be reconciled to financial records.","توقع نظري لا حقيقة مرصودة: يقود نموذج الجهة الرقابية الجمع (من الخارج إلى الداخل)، فتُجمع البيانات دورياً خارج النظام المحاسبي ولا يمكن مطابقتها بالسجلات المالية."),
  lens:tr("Burritt & Schaltegger (2010): outside-in versus inside-out. Gray (2010): entity-based accounting cannot capture planetary limits.","بوريت وشالتيغر (2010): من الخارج للداخل مقابل العكس. غراي (2010): المحاسبة القائمة على الكيان لا تستوعب حدود الكوكب.")}
];

function scores(){
  const g=id=>ans[id]==null?null:ans[id];
  const avg=ids=>{const v=ids.map(g).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length/4*100:0};
  const out={};
  ["c1","c2","c3","c4","o"].forEach(k=>out[k]=avg(ITEMS.filter(i=>i.g===k).map(i=>i.id)));
  out.ready=(out.c1+out.c2+out.c3+out.c4)/4;
  CONSTR.forEach((c,i)=>out[c.k]=g(c.k)==null?0:g(c.k)/4*100);
  return out;
}

function radar(sc){
  const cx=150,cy=140,R=95,keys=["c1","c2","c3","c4"];
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/2;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]};
  let g="";
  [.25,.5,.75,1].forEach(r=>{g+=`<polygon points="${keys.map((_,i)=>pt(i,r).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  keys.forEach((_,i)=>{const p=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/>`});
  const poly=keys.map((k,i)=>pt(i,Math.max(sc[k],3)/100).join(",")).join(" ");
  g+=`<polygon points="${poly}" fill="var(--green)" fill-opacity=".22" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>`;
  keys.forEach((k,i)=>{const p=pt(i,Math.max(sc[k],3)/100);g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--green)"/>`});
  const lab=[[cx,18,"middle"],[cx+R+18,cy+4,"start"],[cx,cy+R+26,"middle"],[cx-R-18,cy+4,"end"]];
  keys.forEach((k,i)=>{const [x,y,an]=lab[i];g+=`<text x="${x}" y="${y}" text-anchor="${an}" font-size="12" fill="var(--ink)" font-weight="600">${esc(t(GROUPS[k].t))}</text><text x="${x}" y="${y+14}" text-anchor="${an}" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${nf(Math.round(sc[k]))}</text>`});
  return `<svg viewBox="-40 0 380 290" width="100%" role="img" aria-label="${esc(lang==='ar'?'مخطط رادار للشروط الأربعة':'Radar chart of the four conditions')}">${g}</svg>`;
}

    <div class="card"><h4>${lang==="ar"?"ما تحققه":"What it delivers"}</h4><p>${esc(t(L0.does))}</p></div>
    <div class="card"><h4>${lang==="ar"?"ما ينقصها":"What is missing"}</h4><p>${esc(t(L0.gap))}</p></div>
    <div class="card"><h4>${lang==="ar"?"العدسة النظرية":"Theoretical lens"}</h4><p>${esc(t(L0.lens))}</p></div>
   </div></section>

  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"الشروط":"Conditions"}</span><h2>${lang==="ar"?"الاستدامة الرقمية كمسألة بنيوية":"Digital sustainability as an architectural problem"}</h2><p>${lang==="ar"?"أربعة شروط تُدخل بيانات الاستدامة إلى النظام المحاسبي كفئة بيانات أساسية. افتح الشرط لترى كيف يُطبَّق.":"Four conditions admit sustainability data into the accounting system as a first-class data class. Open one to see how it is applied."}</p></div>
   <div class="grid g2">${CONDS.map((c,i)=>`<div class="cond"><button type="button" data-cond="${i}" aria-expanded="${openCond===i}"><span class="ic">${nf(c.n)}</span><span><h3>${esc(t(c.t))}</h3><span style="font-size:14px;color:var(--muted)">${esc(t(c.d))}</span></span></button>${openCond===i?`<div class="body"><div><b>${lang==="ar"?"التطبيق":"In practice"}:</b> ${esc(t(c.how))}</div></div>`:""}</div>`).join("")}</div></section>

  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"المعوقات":"Constraints"}</span><h2>${lang==="ar"?"خمسة معوقات أمام التطبيق":"Five constraints on implementation"}</h2><p>${lang==="ar"?"إطار يتجاهلها لا يمكن تنفيذه.":"A framework that ignores them cannot be implemented."}</p></div>
   <div class="grid g3">${CONSTR.map(c=>`<div class="card"><h3>${esc(t(c.t))}</h3><p>${esc(t(c.d))}</p></div>`).join("")}</div></section>

  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"الاتساق":"Alignment"}</span><h2>${lang==="ar"?"الاتساق مع رؤية مصر 2030":"Alignment with Egypt Vision 2030"}</h2></div>
   <div class="grid g3">${V2030.map(c=>`<div class="card"><h3>${esc(t(c.t))} ${lang==="ar"?"":"dimension"}</h3><p>${esc(t(c.d))}</p></div>`).join("")}</div></section>`;
}

function rDiag(){
  const grpOrder=[["c1"],["c2"],["c3"],["c4"],["o"],["k"]];
  const gName=k=>k==="o"?{t:tr("Inside-out orientation","التوجه من الداخل إلى الخارج"),sub:tr("Is measurement driven by management or by the filing form?","هل يقود القياس الإدارة أم نموذج الإفصاح؟")}:k==="k"?{t:tr("Constraints","المعوقات"),sub:tr("Rate how strongly each one holds you back.","قيّم مدى إعاقة كل منها لك.")}:{t:GROUPS[k].t,sub:GROUPS[k].d};
  const form=grpOrder.map(([k])=>{
    const gn=gName(k);const scale=k==="k"?SK:SC;
    return `<div class="grp-h"><h3>${esc(t(gn.t))}</h3></div><p style="color:var(--muted);font-size:13.5px">${esc(t(gn.sub))}</p>`+ITEMS.filter(i=>i.g===k).map(i=>`<div class="q"><p>${esc(t(i.q))}</p><div class="scale" role="radiogroup" aria-label="${esc(t(i.q))}">${[0,1,2,3,4].map(v=>`<label><input type="radio" name="${i.id}" value="${v}" ${ans[i.id]===v?"checked":""}><span>${nf(v)}<br>${esc(t(scale[v]))}</span></label>`).join("")}</div></div>`).join("");
  }).join("");
  const sc=scores();
  const lv=LEVELS.find(l=>sc.ready<l[0]);
  const weakest=["c1","c2","c3","c4"].slice().sort((a,b)=>sc[a]-sc[b]);
  const topK=CONSTR.map(c=>c).sort((a,b)=>sc[b.k]-sc[a.k])[0];
  return `<section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"أداة تطبيقية":"Practical tool"}</span><h2>${lang==="ar"?"تشخيص جاهزية المنشأة":"Entity readiness check"}</h2><p>${lang==="ar"?"تطبّق الشروط الأربعة والمعوقات الخمسة من البحث على منشأة بعينها. استخدمها في ورشة تدريب أو مع عميل. تُحفظ الإجابات في متصفحك فقط.":"Applies the paper's four conditions and five constraints to one organisation. Use it in a training workshop or with a client. Answers stay in your browser only."}</p></div>
  <div class="diag">
   <div class="card" id="diagForm">${isExample?`<p class="note" style="margin-bottom:12px">${lang==="ar"?"الإجابات الحالية أمثلة توضيحية لمنشأة افتراضية. غيّر أي إجابة لتبدأ تقييمك.":"The answers shown are an example for a hypothetical entity. Change any answer to start your own."}</p>`:""}<div class="scale-legend"><span>${lang==="ar"?"0 = لا إطلاقاً":"0 = not at all"}</span><span>${lang==="ar"?"4 = كلياً":"4 = fully"}</span></div>${form}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="chip" type="button" id="resetBtn">${lang==="ar"?"مسح الإجابات":"Clear answers"}</button><button class="chip" type="button" id="exBtn">${lang==="ar"?"تحميل المثال":"Load example"}</button></div>
   </div>
   <div class="res card" style="display:grid;gap:16px" aria-live="polite">
    <div class="level"><span style="font-size:12px;color:var(--muted)">${lang==="ar"?"مؤشر الجاهزية":"Readiness index"} · <span class="mono">${nf(Math.round(sc.ready))}/${nf(100)}</span></span><b>${esc(t(lv[1]))}</b><span style="font-size:14px">${esc(t(lv[2]))}</span></div>
    ${radar(sc)}
    <div class="bar"><div class="t"><span>${lang==="ar"?"التوجه من الداخل إلى الخارج":"Inside-out orientation"}</span></div><div class="m"><i style="width:${sc.o}%"></i></div><span class="v">${nf(Math.round(sc.o))}</span></div>
    <div style="display:grid;gap:10px"><h4 style="font-size:14px">${lang==="ar"?"شدة المعوقات":"Constraint severity"}</h4>${CONSTR.map(c=>`<div class="bar risk"><div class="t"><span>${esc(t(c.t))}</span></div><div class="m"><i style="width:${sc[c.k]}%"></i></div><span class="v">${nf(Math.round(sc[c.k]))}</span></div>`).join("")}</div>
    <div><h4 style="font-size:14px;margin-bottom:8px">${lang==="ar"?"أولويات الإجراء من توصيات البحث":"Priorities from the paper's recommendations"}</h4><div class="actions">${weakest.slice(0,2).map((k,i)=>`<div class="act"><span class="tag">${esc(t(ACT_AUD[k]))}</span><span><b>${esc(t(GROUPS[k].t))}</b> (${nf(Math.round(sc[k]))}): ${esc(t(GROUPS[k].how))}</span></div>`).join("")}<div class="act"><span class="tag">${lang==="ar"?"أشد معوق":"Top constraint"}</span><span><b>${esc(t(topK.t))}</b>: ${esc(t(topK.d))}</span></div></div></div>
    <button class="chip" type="button" id="copyBtn">${lang==="ar"?"نسخ ملخص النتائج":"Copy results summary"}</button>
    <p class="note">${lang==="ar"?"مؤشر توضيحي: متوسط بسيط للإجابات دون معايرة أو اختبار صدق. يصلح للنقاش وليس للحكم أو المقارنة بين المنشآت.":"Illustrative index: a simple average of answers, not calibrated or validated. Use it for discussion, not to rank or certify entities."}</p>
   </div>
  </div></section>`;
}

function rRoadmap(){
  const a=AUD.find(x=>x.k===audience);
  return `<section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"التوصيات":"Recommendations"}</span><h2>${lang==="ar"?"خارطة طريق لأربع فئات معنية":"A roadmap for four audiences"}</h2><p>${lang==="ar"?"اختر الفئة لترى ما يُطلب منها ومن أي نتيجة تنبع التوصية.":"Pick an audience to see what is asked of it and which finding each recommendation follows from."}</p></div>
  <div class="seg" role="group">${AUD.map(x=>`<button type="button" data-aud="${x.k}" aria-pressed="${x.k===audience}"><b>${esc(t(x.t))}</b><span>${lang==="ar"?"تنبع من النتيجة":"From finding"} ${nf(x.f)}</span></button>`).join("")}</div>
  <div class="card rm" style="margin-top:12px"><ul>${a.items.map(i=>`<li>${esc(t(i))}</li>`).join("")}</ul></div></section>
  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"البحوث المستقبلية":"Future research"}</span><h2>${lang==="ar"?"ما يبقى مفتوحاً":"What stays open"}</h2><p>${lang==="ar"?"تقترح الدراسة أربعة مسارات تجريبية تختبر ما طرحته نظرياً. يمكن تطوير تشخيص الجاهزية ليصبح أداة جمع بيانات للمسار الثاني.":"The paper proposes four empirical routes that test what it argued theoretically. The readiness check could be developed into a data-collection instrument for the second."}</p></div>
  <div class="grid g4">${FUT.map(f=>`<div class="card"><h3>${esc(t(f.t))}</h3><p>${esc(t(f.d))}</p><p class="finding-ref" style="margin-top:8px">${lang==="ar"?"يتبع النتائج":"Follows findings"} ${nf(f.f)}</p></div>`).join("")}</div></section>`;
}

function rEvidence(){
  return `<section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"الاستعداد للأسئلة":"Q&amp;A preparation"}</span><h2>${lang==="ar"?"سجل الأدلة: ما الذي يمكنك الدفاع عنه وكيف تصوغه":"Evidence ledger: what you can defend, and how to phrase it"}</h2><p>${lang==="ar"?"يعلن البحث أنه تحليل وثائقي دون استبيانات أو مقابلات. يبيّن هذا الجدول مستوى الدعم لكل ادعاء رئيسي، لتصوغ إجاباتك أمام لجنة التحكيم والحضور بدقة.":"The paper states it is documentary analysis with no surveys or interviews. This table shows the support behind each main claim so you phrase answers precisely for referees and the audience."}</p></div>
  <div class="tbl"><table><thead><tr><th>${lang==="ar"?"الادعاء":"Claim"}</th><th>${lang==="ar"?"الحالة":"Status"}</th><th>${lang==="ar"?"الموضع":"Where"}</th><th>${lang==="ar"?"كيف تقولها":"How to say it"}</th></tr></thead><tbody>${LEDGER.map(r=>`<tr><td>${esc(t(r.c))}</td><td>${pill(ST[r.s][1],t(ST[r.s][0]))}</td><td class="mono" style="font-size:12.5px">${esc(r.w)}</td><td class="say">${esc(t(r.say))}</td></tr>`).join("")}</tbody></table></div></section>`;
}

function rLibrary(){
  const ql=q.trim().toLowerCase();
  const lit=LIT.filter(x=>(litTag==="all"||x.tag===litTag)&&(!ql||(x.a+" "+x.y+" "+t(x.f)+" "+t(x.r)).toLowerCase().includes(ql)));
  const refs=REFS.filter(r=>!ql||r.join(" ").toLowerCase().includes(ql));
  return `<section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"الأدبيات":"Literature"}</span><h2>${lang==="ar"?"عشر دراسات: ما تؤكده وما تتركه مفتوحاً":"Ten studies: what they establish and leave open"}</h2><p>${lang==="ar"?"تؤكد الدراسات ثلاثة مواقف: التقنيات الرقمية تغير إنتاج المعلومات والتحقق منها، والأدبيات تميل للنظري على حساب التطبيقي، والإفصاح كثيراً ما ينفصل عن القياس. المفتوح: هل تحمل البنية الرقمية معلومات استدامة بموثوقية القوائم المالية؟":"They establish three positions: digital technologies change how information is produced and verified, the literature leans conceptual over empirical, and reporting often detaches from measurement. Left open: can digital accounting infrastructure carry sustainability information at financial-statement reliability?"}</p></div>
  <div class="tools"><input type="search" id="q" placeholder="${lang==="ar"?"ابحث في الدراسات والمراجع":"Search studies and references"}" value="${esc(q)}" aria-label="search"><div class="seg" role="group" style="flex:0 1 auto">${Object.keys(TAGS).map(k=>`<button type="button" class="chip" data-tag="${k}" aria-pressed="${k===litTag}" style="${k===litTag?"background:var(--navy);color:var(--bg);border-color:var(--navy);flex:none;min-width:0;padding:5px 14px":"flex:none;min-width:0;padding:5px 14px"}">${esc(t(TAGS[k]))}</button>`).join("")}</div></div>
  <div class="grid g2" style="margin-top:14px">${lit.map(x=>`<div class="card lit"><div class="meta">${esc(x.a)} · ${x.y} · ${esc(x.src)}</div><p style="color:var(--ink)">${esc(t(x.f))}</p><p class="role"><b>${lang==="ar"?"دوره في البحث":"Role in the paper"}:</b> ${esc(t(x.r))}</p></div>`).join("")||`<p style="color:var(--muted)">${lang==="ar"?"لا نتائج.":"No matches."}</p>`}</div></section>
  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"الأسس النظرية":"Theory"}</span><h2>${lang==="ar"?"خمس نظريات، لكل منها وجه من المشكلة":"Five theories, each covering one facet of the problem"}</h2></div>
   <div class="grid g3">${THEORY.map(x=>`<div class="card"><h3>${esc(t(x.t))}</h3><p class="mono" style="font-size:12px;margin-bottom:6px">${esc(x.a)}</p><p>${esc(t(x.d))}</p></div>`).join("")}</div></section>
  <section><div class="sec-h"><span class="eyebrow">${lang==="ar"?"المراجع":"References"}</span><h2>${lang==="ar"?"قائمة المراجع (APA 7)":"Reference list (APA 7)"}</h2></div>
   <div class="card" dir="ltr" style="text-align:left">${refs.map(r=>`<div class="ref"><span class="au">${esc(r[0])}</span><span class="ti">${esc(r[1])} <i>${esc(r[2])}</i></span>${r[3]?`<a href="https://doi.org/${r[3]}" target="_blank" rel="noopener">https://doi.org/${esc(r[3])}</a>`:""}</div>`).join("")}</div></section>`;
}

const R={overview:rOverview,framework:rFramework,diagnostic:rDiag,roadmap:rRoadmap,evidence:rEvidence,library:rLibrary};

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"منصة أبحاث الاستدامة الرقمية":"Digital Sustainability Research Hub";
  $("#brandT").textContent=t(UI.brandT);$("#brandS").textContent=t(UI.brandS);
  $("#langBtn").textContent=t(UI.lang);
  const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  $("#themeBtn").textContent=dark?t(UI.themeLight):t(UI.themeDark);
  $("#tabs").innerHTML=UI.tabs.map(([k,n])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===tab}">${esc(t(n))}</button>`).join("");
  $("#main").innerHTML=`<div class="panel">${R[tab]()}</div>`;
  $("#foot").textContent=t(UI.foot);
  if(tab==="library"&&document.activeElement&&document.activeElement.id==="q"){}
}
let toastT;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2400)}
function setTab(k,keepScroll){if(!R[k])return;tab=k;render();if(!keepScroll)window.scrollTo(0,0)}
function save(){isExample=false;store.set("dsh.ans",JSON.stringify({a:ans}))}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="langBtn"){lang=lang==="en"?"ar":"en";store.set("dsh.lang",lang);render();return}
  if(b.id==="themeBtn"){const cur=document.documentElement.getAttribute("data-theme");const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);const nx=dark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("dsh.theme",nx);render();return}
  if(b.dataset.tab){location.hash=b.dataset.tab;setTab(b.dataset.tab);return}
  if(b.dataset.layer){layer=b.dataset.layer;render();return}
  if(b.dataset.cond!=null){const i=+b.dataset.cond;openCond=openCond===i?null:i;render();return}
  if(b.dataset.aud){audience=b.dataset.aud;render();return}
  if(b.dataset.tag){litTag=b.dataset.tag;render();return}
  if(b.id==="resetBtn"){ans={};isExample=false;store.set("dsh.ans",JSON.stringify({a:ans}));const y=scrollY;render();scrollTo(0,y);return}
  if(b.id==="exBtn"){ans=Object.assign({},EXAMPLE);isExample=true;store.set("dsh.ans","");const y=scrollY;render();scrollTo(0,y);return}
  if(b.id==="copyBtn"){
    const sc=scores();const lv=LEVELS.find(l=>sc.ready<l[0]);
    const txt=["Digital sustainability readiness check","Level: "+lv[1].en+" ("+Math.round(sc.ready)+"/100)"].concat(["c1","c2","c3","c4"].map(k=>GROUPS[k].t.en+": "+Math.round(sc[k]))).concat(["Inside-out orientation: "+Math.round(sc.o)],CONSTR.map(c=>c.t.en+" constraint: "+Math.round(sc[c.k]))).join("\n");
    const done=()=>toast(lang==="ar"?"تم النسخ":"Copied");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>toast(lang==="ar"?"تعذر النسخ تلقائياً":"Copy was blocked. Select the scores manually."))}else toast(lang==="ar"?"تعذر النسخ تلقائياً":"Copy was blocked. Select the scores manually.");
  }
});
document.addEventListener("change",e=>{
  const r=e.target;if(r.type==="radio"&&r.name){ans[r.name]=+r.value;save();const y=scrollY;render();scrollTo(0,y);const f=document.querySelector(`input[name="${r.name}"][value="${r.value}"]`);if(f)f.focus()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(R[h]&&h!==tab)setTab(h)});

const h0=location.hash.slice(1);if(R[h0])tab=h0;
render();
})();
</script>

</body></html>
