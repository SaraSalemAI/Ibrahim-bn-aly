<title>SUMED Supplier Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* SUMED P2P — enterprise finance UI. Tokens on :root; dark mode via OS (guarded) and explicit data-theme. RTL via logical properties. */
:root {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef1f5;
  --ink: #1d2733; --ink-2: #4a5768; --ink-3: #6b7787; --line: #d9dee5; --line-2: #e8ebf0;
  --brand: #0b3a5b; --brand-2: #0a6ed1; --brand-ink: #ffffff; --focus: #0a6ed1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --st-good: #0ca30c; --st-warning: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --b-good-bg: #e7f6e7; --b-good-fg: #0b6b0b; --b-warning-bg: #fff4d6; --b-warning-fg: #7a5200; --b-serious-bg: #fde9e0; --b-serious-fg: #9a3b14; --b-critical-bg: #fbe3e3; --b-critical-fg: #a11d1d; --b-neutral-bg: #eef1f5; --b-neutral-fg: #3c4857;
  --demo-bg: #fff4d6; --demo-fg: #6b4a00; --demo-line: #e9c46a;
  --grid: #e6e9ee; --axis: #6b7787;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --r: 6px; --hdr: 56px; --nav: 236px;
  --font: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-ar: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121416; --surface: #1a1c1f; --surface-2: #202327; --surface-3: #272b30;
    --ink: #eef0f2; --ink-2: #c3c7cd; --ink-3: #959ba4; --line: #343941; --line-2: #2a2e34;
    --brand: #0f2f47; --brand-2: #4a9be8; --focus: #6aaef0;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --b-good-bg: #12301a; --b-good-fg: #7fdc86; --b-warning-bg: #3a2e0a; --b-warning-fg: #f6cd62; --b-serious-bg: #3d2216; --b-serious-fg: #f3a582; --b-critical-bg: #3f1717; --b-critical-fg: #f39a9a; --b-neutral-bg: #272b30; --b-neutral-fg: #c3c7cd;
    --demo-bg: #3a2e0a; --demo-fg: #f6cd62; --demo-line: #7a5b12;
    --grid: #2d3137; --axis: #959ba4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121416; --surface: #1a1c1f; --surface-2: #202327; --surface-3: #272b30;
  --ink: #eef0f2; --ink-2: #c3c7cd; --ink-3: #959ba4; --line: #343941; --line-2: #2a2e34;
  --brand: #0f2f47; --brand-2: #4a9be8; --focus: #6aaef0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --b-good-bg: #12301a; --b-good-fg: #7fdc86; --b-warning-bg: #3a2e0a; --b-warning-fg: #f6cd62; --b-serious-bg: #3d2216; --b-serious-fg: #f3a582; --b-critical-bg: #3f1717; --b-critical-fg: #f39a9a; --b-neutral-bg: #272b30; --b-neutral-fg: #c3c7cd;
  --demo-bg: #3a2e0a; --demo-fg: #f6cd62; --demo-line: #7a5b12;
  --grid: #2d3137; --axis: #959ba4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
html[lang="ar"] body { font-family: var(--font-ar); font-size: 13.5px; }
a { color: var(--brand-2); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; inset-inline-start: -999px; } .skip:focus { inset-inline-start: 8px; top: 8px; z-index: 99; background: var(--surface); padding: 6px; }
h1 { font-size: 20px; margin: 0 0 2px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0; font-weight: 600; }
h3 { font-size: 13.5px; margin: 0; font-weight: 600; }
h4 { font-size: 12px; margin: 14px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
html[lang="ar"] h4 { letter-spacing: 0; text-transform: none; }
.muted { color: var(--ink-3); } .small { font-size: 11.5px; } .mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; } .neg { color: var(--b-critical-fg); }
code, .formula { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 4px; }
.formula { display: block; padding: 8px 10px; margin: 4px 0 8px; white-space: pre-wrap; }
pre.code { background: var(--surface-3); padding: 12px; border-radius: var(--r); overflow: auto; font-size: 12px; direction: ltr; text-align: left; }

/* Header */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--hdr); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--brand); color: #fff; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { display: block; font-size: 14px; white-space: nowrap; } .brand small { display: block; font-size: 11px; opacity: .8; white-space: nowrap; }
.logo { width: 30px; height: 30px; border-radius: 6px; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
.mode { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: .04em; white-space: nowrap; }
.mode.m-demo { background: #ffd666; color: #3d2b00; } .mode.m-live { background: #38c172; color: #062b14; } .mode.m-empty { background: rgba(255,255,255,.2); color: #fff; }
.gsearch { position: relative; flex: 1; max-width: 520px; min-width: 120px; }
.gsearch input { width: 100%; height: 32px; border: 0; border-radius: 4px; padding: 0 10px; background: rgba(255,255,255,.14); color: #fff; font: inherit; }
.gsearch input::placeholder { color: rgba(255,255,255,.7); }
.gsearch input:focus { background: #fff; color: var(--ink); }
#gresults { position: absolute; top: 36px; inset-inline: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 60vh; overflow: auto; padding: 4px; }
#gresults button { display: grid; grid-template-columns: 90px 1fr; gap: 0 8px; width: 100%; text-align: start; border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; color: inherit; font: inherit; }
#gresults button:hover { background: var(--surface-3); } #gresults small { color: var(--ink-3); grid-row: span 2; } #gresults span { color: var(--ink-3); font-size: 11.5px; }
.asof, .sess { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.asof input, .sess select { height: 30px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff; font: inherit; padding: 0 6px; max-width: 220px; }
.sess select option, .asof input { color-scheme: dark; } .sess select option { color: #111; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; color: #fff; border: 0; padding: 5px 9px; font: inherit; font-size: 11.5px; cursor: pointer; }
.seg button.on { background: #fff; color: var(--brand); font-weight: 600; }
#top .btn.icon { color: #fff; border-color: rgba(255,255,255,.35); }

/* Layout */
.body { display: flex; min-height: calc(100vh - var(--hdr)); }
#nav { width: var(--nav); flex: none; background: var(--surface); border-inline-end: 1px solid var(--line); padding: 10px 8px 24px; position: sticky; top: var(--hdr); height: calc(100vh - var(--hdr)); overflow: auto; }
.ng h4 { margin: 12px 8px 4px; font-size: 10.5px; color: var(--ink-3); }
#nav a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; color: var(--ink-2); font-size: 12.5px; }
#nav a:hover { background: var(--surface-3); text-decoration: none; }
#nav a.on { background: color-mix(in srgb, var(--brand-2) 14%, transparent); color: var(--brand-2); font-weight: 600; }
#nav a i { width: 18px; text-align: center; font-style: normal; opacity: .85; }
#nav a span { flex: 1; }
.nb { font-style: normal; background: var(--st-critical); color: #fff; border-radius: 10px; font-size: 10.5px; padding: 0 6px; font-weight: 700; }
.nav-foot { font-size: 10.5px; color: var(--ink-3); margin: 18px 8px 0; }
main { flex: 1; min-width: 0; padding: 16px 20px 40px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.proto-note { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; }
.demo-banner { background: var(--demo-bg); color: var(--demo-fg); border: 1px solid var(--demo-line); border-radius: var(--r); padding: 6px 10px; margin-bottom: 12px; font-weight: 600; font-size: 12px; }
.demo-tag { display: inline-block; font-size: 10px; font-weight: 700; background: var(--demo-bg); color: var(--demo-fg); border: 1px solid var(--demo-line); padding: 0 5px; border-radius: 3px; vertical-align: middle; white-space: nowrap; }

/* Cards & grids */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 14px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); }
.card-b { padding: 12px 14px; overflow-x: auto; }
.grid { display: grid; gap: 14px; } .grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid > .card { margin-bottom: 0; }
.grid + .card, .card + .grid, .grid + .grid { margin-top: 14px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpis.small { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.kpi { text-align: start; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; border-top: 3px solid var(--brand-2); min-width: 0; }
.kpi.static { cursor: default; border-top-color: var(--line); } button.kpi.static { cursor: pointer; }
.kpi:hover:not(.static) { border-color: var(--brand-2); }
.kpi.k-critical { border-top-color: var(--st-critical); } .kpi.k-serious { border-top-color: var(--st-serious); } .kpi.k-good { border-top-color: var(--st-good); }
.kpi-label { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
.kpi-value { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
.kpi-value small { font-size: 11px; color: var(--ink-3); font-weight: 400; } .kpi-value.small { font-size: 14px; }
.kpi-sub { font-size: 11px; color: var(--ink-3); }
.kpi-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.kpi-drill { font-size: 10.5px; color: var(--brand-2); }
.kind { font-size: 9.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.kind-source-value { background: var(--b-good-bg); color: var(--b-good-fg); } .kind-derived { background: color-mix(in srgb, var(--brand-2) 15%, transparent); color: var(--brand-2); } .kind-assumption { background: var(--b-warning-bg); color: var(--b-warning-fg); } .kind-unavailable { background: var(--b-neutral-bg); color: var(--b-neutral-fg); }

/* Badges & pills */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px 1px 5px; border-radius: 10px; white-space: nowrap; line-height: 1.6; }
.badge i { font-style: normal; font-size: 10px; }
.b-good { background: var(--b-good-bg); color: var(--b-good-fg); } .b-warning { background: var(--b-warning-bg); color: var(--b-warning-fg); } .b-serious { background: var(--b-serious-bg); color: var(--b-serious-fg); } .b-critical { background: var(--b-critical-bg); color: var(--b-critical-fg); } .b-neutral { background: var(--b-neutral-bg); color: var(--b-neutral-fg); }
.pill { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 3px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.p-crit { background: var(--b-critical-bg); color: var(--b-critical-fg); } .p-warn { background: var(--b-warning-bg); color: var(--b-warning-fg); }
.na { color: var(--ink-3); font-style: italic; font-size: 11.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { background: var(--surface-3); border-radius: 4px; padding: 2px 8px; font-size: 11.5px; } .chip.off { opacity: .5; }

/* Buttons & forms */
.btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--brand-2); color: var(--brand-2); }
.btn.primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; } .btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
.btn.danger { color: var(--b-critical-fg); border-color: color-mix(in srgb, var(--st-critical) 50%, transparent); }
.btn.ghost { background: transparent; } .btn.sm { height: 24px; padding: 0 8px; font-size: 11.5px; } .btn.icon { width: 32px; justify-content: center; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.page-h .btn-row { margin-top: 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; min-height: 28px; }
input.wide { width: 100%; min-width: 220px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--ink-2); }
.filters.sc label { min-width: 150px; } .filters.sc input { width: 110px; }
.chk { display: inline-flex; gap: 4px; align-items: center; margin-inline-end: 10px; font-size: 12px; }
.mform label { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; } .mform label span { font-size: 12px; font-weight: 600; } .mform textarea, .mform input, .mform select { width: 100%; }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 4px 0 12px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--brand-2); border-bottom-color: var(--brand-2); font-weight: 600; }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line-2); text-align: start; vertical-align: top; }
thead th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 11.5px; position: sticky; top: 0; white-space: nowrap; }
th[data-tsort] { cursor: pointer; user-select: none; } th[data-tsort]:hover { color: var(--brand-2); }
th.n, td.n { text-align: end; font-variant-numeric: tabular-nums; }
tbody tr[data-drill] { cursor: pointer; } tbody tr[data-drill]:hover { background: var(--surface-2); }
tr.exc td:first-child { box-shadow: inset 3px 0 0 var(--st-serious); } html[dir="rtl"] tr.exc td:first-child { box-shadow: inset -3px 0 0 var(--st-serious); }
tr.blocked { opacity: .7; } tr.miss td { background: var(--b-warning-bg); } tr.low td { background: color-mix(in srgb, var(--b-warning-bg) 50%, transparent); } tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
td.empty { text-align: center; color: var(--ink-3); padding: 18px; }
.tbl-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.tbl-bar h3 { flex: 1; } .tbl-q { min-width: 180px; } .tbl-count { color: var(--ink-3); font-size: 11.5px; margin-inline-start: auto; }
.tbl-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--line-2); border-radius: 4px; }
.tbl-pg { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 6px; font-size: 12px; }
table.kv th { width: 42%; color: var(--ink-2); font-weight: 500; background: transparent; position: static; white-space: normal; } table.kv.rec td.k { width: 1%; }
table.matrix th.rot { height: 140px; white-space: nowrap; vertical-align: bottom; } table.matrix th.rot span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 500; } td.c { text-align: center; color: var(--brand-2); }
ul.mini { margin: 0; padding-inline-start: 14px; font-size: 11.5px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; } .chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .ax { fill: var(--axis); font-size: 10.5px; font-family: var(--font); } html[lang="ar"] .chart .ax { font-family: var(--font-ar); }
.chart .val { fill: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.chart .thr { stroke: var(--st-critical); stroke-dasharray: 4 3; stroke-width: 1.5; } .chart .thr-l { fill: var(--b-critical-fg); font-size: 10.5px; }
.chart .d-tot { fill: var(--ink); font-size: 18px; font-weight: 600; }
.chart .mk { cursor: pointer; } .chart g.mk:hover rect:not([fill="transparent"]), .chart path.mk:hover { opacity: .82; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 6px 0 0; font-size: 11.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.legend.v { flex-direction: column; gap: 4px; }
.donut { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 12px; align-items: center; }
#tip { position: fixed; z-index: 60; background: #1d2733; color: #fff; font-size: 11.5px; padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre-line; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.meter { display: inline-block; width: 60px; height: 6px; background: var(--surface-3); border-radius: 3px; vertical-align: middle; overflow: hidden; } .meter span { display: block; height: 100%; }

/* Drawer / modal / toasts */
#drawer { position: fixed; top: var(--hdr); inset-inline-end: 0; width: min(640px, 100vw); height: calc(100vh - var(--hdr)); background: var(--surface); border-inline-start: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0,0,0,.18); z-index: 30; overflow: auto; padding: 14px 16px 40px; }
.dr-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; } .dr-h h2 { font-size: 17px; margin: 2px 0; }
#drawer section { margin: 12px 0; }
#modal { position: fixed; inset: 0; background: rgba(15, 20, 28, .5); z-index: 40; display: grid; place-items: center; padding: 16px; }
#modal[hidden], #drawer[hidden], #tip[hidden], #gresults[hidden] { display: none; }
.modal-card { background: var(--surface); border-radius: 8px; width: min(620px, 100%); max-height: 88vh; overflow: auto; box-shadow: 0 16px 48px rgba(0,0,0,.3); }
.modal-card.wide { width: min(980px, 100%); }
.modal-card header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-body { padding: 14px 16px 18px; }
#toasts { position: fixed; bottom: 16px; inset-inline-end: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 70; }
.toast { background: #1d2733; color: #fff; padding: 9px 12px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 420px; font-size: 12.5px; border-inline-start: 4px solid var(--brand-2); }
.toast.t-ok { border-inline-start-color: var(--st-good); } .toast.t-error { border-inline-start-color: var(--st-critical); }

/* Lineage / evidence */

/* SUMED P2P — core utilities (no dependencies). Classic script: attaches to window.SUMED */

    const m = new Map();

      m.get(k).push(x);
    }

  };
  U.indexBy = (arr, f) => {
    const m = new Map();

  /* ---------- Numbers ---------- */
  const AR_DIGITS = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '٫': '.', '٬': ',' };
  U.normDigits = (s) => String(s).replace(/[٠-٩٫٬]/g, (c) => AR_DIGITS[c]);

  U.parseNum = (v) => {
    if (v == null || v === '') return null;

    let s = U.normDigits(String(v)).trim();

    if (['n', 'no', 'false', '0', 'لا', '-'].includes(s)) return false;
    return null;

  /* ---------- Dates (ISO yyyy-mm-dd strings everywhere) ---------- */
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };

      if (b > 12) return U.isoFromParts(m[3], a, b);

  U.normInvNo = (v) => {
    if (v == null) return '';
    let s = U.normDigits(String(v)).toUpperCase().replace(/[^A-Z0-9]/g, '');

    a = a || ''; b = b || '';

    text = String(text).replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0] || '';
    const cands = [',', ';', '\t', '|'];
    const delim = cands.reduce((best, d) => (first.split(d).length > first.split(best).length ? d : best), ',');
    const rows = [];
    let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { f += '"'; i++; } else q = false;
        } else f += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f); rows.push(row); row = []; f = '';
      } else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
  };
  U.toCSV = (rows) =>
    '﻿' + rows.map((r) => r.map((v) => {
      const s = v == null ? '' : String(v);
      return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');

  U.download = (name, content, mime = 'text/plain;charset=utf-8') => {
    if (typeof document === 'undefined') return;
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    // Shared web view (claude.ai artifact): saves go through the viewer's confirmation prompt.
    if (root.SUMED_ARTIFACT && root.claude && root.claude.use) {
      const toast = (m, k) => root.SUMED.ui && root.SUMED.ui.toast(m, k);
      root.claude.use('downloads').then((dl) => {
        if (!dl) return toast(root.SUMED.t('dl.unavailable', 'File saving is not available in this view.'), 'error');
        return dl.save({ filename: name, data: blob }).catch((e) => { if (e && e.code !== 'declined') toast(root.SUMED.t('dl.failed', 'The file could not be saved ({c}).', { c: e.code || 'error' }), 'error'); });
      });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    // Revoke late: revoking before the browser starts reading the blob silently cancels the download.
    setTimeout(() => a.remove(), 0);
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  };

  U.uid = (p = 'id') => p + '-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36);
  U.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /** Lazy-load an external script once (used for optional parsers: SheetJS, pdf.js, Tesseract, JSZip, mammoth). */
  const loaded = {};
  /** Try local (vendored) copy first, then CDN fallbacks. */
  U.loadAny = async (srcs) => {
    let last;
    for (const s of [].concat(srcs)) { try { await U.loadScript(s); return s; } catch (e) { last = e; } }
    throw last || new Error('No source');
  };
  U.loadScript = (src) => {
    if (typeof document === 'undefined') return Promise.reject(new Error('no document'));
    if (!loaded[src]) {
      loaded[src] = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        if (/^https?:/i.test(src)) s.crossOrigin = 'anonymous'; // never on local/file:// paths (would trigger CORS)
        s.onload = () => res(true);
        s.onerror = () => { delete loaded[src]; rej(new Error('Failed to load ' + src)); };
        document.head.appendChild(s);
      });
    }
    return loaded[src];
  };
})(typeof window !== 'undefined' ? window : globalThis);

  /** Score how well a header row fits an entity. Returns {entity, score, mapping} */
  S.classifyHeaders = (headers, fileName = '') => {
    const H = headers.map(nh);
    const fn = nh(fileName);

    for (const [entity, def] of Object.entries(S.schema)) {
      const mapping = S.autoMap(H, def);
      const mapped = Object.keys(mapping).length;
      const reqFields = def.fields.filter((f) => f.req);
      const reqHit = reqFields.filter((f) => mapping[f.key] != null).length;
      let score = mapped * 2 + reqHit * 4 - (reqFields.length - reqHit) * 3;
      if (def.keywords.some((k) => fn.includes(nh(k)))) score += 6;
      if (fn.includes(nh(def.label))) score += 8;
      results.push({ entity, score, mapping, reqHit, reqTotal: reqFields.length, mapped });
    }
    results.sort((a, b) => b.score - a.score);
    const best = results[0];
    const confidence = best.reqTotal ? best.reqHit / best.reqTotal : 0;
    return { ...best, confidence, alternatives: results.slice(1, 4) };

  S.autoMap = (H, def) => {

      for (const f of def.fields) {
        if (mapping[f.key] != null) continue;
        const syns = [nh(f.key.replace(/([A-Z])/g, ' $1')), ...f.syn.map(nh)];

          const ok = exact ? syns.includes(H[i]) : syns.some((s) => s.length > 3 && (H[i] === s || H[i].startsWith(s + ' ') || H[i].endsWith(' ' + s)));

        }

    pass(false);

/* js/core/store.js */
/* SUMED P2P — state store, session/permissions, immutable audit trail, persistence. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});
  const U = S.util;
  const LS_WS = 'sumed.p2p.workspace.v1';
  const LS_PREF = 'sumed.p2p.prefs.v1';

  const emptyData = () => Object.fromEntries(S.entityOrder.map((k) => [k, []]));

  S.state = {
    mode: 'empty', // 'empty' | 'demo' | 'live'
    data: emptyData(),
    sources: [], // uploaded files & sheets with classification
    ocrDocs: [], // OCR / text-extraction results with field confidences
    config: S.defaultConfig(),
    roles: S.defaultRoles(),
    session: { userId: 'local.admin', name: 'Local Administrator', role: 'System Administrator', sessionId: U.uid('sess'), startedAt: new Date().toISOString() },
    audit: [],
    revealLog: [],
    prefs: { lang: 'en', theme: 'auto', route: 'dashboard' },
    persistWarning: null,
  };

  /* ---------------- Listeners ---------------- */
  const listeners = new Set();
  S.on = (fn) => listeners.add(fn);
  S.emit = (what) => listeners.forEach((fn) => { try { fn(what); } catch (e) { console.error(e); } });

  /* ---------------- Session & permissions ---------------- */
  S.can = (perm) => {
    const perms = S.state.roles[S.state.session.role] || [];
    if (perms.includes(perm)) return true;
    if (perm.startsWith('view.') && perms.includes('view.all') && perm !== 'view.sensitive' && perm !== 'view.audit') return true;
    if (perm === 'view.audit' && (perms.includes('view.all'))) return true; // read-only audit view for all view.all roles
    return false;
  };
  S.setSession = (user) => {
    const prev = S.state.session;
    S.state.session = { userId: user.userId, name: user.name, role: user.role, sessionId: U.uid('sess'), startedAt: new Date().toISOString() };
    S.audit('session.switch', 'session', user.userId, { field: 'role', oldValue: prev.role + ' / ' + prev.userId, newValue: user.role + ' / ' + user.userId });
    S.emit('session');
  };
  /** Display a sensitive value: masked unless the role holds view.sensitive AND it was explicitly revealed. */
  S.sensitive = (value, key) => {
    if (U.isBlank(value)) return null;
    if (S.can('view.sensitive') && S.state.revealLog.some((r) => r.key === key && r.sessionId === S.state.session.sessionId)) return String(value);
    return U.maskAccount(value);
  };
  S.reveal = (key, reason) => {
    if (!S.can('view.sensitive')) return false;
    S.state.revealLog.push({ key, sessionId: S.state.session.sessionId, at: new Date().toISOString() });
    S.audit('sensitive.reveal', 'bank-detail', key, { reason: reason || 'Operational need' });
    return true;
  };

  /* ---------------- Audit trail (append-only, hash-chained, frozen) ---------------- */
  const entryPayload = (e) => [e.seq, e.ts, e.userId, e.role, e.sessionId, e.action, e.entity, e.recordId, e.field, JSON.stringify(e.oldValue ?? null), JSON.stringify(e.newValue ?? null), e.reason || '', e.prevHash].join('|');
  S.audit = (action, entity, recordId, extra = {}) => {
    const log = S.state.audit;
    const prev = log[log.length - 1];
    const ses = S.state.session;
    const e = {
      seq: log.length + 1,
      ts: new Date().toISOString(),
      userId: ses.userId, userName: ses.name, role: ses.role, sessionId: ses.sessionId,
      client: typeof navigator !== 'undefined' ? (navigator.userAgent || '').slice(0, 80) : 'node',
      ip: 'Not Available in Source Data', // a browser cannot see its own public IP; supplied by server in ERP deployment
      action, entity, recordId: recordId == null ? null : String(recordId),
      field: extra.field || null, oldValue: extra.oldValue ?? null, newValue: extra.newValue ?? null,
      reason: extra.reason || null,
      prevHash: prev ? prev.hash : '0'.repeat(16),
    };
    e.hash = U.hash(entryPayload(e));
    log.push(Object.freeze(e));
    S.persistSoon();
    return e;
  };
  S.verifyAudit = () => {
    const log = S.state.audit;
    for (let i = 0; i < log.length; i++) {
      const e = log[i];
      const expPrev = i ? log[i - 1].hash : '0'.repeat(16);
      if (e.prevHash !== expPrev || U.hash(entryPayload(e)) !== e.hash || e.seq !== i + 1) return { ok: false, brokenAt: i + 1, total: log.length };
    }
    return { ok: true, total: log.length };
  };

  /* ---------------- Record mutation through workflow only ---------------- */
  /** Change a field on a record; logs old/new to the audit trail and keeps edit lineage on the record. */
  S.updateRecord = (entity, rec, field, value, reason, action) => {
    const old = rec[field];
    if (old === value) return;
    rec[field] = value;
    rec._edits = rec._edits || {};
    rec._edits[field] = { old, new: value, by: S.state.session.userId, at: new Date().toISOString(), reason: reason || null };
    const pk = S.schema[entity] && S.schema[entity].pk;
    S.audit(action || entity + '.update', entity, pk ? rec[pk] : rec._key, { field, oldValue: old, newValue: value, reason });
  };
  S.addRecord = (entity, rec, action, reason) => {
    rec._key = rec._key || entity + ':' + (S.state.data[entity].length + 1) + ':' + U.uid('r').slice(-5);
    rec._origin = 'app';
    rec._demo = S.state.mode === 'demo';
    rec._src = rec._src || { file: 'Created in application', sheet: entity, row: null };
    S.state.data[entity].push(rec);
    const pk = S.schema[entity] && S.schema[entity].pk;
    S.audit(action || entity + '.create', entity, pk ? rec[pk] : rec._key, { newValue: pk ? rec[pk] : null, reason });
    return rec;
  };

  /* ---------------- Loading datasets ---------------- */
  S.resetData = (mode) => {
    S.state.data = emptyData();
    S.state.sources = [];
    S.state.ocrDocs = [];
    S.state.mode = mode || 'empty';
  };
  S.findRecord = (entity, id) => {
    const pk = S.schema[entity] && S.schema[entity].pk;
    return S.state.data[entity].find((r) => (pk && String(r[pk]) === String(id)) || r._key === id) || null;
  };

  /* ---------------- Persistence (best effort; never required) ---------------- */
  S.loadPrefs = () => {
    try {
      const p = JSON.parse(localStorage.getItem(LS_PREF) || 'null');
      if (p) Object.assign(S.state.prefs, p);
    } catch (e) { /* storage unavailable */ }
  };
  S.savePrefs = () => {
    try { localStorage.setItem(LS_PREF, JSON.stringify(S.state.prefs)); } catch (e) { /* ignore */ }
  };
  S.serialize = () => JSON.stringify({
    format: 'sumed-p2p-workspace', version: 1, savedAt: new Date().toISOString(),
    mode: S.state.mode, data: S.state.data, sources: S.state.sources, ocrDocs: S.state.ocrDocs,
    config: S.state.config, roles: S.state.roles, audit: S.state.audit, alertStatus: S.state.alertStatus || {},
  });
  S.deserialize = (json) => {
    const w = typeof json === 'string' ? JSON.parse(json) : json;
    if (!w || w.format !== 'sumed-p2p-workspace') throw new Error('Not a SUMED P2P workspace file');
    S.state.mode = w.mode;
    S.state.data = Object.assign(emptyData(), w.data);
    S.state.sources = w.sources || [];
    S.state.ocrDocs = w.ocrDocs || [];
    S.state.config = Object.assign(S.defaultConfig(), w.config || {});
    S.state.roles = Object.assign(S.defaultRoles(), w.roles || {});
    S.state.audit = (w.audit || []).map((e) => Object.freeze(e));
    S.state.alertStatus = w.alertStatus || {};
  };
  let tmr = null;
  S.persistSoon = () => {
    if (typeof window === 'undefined') return;
    clearTimeout(tmr);
    tmr = setTimeout(S.persist, 400);
  };
  S.persist = () => {
    try {
      const s = S.serialize();
      if (s.length > 4.5e6) { S.state.persistWarning = 'size'; return; }
      localStorage.setItem(LS_WS, s);
      S.state.persistWarning = null;
    } catch (e) { S.state.persistWarning = 'unavailable'; }
  };
  S.restore = () => {
    try {
      const s = localStorage.getItem(LS_WS);
      if (!s) return false;
      S.deserialize(s);
      return true;
    } catch (e) { return false; }
  };
  S.clearWorkspace = () => {
    try { localStorage.removeItem(LS_WS); } catch (e) { /* ignore */ }
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* SUMED P2P — i18n core. S.t(key, englishDefault, params). Arabic lives in i18n-ar.js.
 * Dynamic keys (statuses, rules, drivers…) have their English text in S.i18n.en below. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});
  const U = S.util;
  S.i18n = S.i18n || { en: {}, ar: {} };

  const interp = (s, p) => (p ? String(s).replace(/\{(\w+)\}/g, (m, k) => (p[k] == null ? '—' : p[k])) : String(s));
  S.lang = () => (S.state && S.state.prefs.lang) || 'en';
  S.isAr = () => S.lang() === 'ar';
  S.t = (key, def, params) => {
    if (def && typeof def === 'object') { params = def; def = undefined; }
    const lang = S.lang();
    let s = lang === 'ar' ? S.i18n.ar[key] : undefined;
    if (s == null) s = S.i18n.en[key] != null ? S.i18n.en[key] : def;
    if (s == null) s = S.i18n.en[key] != null ? S.i18n.en[key] : key.split('.').pop().replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase());
    return interp(s, params);
  };

      const c = ccy || S.state.config.baseCurrency;
      if (opts.compact) {
        const a = Math.abs(v);
        const [div, suf] = a >= 1e9 ? [1e9, S.t('u.bn', 'bn')] : a >= 1e6 ? [1e6, S.t('u.m', 'M')] : a >= 1e3 ? [1e3, S.t('u.k', 'K')] : [1, ''];

/* js/data/ingest.js */
/* SUMED P2P — ingestion: parse → classify → map → normalise. OCR/text extraction with field confidence.
 * Optional parsers are lazy-loaded from public CDNs; if unavailable the file is registered as
 * "Parser unavailable" — nothing is guessed. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});
  const U = S.util;
  const I = (S.ingest = {});

  // Parsers: vendored copies (vendor/, works offline and on file://) first, public CDN as fallback.
  I.CDN = {
    xlsx: ['vendor/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
    pdf: ['vendor/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'],
    pdfWorker: ['vendor/pdf.worker.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
    tesseract: ['https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'],
    jszip: ['vendor/jszip.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'],
    mammoth: ['vendor/mammoth.browser.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'],
  };

  const ext = (name) => (String(name).split('.').pop() || '').toLowerCase();
  const kindOf = (name, mime) => {
    const e = ext(name);
    if (['csv', 'txt', 'tsv'].includes(e)) return 'csv';
    if (['xlsx', 'xls', 'xlsm'].includes(e)) return 'xlsx';
    if (e === 'json') return 'json';
    if (e === 'pdf') return 'pdf';
    if (['png', 'jpg', 'jpeg', 'tif', 'tiff', 'bmp', 'webp'].includes(e) || /^image\//.test(mime || '')) return 'image';
    if (['docx', 'doc'].includes(e)) return 'docx';
    if (e === 'zip') return 'zip';
    return 'other';
  };

  /** Find the header row: first row (within first 15) with ≥ 3 non-empty text cells. */
  I.findHeaderRow = (rows) => {
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const cells = rows[i].filter((c) => !U.isBlank(c));
      if (cells.length >= 3 && cells.filter((c) => isNaN(U.parseNum(c))).length >= Math.ceil(cells.length * 0.6)) return i;
    }
    return 0;
  };

  /** Turn a 2-D sheet into a classified, mapped "sheet source" (not yet committed). */
  I.sheetFromRows = (fileName, sheetName, rows) => {
    const hr = I.findHeaderRow(rows);
    const headers = (rows[hr] || []).map((h) => String(h == null ? '' : h).trim());
    const body = rows.slice(hr + 1).filter((r) => r.some((c) => !U.isBlank(c)));
    const cls = S.classifyHeaders(headers, fileName + ' ' + sheetName);
    return {
      name: sheetName, headerRow: hr + 1, headers, rows: body, rowCount: body.length,
      entity: cls.confidence >= 0.5 && cls.score > 4 ? cls.entity : null,
      suggested: cls.entity, confidence: cls.confidence, mapping: cls.mapping,
      alternatives: cls.alternatives.map((a) => a.entity),
    };
  };

  I.parseFile = async (file) => {
    const kind = kindOf(file.name, file.type);
    const src = {
      fileId: U.uid('file'), name: file.name, size: file.size, kind, mime: file.type || '',
      uploadedAt: new Date().toISOString(), uploadedBy: S.state.session.userId,
      sheets: [], docs: [], status: 'Parsed', notes: [], hash: null,
    };
    try {
      if (kind === 'csv') {
        const text = await file.text();
        src.hash = U.hash(text);
        src.sheets.push(I.sheetFromRows(file.name, 'CSV', U.parseCSV(text)));
      } else if (kind === 'json') {
        const text = await file.text();
        src.hash = U.hash(text);
        const j = JSON.parse(text);
        if (j && j.format === 'sumed-p2p-workspace') { src.workspace = j; src.notes.push('Workspace file'); }
        else {
          const arr = Array.isArray(j) ? j : Object.values(j).find(Array.isArray) || [];
          const headers = U.uniq(arr.flatMap((o) => Object.keys(o || {})));
          src.sheets.push(I.sheetFromRows(file.name, 'JSON', [headers, ...arr.map((o) => headers.map((h) => o[h]))]));
        }
      } else if (kind === 'xlsx') {
        await U.loadAny(I.CDN.xlsx);
        const buf = await file.arrayBuffer();
        src.hash = U.hash(String(buf.byteLength) + file.name + file.lastModified);
        const wb = root.XLSX.read(buf, { type: 'array', cellDates: true });
        for (const sn of wb.SheetNames) {
          const rows = root.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
          if (rows.length) src.sheets.push(I.sheetFromRows(file.name, sn, rows));
        }
      } else if (kind === 'pdf' || kind === 'image') {
        const doc = await I.extractDocument(file, kind);
        src.hash = doc.hash;
        src.docs.push(doc);
      } else if (kind === 'docx') {
        await U.loadAny(I.CDN.mammoth);
        const r = await root.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        src.hash = U.hash(r.value);
        src.docs.push(I.buildDoc(file.name, [{ page: 1, text: r.value, conf: 1, method: 'docx-text' }], U.hash(r.value)));
      } else if (kind === 'zip') {
        await U.loadAny(I.CDN.jszip);
        const zip = await root.JSZip.loadAsync(await file.arrayBuffer());
        src.children = [];
        for (const entry of Object.values(zip.files)) {
          if (entry.dir || /(^|\/)(__MACOSX|\.)/.test(entry.name)) continue;
          const blob = await entry.async('blob');
          const f = new File([blob], entry.name.split('/').pop(), { type: '' });
          src.children.push(await I.parseFile(f));
        }
        src.notes.push(`${src.children.length} files extracted from archive`);
      } else {
        src.status = 'Unsupported';
        src.notes.push('Stored as supporting document; no structured data extracted');
      }
    } catch (e) {
      src.status = 'Parser unavailable';
      src.notes.push(String(e.message || e));
    }
    src.classifiedAs = I.describeSource(src);
    return src;
  };

  I.describeSource = (src) => {
    if (src.workspace) return 'Workspace';
    if (src.children) return 'Archive';
    if (src.docs && src.docs.length) return src.docs[0].docType;
    const ents = U.uniq(src.sheets.map((s) => s.entity).filter(Boolean));
    return ents.length ? ents.map((e) => S.schema[e].label).join(', ') : 'Unclassified';
  };

  /* ---------------- Normalisation ---------------- */
  I.normalize = (entity, sheet, fileName) => {
    const def = S.schema[entity];
    const order = S.state.config.dateOrder;
    const out = [];
    sheet.rows.forEach((row, i) => {
      const rec = { _src: { file: fileName, sheet: sheet.name, row: sheet.headerRow + 1 + i }, _raw: {}, _issues: [], _demo: false };
      for (const f of def.fields) {
        const col = sheet.mapping[f.key];
        if (col == null) continue;
        const raw = row[col];
        rec._raw[f.key] = raw;
        if (U.isBlank(raw)) { rec[f.key] = null; continue; }
        let v;
        if (f.type === 'n') v = U.parseNum(raw);
        else if (f.type === 'd') v = U.parseDate(raw, order);
        else if (f.type === 'b') v = U.parseBool(raw);
        else v = String(raw instanceof Date ? U.parseDate(raw) : raw).trim();
        if (v == null) rec._issues.push({ field: f.key, issue: f.type === 'n' ? 'invalidNumber' : f.type === 'd' ? 'invalidDate' : 'invalidValue', raw: String(raw) });
        rec[f.key] = v;
      }
      if (entity === 'bankTxns' && rec.amount == null && (rec.debit != null || rec.credit != null)) {
        rec.amount = (rec.credit || 0) - (rec.debit || 0);
        (rec._derived = rec._derived || {}).amount = 'credit − debit';
      }
      if (entity === 'payments' && rec.gross == null && rec.net != null) {
        rec.gross = rec.net + (rec.wht || 0);
        (rec._derived = rec._derived || {}).gross = 'net + withholding';
      }
      if (entity === 'invoices' && rec.total == null && rec.subtotal != null) {
        rec.total = rec.subtotal + (rec.tax || 0);
        (rec._derived = rec._derived || {}).total = 'subtotal + tax';
      }
      ['currency', 'contractCurrency'].forEach((k) => { if (rec[k]) rec[k] = String(rec[k]).toUpperCase().replace('LE', 'EGP').replace('جنيه', 'EGP').trim(); });
      rec._key = entity + ':' + U.hash(fileName + '|' + sheet.name + '|' + i).slice(0, 10);
      out.push(rec);
    });
    return out;
  };

  /** Commit confirmed sources into the workspace. */
  I.commit = (sources) => {
    if (S.state.mode === 'demo') S.resetData('live');
    S.state.mode = 'live';
    const flat = [];
    const walk = (s) => { flat.push(s); (s.children || []).forEach(walk); };
    sources.forEach(walk);
    for (const src of flat) {
      if (src.workspace) { S.deserialize(src.workspace); S.audit('workspace.import', 'workspace', src.name); continue; }
      const dup = S.state.sources.find((x) => x.hash && x.hash === src.hash);
      if (dup) { src.status = 'Duplicate file (skipped)'; src.notes.push('Identical to ' + dup.name); }

        const nums = (ln.match(/[\d][\d,]*\.?\d*/g) || []).map(U.parseNum).filter((x) => x != null);

      const med = v[Math.floor(v.length / 2)];

      const after = allPays.filter((p) => p.supplierId === c.supplierId && p.paymentDate && c.changeDate && p.paymentDate >= c.changeDate && U.daysBetween(c.changeDate, p.paymentDate) <= F.bankChangePayWindowDays);

    if (pend.length) add({ area: 'ap', key: 'approvalBacklog', params: { n: pend.length, days: cfg.alerts.approvalDelayDays }, impact: U.sum(pend, (i) => i._outBase || 0), rows: pend, priority: 'MEDIUM', owner: 'AP Manager', rootCause: 'approvalBottleneck' });
    const exc = D.invoices.filter((i) => { const m = ctx.match.get(i._key); return m && !['MATCHED', 'PARTIALLY MATCHED'].includes(m.status) && !i._closed; });
    if (exc.length) add({ area: 'ap', key: 'matchExceptions', params: { n: exc.length, pct: U.round((exc.length / Math.max(1, D.invoices.length)) * 100, 1) }, impact: U.sum(exc, (i) => i._totalBase || 0), rows: exc, priority: 'HIGH', owner: 'AP Manager', rootCause: 'p2pComplianceGaps' });
    // Procurement
    if (ctx.spend.nonPO.length) add({ area: 'procurement', key: 'nonPO', params: { pct: U.round((U.sum(ctx.spend.nonPO, (r) => r.amountBase) / ctx.spend.total) * 100, 1) }, impact: U.sum(ctx.spend.nonPO, (r) => r.amountBase), rows: ctx.spend.nonPO.map((r) => r.rec), priority: 'MEDIUM', owner: 'Procurement Manager', rootCause: 'poBypass' });
    for (const c of ctx.contracts.list.filter((x) => x.alerts.includes('expiring'))) add({ area: 'procurement', key: 'contractExpiring', params: { id: c.c.contractId, name: (P.sup.get(c.c.supplierId) || {}).name || c.c.supplierId, days: c.remainingDays }, impact: c.c._valueBase, rows: [c.c], priority: c.remainingDays <= 30 ? 'HIGH' : 'MEDIUM', owner: 'Procurement Manager', rootCause: 'renewalNotStarted' });
    // Supplier
    const hr = Array.from(ctx.risk.entries()).filter(([, r]) => ['HIGH', 'CRITICAL'].includes(r.rating)).sort((a, b) => b[1].score - a[1].score);
    for (const [sid, r] of hr.slice(0, 5)) add({ area: 'supplier', key: 'supplierRisk', params: { name: (P.sup.get(sid) || {}).name || sid, score: r.score, rating: r.rating, drivers: r.drivers.slice(0, 4).map((d) => d.key) }, impact: (ctx.aging.bySup.find((x) => x.supplierId === sid) || {}).total || null, rows: r.drivers.flatMap((d) => d.rows).concat([P.sup.get(sid)]), priority: r.rating, owner: 'Procurement Manager', rootCause: r.drivers[0] ? r.drivers[0].key : null, supplierId: sid });
    // Audit / controls
    const fails = ctx.controls.tests.filter((t) => t.status === 'FAIL');
    if (fails.length) add({ area: 'audit', key: 'controlFails', params: { n: fails.length, ids: fails.slice(0, 6).map((t) => t.id).join(', ') }, impact: null, rows: fails.flatMap((t) => t.exceptions).slice(0, 200), priority: 'HIGH', owner: 'Internal Auditor', rootCause: 'controlDesignOrOperation' });
    if (ctx.sod.tx.length) add({ area: 'audit', key: 'sod', params: { n: ctx.sod.tx.length, users: U.uniq(ctx.sod.tx.map((x) => x.user)).length }, impact: null, rows: ctx.sod.tx.map((x) => x.rec), priority: 'CRITICAL', owner: 'Internal Auditor', rootCause: 'sodNotEnforced' });
    // Fraud
    const crit = ctx.alerts.list.filter((a) => a.severity === 'CRITICAL');
    if (crit.length) add({ area: 'fraud', key: 'criticalAlerts', params: { n: crit.length, rules: U.uniq(crit.map((a) => a.rule)).slice(0, 4).join(', ') }, impact: U.sum(crit, (a) => a.amountBase || 0), rows: crit.flatMap((a) => a.rows), priority: 'CRITICAL', owner: 'Internal Auditor', rootCause: 'preventiveControlGap' });
    // Cost
    for (const s of ctx.savings.filter((x) => x.saving > 0).slice(0, 3)) add({ area: 'cost', key: 'saving_' + s.type, params: { n: s.n }, impact: s.saving, rows: s.rows, priority: s.confidence === 'High' ? 'HIGH' : 'MEDIUM', owner: s.type === 'earlyDiscount' || s.type === 'missedDiscount' ? 'Treasury Manager' : 'Procurement Manager', rootCause: s.type, calc: s.method, confidence: s.confidence });
    L.forEach((x) => { x.evidence = E.sourceSummary(x.rows || []); x.completeness = (x.rows || []).length ? (x.rows.every((r) => r && r._src) ? 'High' : 'Medium') : 'Low'; x.cur = cur; });
    return L.sort((a, b) => SEV[b.priority] - SEV[a.priority] || (b.impact || 0) - (a.impact || 0));
  };

  /* ---------------- Action center ---------------- */
  E.actions = (D, P, cfg, asOf, ctx) => {
    const A = [];
    const add = (bucket, o) => A.push(Object.assign({ id: 'ACT-' + A.length, bucket }, o));
    const name = (sid) => (P.sup.get(sid) || {}).name || sid;
    const critDue = ctx.priority.filter((x) => !x.blocks.length && ['overdue', 'today'].includes(x.horizon) && (P.sup.get(x.supplierId) || {}).critical);
    for (const [sid, qs] of U.groupBy(critDue, 'supplierId')) add('today', { key: 'criticalDue', params: { n: qs.length, inv: qs.map((q) => q.inv.invoiceNo).slice(0, 3).join(', '), name: name(sid), dpd: Math.max(...qs.map((q) => q.inv._dpd)) }, impact: U.sum(qs, (q) => q.amountBase || 0), owner: 'Treasury Manager', due: asOf, rec: 'payOrSchedule', rows: qs.map((q) => q.inv) });
    for (const a of ctx.alerts.list.filter((x) => x.severity === 'CRITICAL' && ['duplicatePayment', 'duplicateInvoice', 'paymentAfterBankChange', 'beneficiaryMismatch', 'sharedBankAccount', 'inactiveSupplierPaid'].includes(x.rule)).slice(0, 8)) add('today', { key: 'alert_' + a.rule, params: { txn: a.txn, name: name(a.supplierId) }, impact: a.amountBase, owner: 'Internal Auditor', due: asOf, rec: a.action, rows: a.rows, alertId: a.id });
    for (const c of Object.values(ctx.cash.currencies).filter((x) => x.belowMinDays && x.min)) add(U.daysBetween(asOf, c.min.date) <= 7 ? 'today' : 'week', { key: 'liquidityGap', params: { ccy: c.currency, date: c.min.date }, impact: c.fundingReq != null && c.rate ? c.fundingReq * c.rate : null, owner: 'Treasury Manager', due: c.min.date, rec: 'arrangeFunding', rows: c.accounts });
    for (const [sid, r] of ctx.risk) {
      if (!['HIGH', 'CRITICAL'].includes(r.rating)) continue;
      const up = ctx.items.filter((x) => x.supplierId === sid && x.date && U.daysBetween(asOf, x.date) <= 7 && x.type !== 'poCommitment');
      if (up.length) add('today', { key: 'riskyPayment', params: { name: name(sid), score: r.score, n: up.length }, impact: U.sum(up, (x) => x.amountBase || 0), owner: 'Compliance Officer', due: up.map((x) => x.date).sort()[0], rec: 'reviewBeforePay', rows: up.map((x) => x.rec) });
    }
    const blocked = ctx.priority.filter((x) => x.blocks.some((b) => b === 'notApproved') && x.inv._dpd != null && x.inv._dpd >= -7);
    if (blocked.length) add('week', { key: 'approvalBottleneck', params: { n: blocked.length }, impact: U.sum(blocked, (x) => x.amountBase || 0), owner: 'AP Manager', due: U.addDays(asOf, 2), rec: 'expediteApproval', rows: blocked.map((x) => x.inv) });
    for (const c of ctx.contracts.list.filter((x) => x.alerts.includes('expiring'))) add(c.remainingDays <= 7 ? 'week' : 'month', { key: 'contractExpiring', params: { id: c.c.contractId, name: name(c.c.supplierId), days: c.remainingDays }, impact: c.c._valueBase, owner: 'Procurement Manager', due: c.c.endDate, rec: 'renewOrRetender', rows: [c.c] });
    for (const s of D.suppliers.filter((x) => /approved/i.test(x.approvedStatus || ''))) {
      const dc = ctx.docs.get(s.supplierId);
      const ap = ctx.aging.bySup.find((x) => x.supplierId === s.supplierId);
      if (dc && (dc.expired.length || dc.missing.length) && ap) add('week', { key: 'docsMissing', params: { name: s.name, docs: dc.expired.concat(dc.missing).slice(0, 4).join(', ') }, impact: ap.total, owner: 'Compliance Officer', due: U.addDays(asOf, 5), rec: 'obtainDocuments', rows: [s] });
    }
    for (const c of D.bankChanges.filter((x) => x.verified === false)) add('today', { key: 'bankUnverified', params: { name: name(c.supplierId), date: c.changeDate }, impact: null, owner: 'Treasury Manager', due: asOf, rec: 'callbackVerify', rows: [c] });
    for (const t of ctx.controls.tests.filter((x) => x.status === 'FAIL')) add('month', { key: 'controlFail', params: { id: t.id, n: t.count }, impact: null, owner: 'Internal Auditor', due: U.addDays(asOf, 30), rec: 'remediateControl', rows: t.exceptions.slice(0, 50), testId: t.id });
    A.forEach((a) => (a.evidence = E.sourceSummary(a.rows)));
    return A;
  };

  /* ---------------- Automated alerts (configurable) ---------------- */
  E.autoAlerts = (D, P, cfg, asOf, ctx) => {
    const c = cfg.alerts;
    const on = c.enabled;
    const res = [];
    const add = (type, rows, params) => { if (on[type] !== false) res.push({ type, count: rows.length, rows, params: params || {} }); };
    add('invoiceDue', D.invoices.filter((i) => i._open && i._dpd != null && i._dpd <= 0 && i._dpd >= -c.invoiceDueDays), { days: c.invoiceDueDays });
    add('invoiceOverdue', D.invoices.filter((i) => i._open && i._dpd > 0));
    add('largePayment', ctx.items.filter((x) => x.amountBase >= c.largePayment && x.type !== 'poCommitment').map((x) => x.rec), { amount: c.largePayment });
    add('riskIncrease', D.suppliers.filter((s) => { const r = ctx.risk.get(s.supplierId); return r && ['HIGH', 'CRITICAL'].includes(r.rating); }));
    add('bankChange', D.bankChanges.filter((x) => x.changeDate && U.daysBetween(x.changeDate, asOf) <= cfg.risk.bankChangeLookbackDays));
    add('contractExpiry', ctx.contracts.list.filter((x) => x.remainingDays != null && x.remainingDays >= 0 && x.remainingDays <= c.contractExpiryDays).map((x) => x.c), { days: c.contractExpiryDays });
    add('paymentAnomaly', ctx.alerts.list.filter((a) => a.category === 'PAYMENT').flatMap((a) => a.rows.slice(0, 1)));
    add('duplicateInvoice', ctx.dupInv.list.map((d) => D.invoices.find((i) => i._key === d.b)));
    add('duplicatePayment', ctx.dupPay.map((d) => D.payments.find((p) => p._key === d.b)));
    add('cashShortfall', Object.values(ctx.cash.currencies).filter((x) => x.belowMinDays).flatMap((x) => x.accounts));
    add('approvalDelay', D.invoices.filter((i) => i._open && !/approved/i.test(i.approvalStatus || '') && i.receivedDate && U.daysBetween(i.receivedDate, asOf) > c.approvalDelayDays), { days: c.approvalDelayDays });
    add('docExpiry', D.supplierDocs.filter((d) => d.expiryDate && U.daysBetween(asOf, d.expiryDate) <= c.docExpiryDays), { days: c.docExpiryDays });
    add('poNearLimit', D.pos.filter((p) => { const inv = U.sum((P.invByPo.get(p.poNo) || []).filter((i) => !i._closed), (i) => i.total); return p._total && inv / p._total * 100 >= c.poNearLimitPct; }), { pct: c.poNearLimitPct });
    return res;
  };

  /* ---------------- Orchestrator ---------------- */
  E.run = () => {
    const t0 = Date.now();
    const st = S.state;
    const D = st.data, cfg = st.config;
    const asOf = cfg.asOfDate || U.todayISO();
    const P = E.prepare(D, cfg, asOf);
    const ctx = { asOf, cfg, P };
    ctx.dupInv = E.duplicateInvoices(D, P, cfg);
    ctx.dupPay = E.duplicatePayments(D, P, cfg, ctx.dupInv);
    ctx.match = E.threeWay(D, P, cfg, ctx.dupInv);
    ctx.aging = E.aging(D, P, cfg, asOf);
    ctx.dpo = E.dpo(D, P, cfg);
    ctx.spend = E.spend(D, P, cfg, asOf);
    ctx.contracts = E.contracts(D, P, cfg, asOf, ctx.spend);
    ctx.docs = E.supplierDocs(D, P, cfg, asOf);
    ctx.onboarding = E.onboarding(D, P, cfg, ctx.docs);
    ctx.perf = E.performance(D, P, cfg, ctx);
    ctx.alerts = E.anomalies(D, P, cfg, asOf, ctx);
    ctx.alertsBySup = ctx.alerts.bySup;
    ctx.risk = E.supplierRisk(D, P, cfg, asOf, ctx);
    ctx.priority = E.priority(D, P, cfg, asOf, ctx);
    ctx.items = E.forecastItems(D, P, cfg, asOf);
    ctx.cash = E.cashForecast(D, P, cfg, asOf, ctx.items);
    ctx.payForecast = E.paymentForecast(ctx.items, asOf);
    ctx.bank = E.bankRecon(D, P, cfg, asOf);
    ctx.recon = E.registerRecon(D, P, cfg, asOf, ctx);
    ctx.sod = E.sod(D, P, cfg, st.roles);
    ctx.authority = E.authorityCheck(D, P, cfg);
    ctx.controls = E.controlTests(D, P, cfg, asOf, ctx);
    ctx.dq = E.dataQuality(D, P, cfg, asOf, ctx);
    ctx.savings = E.savings(D, P, cfg, asOf, ctx);
    ctx.wc = E.workingCapital(D, P, cfg, asOf, ctx);
    ctx.insights = E.insights(D, P, cfg, asOf, ctx);
    ctx.actions = E.actions(D, P, cfg, asOf, ctx);
    ctx.autoAlerts = E.autoAlerts(D, P, cfg, asOf, ctx);
    // red flags = anomaly alerts + data-quality + control failures + liquidity, unified
    ctx.redFlags = ctx.alerts.list.slice();
    ctx.dq.issues.filter((i) => SEV[i.severity] >= 3).forEach((i) => ctx.redFlags.push({ id: i.id, category: 'DATA QUALITY', rule: 'dq_' + i.check.split(':')[0], params: { n: i.count, field: i.check.split(':')[1] || '' }, severity: i.severity, rows: i.rows.slice(0, 100), txn: i.count + ' record(s)', action: 'fixData', amountBase: null }));
    for (const c of Object.values(ctx.cash.currencies).filter((x) => x.belowMinDays)) ctx.redFlags.push({ id: 'LQ-' + c.currency, category: 'LIQUIDITY', rule: 'liquidityGap', params: { ccy: c.currency, days: c.belowMinDays, date: c.min && c.min.date }, severity: c.shortfallDays ? 'CRITICAL' : 'HIGH', rows: c.accounts, txn: c.currency, action: 'arrangeFunding', amountBase: c.fundingReq != null && c.rate ? c.fundingReq * c.rate : null });
    ctx.controls.tests.filter((t) => t.status === 'FAIL').forEach((t) => ctx.redFlags.push({ id: 'CF-' + t.id, category: 'CONTROL', rule: 'controlFail', params: { id: t.id, n: t.count }, severity: 'HIGH', rows: t.exceptions.slice(0, 100), txn: t.id, action: 'remediateControl', amountBase: null }));
    ctx.redFlags.sort((a, b) => SEV[b.severity] - SEV[a.severity] || (b.amountBase || 0) - (a.amountBase || 0));
    // record index for drill-down
    ctx.index = new Map();
    Object.values(D).forEach((arr) => arr.forEach((r) => ctx.index.set(r._key, r)));
    ctx.kpis = E.kpis(D, P, cfg, asOf, ctx);
    ctx.ms = Date.now() - t0;
    S.R = ctx;
    return ctx;
  };

  /* ---------------- KPI library ---------------- */
  E.kpis = (D, P, cfg, asOf, ctx) => {
    const K = {};
    const L = (id, o) => (K[id] = Object.assign({ id }, E.lineage(o)));
    Object.entries(ctx.aging.lineage).forEach(([k, v]) => (K[k] = Object.assign({ id: k }, v)));
    Object.entries(ctx.spend.lineage).forEach(([k, v]) => (K[k] = Object.assign({ id: k }, v)));
    K.dpo = Object.assign({ id: 'dpo' }, ctx.dpo.lineage);
    const act = D.suppliers.filter((s) => /approved|active/i.test(s.approvedStatus || ''));
    L('supplierCount', { label: 'Suppliers in master', value: D.suppliers.length, unit: 'count', formula: 'COUNT(supplier master rows)', rows: D.suppliers, route: 'suppliers', kind: D.suppliers.length ? 'DERIVED' : 'DERIVED' });
    L('activeSuppliers', { label: 'Active / approved suppliers', value: act.length, unit: 'count', formula: 'COUNT WHERE status ∈ {Approved, Active}', rows: act, route: 'suppliers' });
    const crit = D.suppliers.filter((s) => s.critical);
    L('criticalSuppliers', { label: 'Critical suppliers', value: crit.length, unit: 'count', formula: 'COUNT WHERE Critical flag = Yes (SOURCE VALUE)', rows: crit, route: 'suppliers' });
    const hr = D.suppliers.filter((s) => { const r = ctx.risk.get(s.supplierId); return r && ['HIGH', 'CRITICAL'].includes(r.rating); });
    L('highRiskSuppliers', { label: 'High / critical-risk suppliers', value: hr.length, unit: 'count', formula: 'COUNT WHERE risk rating ∈ {HIGH, CRITICAL} (explainable risk model)', rows: hr, route: 'risk' });
    const due7 = ctx.priority.filter((x) => x.inv._dpd != null && x.inv._dpd >= -7);
    L('paymentsDue', { label: 'Payments due ≤ 7 days (incl. overdue)', value: U.round(U.sum(due7, (x) => x.amountBase || 0), 2), unit: cfg.baseCurrency, formula: 'SUM(outstanding base) WHERE due date ≤ as-of + 7', rows: due7.map((x) => x.inv), route: 'payments' });
    const today = ctx.priority.filter((x) => x.inv._dpd != null && x.inv._dpd >= 0);
    L('payToday', { label: 'Due today or overdue', value: U.round(U.sum(today, (x) => x.amountBase || 0), 2), unit: cfg.baseCurrency, formula: 'SUM(outstanding base) WHERE due date ≤ as-of', rows: today.map((x) => x.inv), route: 'payments' });
    const sched = D.payments.filter((p) => ['Scheduled', 'Approved', 'Submitted to Bank'].includes(p.executionStatus));
    L('paymentsScheduled', { label: 'Payments scheduled (not executed)', value: U.round(U.sum(sched, (p) => p._netBase || 0), 2), unit: cfg.baseCurrency, formula: 'SUM(net × FX) WHERE status ∈ {Approved, Scheduled, Submitted to Bank}', rows: sched, route: 'payments' });
    const from30 = U.addDays(asOf, -30);
    const exec30 = D.payments.filter((p) => p._isPaid && p.paymentDate >= from30);
    L('paymentsExecuted', { label: 'Payments executed (30 days)', value: U.round(U.sum(exec30, (p) => p._netBase || 0), 2), unit: cfg.baseCurrency, formula: 'SUM(net × FX) WHERE executed/reconciled AND payment date ≥ as-of − 30', rows: exec30, route: 'payments' });
    const totPaid = D.payments.filter((p) => p._isPaid);
    L('paymentRegisterTotal', { label: 'Payment register total (executed/reconciled)', value: U.round(U.sum(totPaid, (p) => p._netBase || 0), 2), unit: cfg.baseCurrency, formula: 'SUM(net × FX at payment date)', rows: totPaid, route: 'payments' });
    const w13 = ctx.payForecast.horizons.find((h) => h.id === 'w13');
    L('cashRequired', { label: 'Cash required — 13 weeks', value: w13 ? U.round(w13.byType.scheduled + w13.byType.approvedInvoice, 2) : null, unit: cfg.baseCurrency, formula: 'Σ scheduled payments + approved unpaid invoices due within 91 days (at latest FX)', rows: w13 ? w13.rows.filter((r) => r.type === 'scheduled' || r.type === 'approvedInvoice').map((r) => r.rec) : [], route: 'treasury', assumptions: ['Overdue approved invoices assumed paid on as-of date'] });
    const exc = D.invoices.filter((i) => { const m = ctx.match.get(i._key); return m && !['MATCHED', 'PARTIALLY MATCHED'].includes(m.status) && !i._closed; });
    L('invoiceExceptions', { label: 'Invoice exceptions (3-way match)', value: exc.length, unit: 'count', formula: 'COUNT WHERE match status ∉ {MATCHED, PARTIALLY MATCHED}', rows: exc, route: 'matching' });
    const dupRows = ctx.dupInv.list.map((d) => D.invoices.find((i) => i._key === d.b));
    L('duplicateRisk', { label: 'Duplicate invoice risk (exposure)', value: U.round(U.sum(ctx.dupInv.list, (d) => (d.amountBase || 0)), 2), unit: cfg.baseCurrency, formula: 'Σ amount of the later invoice in each flagged pair', inputs: [{ label: 'Pairs flagged', value: ctx.dupInv.list.length }], rows: dupRows, route: 'duplicates' });
    const fr = ctx.alerts.list.filter((a) => ['HIGH', 'CRITICAL'].includes(a.severity));
    L('fraudAlerts', { label: 'High / critical fraud & anomaly alerts', value: fr.length, unit: 'count', formula: 'COUNT(alerts) WHERE severity ∈ {HIGH, CRITICAL}', rows: fr.flatMap((a) => a.rows), route: 'fraud' });
    const conExp = ctx.contracts.list.filter((c) => c.status !== 'Expired');
    L('contractExposure', { label: 'Remaining contract value (active)', value: U.round(U.sum(conExp, (c) => { const r = P.fx.rate(c.c.currency, asOf); return r && c.remainingValue != null ? Math.max(0, c.remainingValue) * r.rate : 0; }), 2), unit: cfg.baseCurrency, formula: 'Σ (contract value − invoiced against contract) × latest FX', rows: conExp.map((c) => c.c), route: 'contracts' });
    // processing & cycle time
    const proc = D.invoices.filter((i) => i.approvedDate && (i.receivedDate || i.invoiceDate));
    L('avgProcessing', { label: 'Average invoice processing time', value: proc.length ? U.round(U.sum(proc, (i) => U.daysBetween(i.receivedDate || i.invoiceDate, i.approvedDate)) / proc.length, 1) : null, unit: 'days', formula: 'AVG(approved date − received date)', rows: proc, route: 'invoices' });
    const cyc = ctx.aging.paidPairs;
    L('paymentCycle', { label: 'Average payment cycle (invoice → payment)', value: cyc.length ? U.round(U.sum(cyc, (x) => x.days) / cyc.length, 1) : null, unit: 'days', formula: 'AVG(payment date − invoice date)', rows: cyc.map((x) => x.p), route: 'payments' });
    const invs = D.invoices.filter((i) => !i._closed && i.total > 0);
    const poInv = invs.filter((i) => i.poNo);
    L('poCompliance', { label: 'PO compliance', value: invs.length ? U.round((poInv.length / invs.length) * 100, 1) : null, unit: '%', formula: 'invoices with PO ÷ all invoices', inputs: [{ label: 'With PO', value: poInv.length }, { label: 'All', value: invs.length }], rows: invs, route: 'invoices' });
    const m3 = poInv.filter((i) => (ctx.match.get(i._key) || {}).status === 'MATCHED');
    L('threeWayRate', { label: 'Three-way match rate', value: poInv.length ? U.round((m3.length / poInv.length) * 100, 1) : null, unit: '%', formula: 'MATCHED ÷ PO-backed invoices', inputs: [{ label: 'Matched', value: m3.length }, { label: 'PO invoices', value: poInv.length }], rows: m3, route: 'matching' });
    const mAny = invs.filter((i) => ['MATCHED', 'PARTIALLY MATCHED'].includes((ctx.match.get(i._key) || {}).status));
    L('invoiceMatchRate', { label: 'Invoice match rate (incl. header-only)', value: invs.length ? U.round((mAny.length / invs.length) * 100, 1) : null, unit: '%', formula: '(MATCHED + PARTIALLY MATCHED) ÷ invoices', rows: mAny, route: 'matching' });
    L('exceptionRate', { label: 'Exception rate', value: invs.length ? U.round((exc.length / invs.length) * 100, 1) : null, unit: '%', formula: 'exceptions ÷ invoices', rows: exc, route: 'matching' });
    L('duplicateRate', { label: 'Duplicate rate', value: invs.length ? U.round((U.uniq(ctx.dupInv.list.map((d) => d.b)).length / invs.length) * 100, 2) : null, unit: '%', formula: 'invoices flagged as later member of a duplicate pair ÷ invoices', rows: dupRows, route: 'duplicates' });
    const late = ctx.aging.paidPairs.filter((x) => x.late != null && x.late > 0);
