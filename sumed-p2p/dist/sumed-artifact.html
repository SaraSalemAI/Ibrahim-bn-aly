      const kind = r._derived && r._derived[k] ? 'DERIVED' : r._edits && r._edits[k] ? 'EDITED' : 'SOURCE VALUE';
      const note = r._derived && r._derived[k] ? r._derived[k] : r._edits && r._edits[k] ? t('rec.edited', 'Edited in app by {by} on {at} (was: {old})', { by: r._edits[k].by, at: r._edits[k].at.slice(0, 10), old: r._edits[k].old == null ? '∅' : r._edits[k].old }) : '';
      return `<tr><th>${esc(UI.fieldLabel(k))}</th><td>${UI.fieldValue(r, k)}${note ? `<div class="muted small">${esc(note)}</div>` : ''}</td><td class="k">${kind === 'EDITED' ? `<span class="kind kind-derived">${esc(t('kind.EDITED', 'Edited'))}</span>` : UI.kind(kind)}</td></tr>`;
    }).join('')}</table>`;
  };

  /** Build the P2P chain for any record: Supplier → PR → PO → GRN → Invoice → Approval → Payment → Bank → Reconciliation */
  UI.chain = (r) => {
    const R = S.R, D = S.state.data, P = R.P;
    let inv = null, po = null, sup = null, pays = [], grns = [], pr = null;
    const e = r._entity;
    if (e === 'invoices') inv = r;
    if (e === 'payments') { inv = P.inv.get(r.invoiceNo) || null; pays = [r]; }
    if (e === 'pos') po = r;
    if (e === 'grns') po = P.po.get(r.poNo) || null;
    if (e === 'bankTxns') { const b = R.bank.items.find((x) => x.t === r); if (b && b.p) { pays = [b.p]; inv = P.inv.get(b.p.invoiceNo) || null; } }
    if (e === 'invoiceLines') inv = P.inv.get(r.invoiceNo) || null;
    if (inv) { po = po || (inv.poNo ? P.po.get(inv.poNo) : null); if (!pays.length) pays = D.payments.filter((p) => p.invoiceNo === inv.invoiceNo); }
    if (po) { grns = P.grnsByPo.get(po.poNo) || []; pr = po.prNo ? D.prs.find((x) => x.prNo === po.prNo) : null; }
    sup = P.sup.get((inv || po || pays[0] || r).supplierId) || (e === 'suppliers' ? r : null);
    if (e === 'suppliers') return '';
    const m = inv ? R.match.get(inv._key) : null;
    const rfq = po && po.rfqNo ? D.rfqs.filter((x) => x.rfqNo === po.rfqNo) : [];
    const con = (inv && inv.contractId && P.contract.get(inv.contractId)) || (po && po.contractId && P.contract.get(po.contractId)) || null;
    const step = (label, rec, status, extra) => `<li class="${rec ? 'ok' : 'gap'}"><span class="st-l">${esc(label)}</span>${rec ? `<a data-drill="${esc(rec._key)}">${esc(UI.recLabel(rec).split(': ').pop())}</a>` : UI.na(t('chain.none', 'None'))}${status ? ' ' + status : ''}${extra ? `<div class="muted small">${extra}</div>` : ''}</li>`;
    const bankItems = pays.map((p) => R.bank.items.find((x) => x.p === p)).filter(Boolean);
    const html = [
      step(t('chain.supplier', 'Supplier'), sup, sup ? UI.badge(sup.approvedStatus) : ''),
      step(t('chain.pr', 'Purchase requisition'), pr, pr ? UI.badge(pr.status) : ''),
      step(t('chain.rfq', 'RFQ / quotations'), rfq[0] || null, rfq.length ? esc(t('chain.quotes', '{n} quote(s)', { n: rfq.length })) : ''),
      step(t('chain.contract', 'Contract'), con, con ? UI.badge(con.status) : ''),
      step(t('chain.po', 'Purchase order'), po, po ? UI.badge(po.status) : ''),
      grns.length ? grns.map((g) => step(t('chain.grn', 'Goods / service receipt'), g, UI.date(g.receiptDate))).join('') : step(t('chain.grn', 'Goods / service receipt'), null),
      step(t('chain.invoice', 'Invoice'), inv, m ? UI.badge(m.status, 'm.') : ''),
      `<li class="${inv && /approved/i.test(inv.approvalStatus || '') ? 'ok' : 'gap'}"><span class="st-l">${esc(t('chain.approval', 'Approval'))}</span>${inv ? UI.badge(inv.approvalStatus || '—') + (inv.approvedBy ? ` ${esc(t('chain.by', 'by'))} <b>${esc(inv.approvedBy)}</b>` : '') : UI.na()}</li>`,
      pays.length ? pays.map((p) => step(t('chain.payment', 'Payment'), p, UI.badge(p.executionStatus), p.batchId ? esc(t('chain.batch', 'Batch')) + ' ' + esc(p.batchId) : '')).join('') : step(t('chain.payment', 'Payment'), null),
      bankItems.length ? bankItems.map((b) => step(t('chain.bank', 'Bank transaction'), b.t, b.t ? UI.date(b.t.date) : '')).join('') : step(t('chain.bank', 'Bank transaction'), null),
      bankItems.length ? bankItems.map((b) => `<li class="${b.status === 'MATCHED' ? 'ok' : 'gap'}"><span class="st-l">${esc(t('chain.recon', 'Reconciliation'))}</span>${UI.badge(b.status, 'rc.')} <span class="muted">${esc(t('br.' + b.type))}</span></li>`).join('') : `<li class="gap"><span class="st-l">${esc(t('chain.recon', 'Reconciliation'))}</span>${UI.na(t('chain.notRec', 'Not reconciled'))}</li>`,
    ].join('');
    return `<section class="chain"><h4>${esc(t('chain.title', 'Supplier → Invoice → PO → GRN → Approval → Payment → Bank → Reconciliation'))}</h4><ol>${html}</ol></section>`;
  };

  UI.openRecord = (key) => {
    const r = S.R.index.get(key);
    if (!r) return;
    if (r._entity === 'suppliers') { location.hash = '#/supplier/' + encodeURIComponent(r.supplierId); return; }
    const e = r._entity;
    const m = e === 'invoices' ? S.R.match.get(r._key) : null;
    const alerts = S.R.alerts.list.filter((a) => a.rows.includes(r));
    let extra = '';
    if (e === 'invoices') {
      extra += `<section><h4>${esc(t('inv.position', 'AP position'))}</h4><table class="kv">
        <tr><th>${esc(t('f.total', 'Total'))}</th><td>${UI.money(r.total, r.currency)}</td><td>${UI.kind(r._derived && r._derived.total ? 'DERIVED' : 'SOURCE VALUE')}</td></tr>
        <tr><th>${esc(t('f.paidAmount', 'Paid amount'))}</th><td>${UI.money(r._paid, r.currency)}</td><td>${UI.kind(r._paidKind)}</td></tr>
        <tr><th>${esc(t('f.outstanding', 'Outstanding'))}</th><td>${UI.money(r._out, r.currency)}${r._debitBalance ? ' ' + UI.badge(t('inv.debit', 'Supplier debit balance')) : ''}</td><td>${UI.kind(r._outKind)}</td></tr>
        <tr><th>${esc(t('fx.rate', 'FX rate'))}</th><td>${r._fxNow ? esc(S.fmt.num(r._fxNow.rate, 4)) + ` <span class="muted">(${esc(r._fxNow.date || '')} · ${esc(r._fxNow.source)})</span>` : `<span class="na">${esc(t('fx.na', 'FX RATE NOT AVAILABLE'))}</span>`}</td><td>${UI.kind('SOURCE VALUE')}</td></tr>
        <tr><th>${esc(t('inv.outBase', 'Outstanding ({ccy})', { ccy: S.state.config.baseCurrency }))}</th><td>${UI.base(r._outBase)}</td><td>${UI.kind('DERIVED')}</td></tr>
        <tr><th>${esc(t('inv.dpd', 'Days past due'))}</th><td>${r._dpd == null ? UI.na() : UI.num(r._dpd)}</td><td>${UI.kind('DERIVED')}</td></tr></table></section>`;
      if (m) extra += UI.matchPanel(r, m);
      extra += `<div class="btn-row">${S.views && S.views.invoiceActions ? S.views.invoiceActions(r) : ''}</div>`;
    }
    const html = `<header class="dr-h"><div><span class="muted">${esc(S.isAr() ? (S.schema[e] || {}).labelAr : (S.schema[e] || {}).label)}</span><h2>${esc(UI.recLabel(r).split(': ').pop())}</h2>${UI.srcLoc(r)}</div><button class="btn ghost" data-close="drawer" aria-label="${esc(t('common.close', 'Close'))}">✕</button></header>
      ${UI.chain(r)}
      ${extra}
      ${alerts.length ? `<section><h4>${esc(t('rec.alerts', 'Red flags on this record'))}</h4>${alerts.map((a) => `<div class="flag">${UI.sev(a.severity)} ${esc(t('rule.' + a.rule, a.rule, a.params))} ${UI.evBtn('alert', a.id)}</div>`).join('')}</section>` : ''}
      <section><h4>${esc(t('rec.fields', 'Record fields'))}</h4>${UI.recordFields(r)}</section>
      ${r._issues && r._issues.length ? `<section><h4>${esc(t('rec.issues', 'Parsing issues'))}</h4>${r._issues.map((i) => `<p>⚠ ${esc(UI.fieldLabel(i.field))}: ${esc(i.issue)} — "${esc(i.raw)}"</p>`).join('')}</section>` : ''}`;
    UI.drawer(html);
  };

  UI.matchPanel = (inv, m) => {
    const ccy = inv.currency;
    return `<section><h4>${esc(t('m.title', 'Three-way match'))} ${UI.badge(m.status, 'm.')}</h4>
      <table class="kv"><tr><th>${esc(t('m.po', 'PO amount'))}</th><td>${UI.money(m.poAmount, ccy)}</td></tr>
      <tr><th>${esc(t('m.grn', 'GRN amount (accepted × PO price)'))}</th><td>${UI.money(m.grnAmount, ccy)}</td></tr>
      ${m.expectedValue != null ? `<tr><th>${esc(t('m.expected', 'Receipt value attributable to this invoice'))}</th><td>${UI.money(m.expectedValue, ccy)}</td></tr>` : ''}
      <tr><th>${esc(t('m.inv', 'Invoice amount (net)'))}</th><td>${UI.money(m.invAmount, ccy)}</td></tr>
      <tr><th>${esc(t('m.variance', 'Variance'))}</th><td>${UI.money(m.variance, ccy)} ${m.variancePct != null ? '(' + esc(S.fmt.pct(m.variancePct, 2)) + ')' : ''}</td></tr>
      <tr><th>${esc(t('m.basis', 'Basis'))}</th><td>${esc(m.basis ? t('m.basis.' + m.basis, m.basis === 'line' ? 'Line level' : 'Header level') : '—')}</td></tr></table>
      ${m.lines.length ? `<div class="tbl-wrap"><table><thead><tr><th>${esc(t('f.itemCode', 'Item'))}</th><th class="n">${esc(t('m.poQty', 'PO qty'))}</th><th class="n">${esc(t('m.recQty', 'Received'))}</th><th class="n">${esc(t('m.availQty', 'Available'))}</th><th class="n">${esc(t('m.invQty', 'Invoiced'))}</th><th class="n">${esc(t('m.poPrice', 'PO price'))}</th><th class="n">${esc(t('m.invPrice', 'Inv. price'))}</th><th class="n">Δ%</th><th>${esc(t('common.status', 'Status'))}</th></tr></thead><tbody>${m.lines.map((l) => `<tr><td>${esc(l.itemCode)}</td><td class="n">${UI.num(l.poQty)}</td><td class="n">${UI.num(l.recQty)}</td><td class="n">${UI.num(l.availQty)}</td><td class="n">${UI.num(l.invQty)}</td><td class="n">${UI.num(l.poPrice, 2)}</td><td class="n">${UI.num(l.invPrice, 2)}</td><td class="n">${UI.pct(l.priceVarPct, 2)}</td><td>${UI.badge(l.status, 'm.')}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <ul class="reasons">${m.reasons.map((x) => `<li>${esc(UI.reason('mr.', x))}</li>`).join('')}</ul></section>`;
  };

  /* ---------------- Misc ---------------- */
  UI.section = (title, body, opts = {}) => `<section class="card ${opts.cls || ''}">${title ? `<header class="card-h"><h3>${esc(title)}</h3>${opts.right || ''}</header>` : ''}<div class="card-b">${body}</div></section>`;
  UI.tabs = (id, tabs, active) => `<nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === active}" class="${k === active ? 'on' : ''}" data-tab="${esc(id)}:${esc(k)}">${esc(l)}</button>`).join('')}</nav>`;
  UI.empty = (msg) => `<div class="empty-state"><p>${esc(msg || t('common.noData', 'No data loaded. Upload source files or start Demo Mode.'))}</p><div class="btn-row"><button class="btn primary" data-nav="upload">⤒ ${esc(t('nav.upload', 'Upload & Validate'))}</button><button class="btn" data-act="demo">${esc(t('demo.start', 'Start Demo Mode'))}</button></div></div>`;
  UI.supName = (sid) => { const s = S.R && S.R.P.sup.get(sid); return s ? (S.isAr() ? s.nameAr || s.name : s.name) : sid ? sid + ' (' + t('common.notInMaster', 'not in master') + ')' : null; };
  UI.supLink = (sid) => { const s = S.R && S.R.P.sup.get(sid); return s ? `<a data-drill="${esc(s._key)}">${esc(UI.supName(sid))}</a>` : UI.v(UI.supName(sid)); };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/ui/charts.js */
/* SUMED P2P — dependency-free SVG charts. Colours come from CSS custom properties (--s1..--s8, status)
 * so light/dark are selected per theme. Every mark carries data-tip (hover) and optional data-drill/data-nav. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});
  const U = S.util;
  const esc = U.esc;
  const C = (S.chart = {});

  const nice = (max) => {
    if (!(max > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(max)));
    const m = max / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  };
  const short = (v) => {
    const a = Math.abs(v);
    // Axis/label abbreviations stay language-neutral (K / M / bn) so they fit the axis in both languages; tooltips show full values.
    return a >= 1e9 ? S.fmt.num(v / 1e9, 1) + 'bn' : a >= 1e6 ? S.fmt.num(v / 1e6, a >= 1e8 ? 0 : 1) + 'M' : a >= 1e3 ? S.fmt.num(v / 1e3, 0) + 'K' : S.fmt.num(v, 0);
  };
  C.short = short;
  const series = (i) => `var(--s${(i % 8) + 1})`;
  const attrs = (o) => Object.entries(o).filter(([, v]) => v != null && v !== '').map(([k, v]) => `${k}="${esc(v)}"`).join(' ');

  /** Vertical or horizontal bars. data: [{label, value, tip, drill, nav, tone}] */
  C.bars = (data, o = {}) => {
    if (!data.length) return `<p class="muted">${esc(S.t('chart.noData', 'No data for this chart'))}</p>`;
    const W = 640, H = o.height || 240;
    if (o.horizontal) {
      const rowH = 26, pad = { l: o.labelW || 190, r: 70, t: 6, b: 6 };
      const h = pad.t + pad.b + data.length * rowH;
      const max = nice(Math.max(...data.map((d) => Math.abs(d.value || 0))));
      const iw = W - pad.l - pad.r;
      const bars = data.map((d, i) => {
        const w = Math.max(1, (Math.abs(d.value || 0) / max) * iw);
        const y = pad.t + i * rowH;
        const fill = d.tone ? `var(--st-${d.tone})` : series(o.slot || 0);
        const lab = String(d.label);
        return `<g class="mk" ${attrs({ 'data-tip': d.tip || `${lab}: ${S.fmt.num(d.value)}`, 'data-drill': d.drill, 'data-nav': d.nav })}>
          <rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"/>
          <text x="${pad.l - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" class="ax">${esc(lab.length > 28 ? lab.slice(0, 27) + '…' : lab)}</text>
          <rect x="${pad.l}" y="${y + 5}" width="${w}" height="${rowH - 10}" rx="3" fill="${fill}"/>
          <text x="${pad.l + w + 6}" y="${y + rowH / 2 + 4}" class="val">${esc(o.fmt ? o.fmt(d.value) : short(d.value))}</text></g>`;
      }).join('');
      return `<svg class="chart" dir="ltr" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(o.title || '')}">${bars}</svg>`;
    }
    const pad = { l: 56, r: 10, t: 14, b: 44 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const vals = data.map((d) => d.value || 0);
    const max = nice(Math.max(0, ...vals)), min = Math.min(0, ...vals) < 0 ? -nice(-Math.min(...vals)) : 0;
    const y = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;
    const bw = iw / data.length;
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => { const v = min + (max - min) * f; return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${esc(short(v))}</text>`; }).join('');
    const every = Math.ceil(data.length / 12);
    const bars = data.map((d, i) => {
      const x = pad.l + i * bw;
      const v = d.value || 0;
      const top = Math.min(y(v), y(0)), hh = Math.max(1, Math.abs(y(v) - y(0)));
      const fill = d.tone ? `var(--st-${d.tone})` : series(o.slot || 0);
      return `<g class="mk" ${attrs({ 'data-tip': d.tip || `${d.label}: ${S.fmt.num(v)}`, 'data-drill': d.drill, 'data-nav': d.nav })}>
        <rect x="${x}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent"/>
        <rect x="${x + bw * 0.18}" y="${top}" width="${Math.max(2, bw * 0.64)}" height="${hh}" rx="3" fill="${fill}"/>
        ${i % every === 0 ? `<text x="${x + bw / 2}" y="${H - pad.b + 16}" text-anchor="middle" class="ax">${esc(String(d.label).slice(0, data.length <= 8 ? 16 : 10))}</text>` : ''}</g>`;
    }).join('');
    return `<svg class="chart" dir="ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">${grid}<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}" class="base"/>${bars}</svg>`;
  };

  /** Stacked vertical bars. cats: [label], ser: [{name, values:[], slot, tone}] */
  C.stacked = (cats, ser, o = {}) => {
    if (!cats.length) return `<p class="muted">${esc(S.t('chart.noData', 'No data for this chart'))}</p>`;
    const W = 640, H = o.height || 250, pad = { l: 56, r: 10, t: 14, b: 44 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const tot = cats.map((_, i) => U.sum(ser, (s) => Math.max(0, s.values[i] || 0)));
    const max = nice(Math.max(...tot, 0));
    const y = (v) => pad.t + ih - (v / max) * ih;
    const bw = iw / cats.length;
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(max * f)}" y2="${y(max * f)}" class="gl"/><text x="${pad.l - 6}" y="${y(max * f) + 4}" text-anchor="end" class="ax">${esc(short(max * f))}</text>`).join('');
    const every = Math.ceil(cats.length / 13);
    const bars = cats.map((c, i) => {
      let acc = 0;
      const x = pad.l + i * bw;
      const segs = ser.map((s, si) => {
        const v = Math.max(0, s.values[i] || 0);
        if (!v) return '';
        const y0 = y(acc), y1 = y(acc + v);
        acc += v;
        const fill = s.tone ? `var(--st-${s.tone})` : series(s.slot != null ? s.slot : si);
        return `<rect x="${x + bw * 0.16}" y="${y1}" width="${Math.max(2, bw * 0.68)}" height="${Math.max(0.5, y0 - y1 - 1)}" fill="${fill}"/>`;
      }).join('');
      const tip = `${c}\n` + ser.map((s) => `${s.name}: ${S.fmt.num(s.values[i] || 0)}`).join('\n') + `\nΣ ${S.fmt.num(tot[i])}`;
      return `<g class="mk" ${attrs({ 'data-tip': tip, 'data-nav': o.nav && o.nav(i), 'data-drill': o.drill && o.drill(i) })}><rect x="${x}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent"/>${segs}${i % every === 0 ? `<text x="${x + bw / 2}" y="${H - pad.b + 16}" text-anchor="middle" class="ax">${esc(String(c).slice(0, 10))}</text>` : ''}</g>`;
    }).join('');
    return `<svg class="chart" dir="ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">${grid}${bars}</svg>${C.legend(ser)}`;
  };

  /** Line chart. xs: labels; ser: [{name, values, slot, dashed}]; o.threshold: {value, label} */
  C.line = (xs, ser, o = {}) => {
    if (!xs.length) return `<p class="muted">${esc(S.t('chart.noData', 'No data for this chart'))}</p>`;
    const W = 640, H = o.height || 240, pad = { l: 60, r: 12, t: 14, b: 40 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const all = ser.flatMap((s) => s.values.filter((v) => v != null)).concat(o.threshold ? [o.threshold.value] : []);
    let max = Math.max(...all), min = Math.min(...all);
    if (o.zero !== false) min = Math.min(0, min);
    const span = nice((max - min) || 1);
    max = min + span;
    const x = (i) => pad.l + (xs.length === 1 ? iw / 2 : (i / (xs.length - 1)) * iw);
    const y = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => { const v = min + (max - min) * f; return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${esc(short(v))}</text>`; }).join('');
    const every = Math.ceil(xs.length / 8);
    const xl = xs.map((l, i) => (i % every === 0 ? `<text x="${x(i)}" y="${H - pad.b + 16}" text-anchor="middle" class="ax">${esc(String(l).slice(0, 10))}</text>` : '')).join('');
    const paths = ser.map((s, si) => {
      let d = '';
      s.values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); });
      const col = s.tone ? `var(--st-${s.tone})` : series(s.slot != null ? s.slot : si);
      const area = o.area && si === 0 ? `<path d="${d}L${x(s.values.length - 1)},${y(Math.max(min, 0))}L${x(0)},${y(Math.max(min, 0))}Z" fill="${col}" opacity=".12"/>` : '';
      return `${area}<path d="${d}" fill="none" stroke="${col}" stroke-width="2" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
    }).join('');
    const th = o.threshold ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(o.threshold.value)}" y2="${y(o.threshold.value)}" class="thr"/><text x="${W - pad.r}" y="${y(o.threshold.value) - 5}" text-anchor="end" class="thr-l">${esc(o.threshold.label)}</text>` : '';
    const hits = xs.map((l, i) => `<rect class="mk hit" x="${x(i) - iw / xs.length / 2}" y="${pad.t}" width="${Math.max(2, iw / xs.length)}" height="${ih}" fill="transparent" ${attrs({ 'data-tip': `${l}\n` + ser.map((s) => `${s.name}: ${s.values[i] == null ? '—' : S.fmt.num(s.values[i])}`).join('\n'), 'data-nav': o.nav && o.nav(i) })}/>`).join('');
    const zero = min < 0 ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}" class="base"/>` : '';
    return `<svg class="chart" dir="ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">${grid}${zero}${th}${paths}${xl}${hits}</svg>${ser.length > 1 ? C.legend(ser) : ''}`;
  };

  /** Donut — folds beyond 6 slices into "Other". data: [{label, value, nav, drill}] */
  C.donut = (data, o = {}) => {
    data = data.filter((d) => d.value > 0);
    if (!data.length) return `<p class="muted">${esc(S.t('chart.noData', 'No data for this chart'))}</p>`;
    if (data.length > 7) { const rest = data.slice(6); data = data.slice(0, 6).concat([{ label: S.t('common.other', 'Other'), value: U.sum(rest, (d) => d.value) }]); }
    const tot = U.sum(data, (d) => d.value);
    const R = 80, r = 52, cx = 100, cy = 100;
    let a0 = -Math.PI / 2;
    const segs = data.map((d, i) => {
      const a1 = a0 + (d.value / tot) * Math.PI * 2 - 0.012;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const p = (a, rr) => `${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`;
      const path = `M${p(a0, R)}A${R},${R} 0 ${large} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${large} 0 ${p(a0, r)}Z`;
      a0 = a1 + 0.012;
      const fill = d.tone ? `var(--st-${d.tone})` : series(i);
      return `<path class="mk" d="${path}" fill="${fill}" ${attrs({ 'data-tip': `${d.label}: ${S.fmt.num(d.value)} (${S.fmt.pct((d.value / tot) * 100)})`, 'data-nav': d.nav, 'data-drill': d.drill })}/>`;
    }).join('');
    const legend = `<ul class="legend v">${data.map((d, i) => `<li><i style="background:${d.tone ? `var(--st-${d.tone})` : series(i)}"></i>${esc(d.label)} <b>${esc(S.fmt.pct((d.value / tot) * 100))}</b></li>`).join('')}</ul>`;
    return `<div class="donut"><svg class="chart" dir="ltr" viewBox="0 0 200 200" role="img" aria-label="${esc(o.title || '')}">${segs}<text x="100" y="98" text-anchor="middle" class="d-tot">${esc(o.center || short(tot))}</text><text x="100" y="116" text-anchor="middle" class="ax">${esc(o.centerLabel || '')}</text></svg>${legend}</div>`;
  };

  C.legend = (ser) => `<ul class="legend">${ser.map((s, i) => `<li><i style="background:${s.tone ? `var(--st-${s.tone})` : series(s.slot != null ? s.slot : i)}"></i>${esc(s.name)}</li>`).join('')}</ul>`;

  /** Meter for 0-100 scores */
  C.meter = (v, o = {}) => {
    if (v == null) return `<span class="na">${esc(S.t('common.dataUnavailable', 'Data unavailable'))}</span>`;
    const tn = o.tone || (v >= 75 ? 'critical' : v >= 55 ? 'serious' : v >= 30 ? 'warning' : 'good');
    return `<span class="meter" title="${esc(v)}"><span style="width:${U.clamp(v, 0, 100)}%;background:var(--st-${tn})"></span></span>`;
  };

/* js/views/exec.js */
/* SUMED P2P — executive views: CFO dashboard, CFO action center, management summary, AI insights. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});

  /** Human text for an alert (numbers formatted, booleans translated) */

    if (a.rule === 'dq_missingField') p.field = UI.fieldLabel(a.params.field || '');

  };
  S.insightText = (i, part) => {
    const p = {};

    const key = 'ins.' + i.key + '.' + part;

  };
  const ccy = () => S.state.config.baseCurrency;
  const sevTone = { CRITICAL: 'critical', HIGH: 'serious', MEDIUM: 'warning', LOW: 'good' };

  /* ------------------------------ DASHBOARD ------------------------------ */

      const k = R.kpis;
      const months = R.spend.byMonth;
      const top10 = R.spend.bySupplier.slice(0, 10);
      const cat = R.spend.byCategory;
      const dept = R.spend.byDepartment.slice(0, 8);
      const ag = R.aging.buckets;
      const payStatus = Array.from(U.groupBy(D.payments, (p) => p.executionStatus || '—').entries()).map(([s, ps]) => ({ label: s, value: U.sum(ps, (p) => p._netBase || 0), nav: 'payments', tone: UI.tone(s) === 'neutral' ? null : UI.tone(s) }));
      const exByMonth = Array.from(U.groupBy(D.invoices.filter((i) => i.invoiceDate), (i) => i.invoiceDate.slice(0, 7)).entries()).sort((a, b) => (a[0] < b[0] ? -1 : 1)).slice(-12);
      const riskCounts = ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].map((r) => ({ label: t('sev.' + r), value: Array.from(R.risk.values()).filter((x) => x.rating === r).length, tone: sevTone[r], nav: 'risk' }));
      const cons = R.cash.consolidated;
      const wk = R.cash.weekly;
      const pf = R.payForecast.months;
      return `
      <div class="page-h"><div><h1>${esc(t('nav.dashboard', 'CFO Dashboard'))}</h1><p class="muted">${esc(t('dash.sub', 'Supplier-to-payment position as of {d} · base currency {c}', { d: S.fmt.date(R.asOf), c: ccy() }))} ${UI.demoTag()}</p></div>
        <div class="btn-row"><button class="btn" data-nav="actions">⚡ ${esc(t('nav.actions', 'CFO Action Center'))}</button><button class="btn" data-nav="summary">📝 ${esc(t('nav.summary', 'Management Summary'))}</button></div></div>
      <div class="kpis">
        ${K('totalSpend')}${K('totalAP')}${K('overdueAP', { tone: k.overdueAP.value > 0 ? 'serious' : null })}${K('paymentsDue')}
        ${K('paymentsScheduled')}${K('paymentsExecuted')}${K('cashRequired')}${K('supplierCount')}
        ${K('criticalSuppliers')}${K('highRiskSuppliers', { tone: k.highRiskSuppliers.value ? 'critical' : null })}${K('invoiceExceptions', { tone: k.invoiceExceptions.value ? 'serious' : null })}${K('duplicateRisk', { tone: k.duplicateRisk.value ? 'critical' : null })}
        ${K('fraudAlerts', { tone: k.fraudAlerts.value ? 'critical' : null })}${K('contractExposure')}${K('dpo')}${K('paymentCycle')}
      </div>
      <div class="grid g2">

        ${UI.section(t('ch.aging', 'AP aging ({c})', { c: ccy() }), C.bars(ag.map((b) => ({ label: t('bk.' + b.id), value: b.amount, nav: 'aging', tone: b.id === 'current' ? 'good' : b.id === 'b1_30' ? 'warning' : b.id === 'noDue' ? null : 'critical', tip: `${t('bk.' + b.id)}: ${S.fmt.money(b.amount, ccy())} · ${b.count}` }))))}
        ${UI.section(t('ch.payForecast', 'Payment forecast — next 12 months ({c})', { c: ccy() }), C.stacked(pf.map((m) => m.month), ['scheduled', 'approvedInvoice', 'pendingInvoice', 'poCommitment'].map((ty, i) => ({ name: t('ftype.' + ty), values: pf.map((m) => m.byType[ty]), slot: i })), { nav: () => 'treasury' }))}
        ${UI.section(t('ch.cash', '13-week consolidated cash projection ({c})', { c: ccy() }), cons.series.length ? C.line(wk.map((w) => S.fmt.date(w.to)), [{ name: t('tr.projected', 'Projected cash'), values: wk.map((w) => w.closing) }], { threshold: { value: cons.minCash, label: t('tr.minCash', 'Minimum cash') }, area: true, nav: () => 'treasury' }) + (cons.excluded.length ? `<p class="muted small">⚠ ${esc(t('tr.excluded', 'Excluded (no bank balance or FX rate): {c}', { c: cons.excluded.join(', ') }))}</p>` : '') : UI.na())}

        ${UI.section(t('ch.category', 'Spend by category'), C.donut(cat.map((c) => ({ label: c.key, value: c.amount, nav: 'spend' })), { centerLabel: ccy() }))}
        ${UI.section(t('ch.dept', 'Spend by department'), C.bars(dept.map((d) => ({ label: d.key, value: d.amount, nav: 'spend' })), { horizontal: true, slot: 2 }))}
        ${UI.section(t('ch.payStatus', 'Payments by status ({c})', { c: ccy() }), C.donut(payStatus, { centerLabel: ccy() }))}
        ${UI.section(t('ch.exceptions', 'Invoice exceptions by month'), C.line(exByMonth.map((x) => x[0]), [{ name: t('ch.exc', 'Exceptions'), values: exByMonth.map((x) => x[1].filter((i) => { const m = R.match.get(i._key); return m && !['MATCHED', 'PARTIALLY MATCHED'].includes(m.status); }).length), tone: 'critical' }, { name: t('ch.invoices', 'Invoices'), values: exByMonth.map((x) => x[1].length), slot: 0, dashed: true }], { nav: () => 'matching' }))}
        ${UI.section(t('ch.risk', 'Supplier risk distribution'), C.bars(riskCounts, {}))}
      </div>
      ${V.cfoQuestions()}`;
    },
  };

  /** Section 71: the 16 CFO questions, each answered from data with a link */
  V.cfoQuestions = () => {
    const R = S.R, k = R.kpis, D = S.state.data;
    const m = (v) => (v == null ? UI.na() : UI.base(v, { compact: true }));
    const crit = D.suppliers.filter((s) => s.critical).length;
    const hr = Array.from(R.risk.entries()).filter(([, r]) => ['HIGH', 'CRITICAL'].includes(r.rating));
    const appr = R.priority.filter((x) => x.blocks.includes('notApproved'));
    const dupl = R.alerts.list.filter((a) => ['duplicateInvoice', 'duplicatePayment'].includes(a.rule) || a.category === 'FRAUD');
    const nosup = D.invoices.filter((i) => { const mm = R.match.get(i._key); return mm && ['MISSING PO', 'MISSING GRN', 'DUPLICATE', 'EXCEPTION'].includes(mm.status) && !i._closed; });
    const poExc = D.invoices.filter((i) => { const mm = R.match.get(i._key); return i.poNo && mm && !['MATCHED', 'PARTIALLY MATCHED'].includes(mm.status); });
    const exp = R.contracts.list.filter((c) => c.alerts.includes('expiring') || c.alerts.includes('expired'));
    const sav = k.potentialSavings.value;
    const fails = R.controls.tests.filter((x) => x.status === 'FAIL').length;
    const cons = R.cash.consolidated;

    const urgent = R.actions.filter((a) => a.bucket === 'today').length;
    const today = k.payToday.value;
    const week = U.sum(R.priority.filter((x) => x.inv._dpd != null && x.inv._dpd >= -7), (x) => x.amountBase || 0);
    const Q = [
      ['q1', 'How much do we owe suppliers?', m(k.totalAP.value), 'aging'],
      ['q2', 'What must we pay today?', m(today), 'payments'],
      ['q3', 'What must we pay this week?', m(week), 'payments'],
      ['q4', 'Which suppliers are critical?', esc(S.fmt.num(crit)), 'suppliers'],
      ['q5', 'Which suppliers are high-risk?', esc(S.fmt.num(hr.length)), 'risk'],
      ['q6', 'Where is cash going?', R.spend.byCategory[0] ? esc(R.spend.byCategory[0].key) + ' · ' + m(R.spend.byCategory[0].amount) : UI.na(), 'spend'],
      ['q7', 'Which payments require approval?', esc(S.fmt.num(appr.length)) + ' · ' + m(U.sum(appr, (x) => x.amountBase || 0)), 'payments'],
      ['q8', 'Are there duplicate or suspicious payments?', esc(S.fmt.num(dupl.length)), 'fraud'],
      ['q9', 'Which invoices lack proper supporting documents?', esc(S.fmt.num(nosup.length)), 'matching'],

      ['q11', 'Which contracts are expiring?', esc(S.fmt.num(exp.length)), 'contracts'],
      ['q12', 'Where can we reduce cost?', m(sav), 'savings'],
      ['q13', 'Where are internal controls failing?', esc(S.fmt.num(fails)) + ' ' + esc(t('q.fails', 'failed tests')), 'controls'],
      ['q14', 'What is the projected cash impact?', cons.min ? m(cons.min.closing) + ` <span class="muted small">${esc(t('q.lowest', 'lowest, {d}', { d: S.fmt.date(cons.min.date) }))}</span>` : UI.na(), 'treasury'],
      ['q15', 'Which suppliers have the largest exposure?', topExp ? esc(UI.supName(topExp.supplierId) || '') + ' · ' + m(topExp.total) : UI.na(), 'aging'],

  /* ------------------------------ MANAGEMENT SUMMARY ------------------------------ */

    // 6 Savings
    R.savings.filter((s) => s.saving > 0).slice(0, 5).forEach((s) => st(6, `${t('sv.' + s.type)}: ${money(s.saving)} (${t('conf.' + s.confidence)})`, s.rows, { calc: s.method }));
    // 7 Immediate actions
    R.actions.filter((a) => a.bucket === 'today').slice(0, 8).forEach((a) => st(7, `${t('ac.' + a.key, a.key, Object.fromEntries(Object.entries(a.params).map(([k, v]) => [k, typeof v === 'number' ? S.fmt.num(v) : v])))} → ${t('act.' + a.rec)}`, a.rows));
    // 8 Upcoming critical payments (next 7 days, critical supplier or large)

    return out;

      return `<div class="page-h"><div><h1>${esc(t('sum.title', 'What does the CFO need to know today?'))}</h1><p class="muted">${esc(t('sum.sub', 'Every statement is generated from source data and links to its evidence. As of {d}.', { d: S.fmt.date(S.R.asOf) }))} ${UI.demoTag()}</p></div>

  };

  /* ------------------------------ AI INSIGHTS ------------------------------ */
  V.insights = {

    render() {

      if (!S.state.data.invoices.length) return UI.empty();

        <div class="ins-list">${list.map((i) => `<article class="ins">

            <dt>${esc(t('ins.root', 'Root cause'))}</dt><dd>${esc(i.rootCause ? t('rcz.' + i.rootCause, t('drv.' + i.rootCause + '.short', t('sv.' + i.rootCause, i.rootCause))) : '—')}</dd>
            <dt>${esc(t('ins.action', 'Recommended action'))}</dt><dd>${esc(S.insightText(i, 'a'))}</dd>
            <dt>${esc(t('ins.owner', 'Responsible function'))}</dt><dd>${esc(t('role.' + i.owner, i.owner))}</dd>
            <dt>${esc(t('ins.evidence', 'Evidence'))}</dt><dd>${esc(t('ins.records', '{n} record(s)', { n: (i.rows || []).filter(Boolean).length }))} · ${esc(t('ev.completeness', 'Evidence completeness'))}: ${UI.badge(i.completeness, 'conf.')} ${UI.evBtn('insight', i.id)}</dd>
            ${i.calc ? `<dt>${esc(t('ins.calc', 'Calculation'))}</dt><dd><code>${esc(i.calc)}</code></dd>` : ''}

/* js/views/data.js */
/* SUMED P2P — data views: Upload & Validate (classify, map, OCR review), Data Quality report, Reconciliation. */
(function (root) {
  'use strict';
  const S = (root.SUMED = root.SUMED || {});
  const U = S.util, UI = S.ui;
  const t = (...a) => S.t(...a);
  const esc = U.esc;
  const V = (S.views = S.views || {});
  S.vs = S.vs || {};
  const entLabel = (e) => (S.isAr() ? S.schema[e].labelAr : S.schema[e].label);

  const STEPS = ['upload', 'validate', 'extract', 'reconcile', 'analyze', 'dashboard', 'report'];
  V.stepper = (active) => `<ol class="stepper">${STEPS.map((s, i) => `<li class="${i < active ? 'done' : i === active ? 'on' : ''}">${esc(t('step.' + s, s.toUpperCase()))}</li>`).join('<li class="arr" aria-hidden="true">→</li>')}</ol>`;

  /* ------------------------------ UPLOAD ------------------------------ */
  V.upload = {
    title: () => t('nav.upload', 'Upload & Validate'),
    render() {
      const pend = S.vs.pending || [];
      const busy = S.vs.parsing;
      const flat = [];
      const walk = (s, depth) => { flat.push([s, depth]); (s.children || []).forEach((c) => walk(c, depth + 1)); };
      pend.forEach((s) => walk(s, 0));
      const step = pend.length ? 1 : S.state.sources.length ? 4 : 0;
      const pendHtml = flat.map(([src, depth], fi) => `<div class="pend" style="margin-inline-start:${depth * 18}px">
          <header><b>${esc(src.name)}</b> <span class="muted">${src.size != null ? esc(S.fmt.num(src.size / 1024, 0)) + ' KB · ' : ''}${esc(src.kind)}</span> ${UI.badge(src.status)} <span class="pill">${esc(src.classifiedAs || '')}</span></header>
          ${src.notes.length ? `<p class="muted small">${src.notes.map(esc).join(' · ')}</p>` : ''}
          ${src.sheets.map((sh, si) => `<div class="sheet">
            <div class="sheet-h"><span>📄 ${esc(t('ev.sheet', 'Sheet'))}: <b>${esc(sh.name)}</b> · ${esc(t('up.rows', '{n} rows', { n: sh.rowCount }))} · ${esc(t('up.headerRow', 'header row {n}', { n: sh.headerRow }))}</span>
              <label>${esc(t('up.classAs', 'Classified as'))}
                <select data-act="setEntity" data-f="${fi}" data-s="${si}"><option value="">— ${esc(t('up.ignore', 'Ignore / unclassified'))} —</option>${S.entityOrder.map((e) => `<option value="${e}" ${sh.entity === e ? 'selected' : ''}>${esc(entLabel(e))}</option>`).join('')}</select></label>
              <span>${esc(t('up.conf', 'Required-field coverage'))}: ${UI.badge(sh.confidence >= 0.8 ? 'High' : sh.confidence >= 0.5 ? 'Medium' : 'Low', 'conf.')} ${esc(S.fmt.pct(sh.confidence * 100, 0))}</span>
              <button class="btn sm ghost" data-act="toggleMap" data-f="${fi}" data-s="${si}">${esc(t('up.mapping', 'Column mapping'))} ▾</button></div>
            ${sh._open && sh.entity ? `<div class="mapping"><table><thead><tr><th>${esc(t('up.field', 'System field'))}</th><th>${esc(t('up.column', 'Source column'))}</th><th>${esc(t('up.sample', 'Sample'))}</th></tr></thead><tbody>${S.schema[sh.entity].fields.map((f) => `<tr class="${f.req && sh.mapping[f.key] == null ? 'miss' : ''}"><td>${esc(UI.fieldLabel(f.key))}${f.req ? ' *' : ''}</td><td><select data-act="setMap" data-f="${fi}" data-s="${si}" data-k="${f.key}"><option value="">—</option>${sh.headers.map((h, hi) => `<option value="${hi}" ${sh.mapping[f.key] === hi ? 'selected' : ''}>${esc(h || '(col ' + (hi + 1) + ')')}</option>`).join('')}</select></td><td class="muted">${sh.mapping[f.key] != null && sh.rows[0] ? esc(String(sh.rows[0][sh.mapping[f.key]] ?? '').slice(0, 40)) : ''}</td></tr>`).join('')}</tbody></table><p class="muted small">* ${esc(t('up.req', 'required for core controls — missing required fields are reported in the Data Quality report, never filled in.'))}</p></div>` : ''}
          </div>`).join('')}
          ${src.docs.map((d) => `<div class="sheet"><span>🧾 ${esc(t('up.doc', 'Document'))}: <b>${esc(d.docType)}</b> · ${esc(d.pages.length)} ${esc(t('up.pages', 'page(s)'))} · ${d.pages.map((p) => esc(p.method) + (p.method === 'ocr' ? ' ' + esc(S.fmt.pct(p.conf * 100, 0)) : '')).join(', ')}${Object.keys(d.fields).length ? ' · ' + esc(t('up.fieldsExtracted', '{n} fields extracted', { n: Object.keys(d.fields).filter((k) => !k.startsWith('_')).length })) : ''}</span></div>`).join('')}
        </div>`).join('');
      const loaded = S.state.sources;
      return `<div class="page-h"><div><h1>${esc(t('nav.upload', 'Upload & Validate'))}</h1><p class="muted">${esc(t('up.sub', 'Upload-first: every dashboard is built only from files you load here. Nothing is invented.'))}</p></div>
        <div class="btn-row"><button class="btn" data-act="templates">⤓ ${esc(t('up.templates', 'CSV templates'))}</button><button class="btn" data-act="demo">${esc(t('demo.start', 'Start Demo Mode'))}</button></div></div>
        ${V.stepper(step)}
        <label class="drop ${busy ? 'busy' : ''}" id="dropzone">
          <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.xlsm,.csv,.txt,.tsv,.json,.pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.bmp,.docx,.zip" hidden>
          <strong>⤒ ${esc(t('up.drop', 'Drag & drop files here, or click to browse'))}</strong>
          <span class="muted">${esc(t('up.types', 'Excel · CSV · PDF · scanned PDF · images · Word · ZIP · JSON — supplier master, invoices, POs, GRNs, contracts, payments, bank statements, FX, tax, GL, budget…'))}</span>
          ${busy ? `<span class="spin">${esc(t('up.parsing', 'Parsing {n} file(s)…', { n: busy }))}</span>` : ''}
        </label>
        <p class="muted small">🔒 ${esc(t('up.local', 'Files are processed locally in this browser session. Excel, PDF, Word and ZIP parsers are bundled (vendor/); OCR of scanned documents loads Tesseract on demand from cdn.jsdelivr.net. Nothing is uploaded to a server.'))}</p>
        ${pend.length ? UI.section(t('up.review', 'Step 2 — Validate classification & mapping'), pendHtml + `<div class="btn-row"><button class="btn primary" data-act="commit">✔ ${esc(t('up.commit', 'Validate & load into workspace'))}</button><button class="btn ghost" data-act="discard">${esc(t('up.discard', 'Discard'))}</button></div>`) : ''}
        ${V.ocrPanel()}
        ${UI.section(t('up.loaded', 'Loaded sources'), loaded.length ? UI.table('sources', [
          { key: 'name', label: t('up.file', 'File'), render: (s) => esc(s.name) + (s.kind === 'demo' ? ' ' + UI.demoTag() : '') },
          { key: 'classifiedAs', label: t('up.class', 'Classification') },
          { key: 'sheets', label: t('up.sheets', 'Sheets → entity (rows)'), render: (s) => s.sheets.map((x) => `${esc(x.name)} → ${x.entity ? esc(entLabel(x.entity)) : '—'} (${esc(x.loaded)})`).join('<br>'), sort: (s) => s.sheets.length },
          { key: 'status', label: t('common.status', 'Status'), render: (s) => UI.badge(s.status) },
          { key: 'uploadedBy', label: t('up.by', 'Uploaded by') },
          { key: 'uploadedAt', label: t('up.at', 'At'), render: (s) => esc(S.fmt.ts(s.uploadedAt)) },
          { key: 'hash', label: t('up.hash', 'Hash'), render: (s) => `<span class="mono small">${esc(s.hash || '—')}</span>` },
        ], loaded, { drill: () => null, exportName: 'sources' }) : `<p class="muted">${esc(t('up.none', 'No files loaded yet.'))}</p>`)}
        ${UI.section(t('up.workspace', 'Workspace'), `<p class="muted">${esc(t('up.wsNote', 'The workspace (data, settings, audit trail) is kept in this browser when storage allows. Export it to share or archive.'))}${S.state.persistWarning ? ' ⚠ ' + esc(t('up.persist.' + S.state.persistWarning, 'Workspace not persisted')) : ''}</p>
          <div class="btn-row"><button class="btn" data-act="exportWs">⤓ ${esc(t('up.exportWs', 'Export workspace (JSON)'))}</button><button class="btn danger" data-act="clearWs">${esc(t('up.clearWs', 'Clear workspace'))}</button></div>`)}`;
    },
    after(el) {
      const dz = el.querySelector('#dropzone');
      const inp = el.querySelector('#fileInput');
      if (!dz) return;
      inp.addEventListener('change', () => V.handleFiles(Array.from(inp.files)));
      ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
      ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
      dz.addEventListener('drop', (e) => V.handleFiles(Array.from(e.dataTransfer.files)));
    },
  };
  V.handleFiles = async (files) => {
    if (!files.length) return;
    if (!S.can('upload') && !S.can('config.edit')) { UI.toast(t('perm.denied', 'Your role does not permit this action.'), 'error'); return; }
    S.vs.parsing = files.length; S.app.render();
    const res = [];
    for (const f of files) res.push(await S.ingest.parseFile(f));
    S.vs.pending = (S.vs.pending || []).concat(res);
    S.vs.parsing = 0; S.app.render();
  };
  V.pendFlat = () => { const flat = []; const walk = (s) => { flat.push(s); (s.children || []).forEach(walk); }; (S.vs.pending || []).forEach(walk); return flat; };

  /* ------------------------------ OCR REVIEW ------------------------------ */
  V.ocrPanel = () => {
    const docs = S.state.ocrDocs.concat(V.pendFlat().flatMap((s) => s.docs.map((d) => Object.assign(d, { _pending: true, fileName: s.name }))));
    if (!docs.length) return '';
    const FIELDS = ['supplier', 'supplierName', 'invoiceNo', 'invoiceDate', 'dueDate', 'poNo', 'currency', 'subtotal', 'tax', 'discount', 'total', 'iban', 'swift', 'paymentTerms'];
    return UI.section(t('ocr.title', 'Step 3 — Extract: document OCR review'), docs.map((d) => `<div class="ocr">
      <header><b>${esc(d.name)}</b> · ${esc(d.docType)} ${UI.badge(d.status)} ${d._pending ? `<span class="muted">(${esc(t('ocr.pending', 'commit to enable posting'))})</span>` : ''}</header>
      ${d.docType === 'Invoice' ? `<table class="ocr-t"><thead><tr><th>${esc(t('up.field', 'Field'))}</th><th>${esc(t('ocr.value', 'Extracted value (editable)'))}</th><th>${esc(t('ocr.conf', 'Confidence'))}</th><th>${esc(t('ev.page', 'Page'))}</th><th>${esc(t('ocr.method', 'Method / evidence'))}</th></tr></thead><tbody>
        ${FIELDS.map((k) => { const f = d.fields[k]; const c = f ? f.confidence : null; return `<tr class="${!f ? 'miss' : c < 0.7 ? 'low' : ''}"><td>${esc(UI.fieldLabel(k))}</td><td><input class="ocr-in" data-doc="${esc(d.docId)}" data-k="${esc(k)}" value="${esc(f && f.value != null ? f.value : '')}" placeholder="${esc(t('common.na', 'Not Available in Source Data'))}" ${d._pending || !S.can('correct.ocr') ? 'disabled' : ''}>${f && f.corrected ? `<div class="small muted">✎ ${esc(t('ocr.corrected', 'corrected by {u}; original: {o}', { u: f.correctedBy, o: f.original == null ? '∅' : f.original }))}</div>` : ''}</td><td>${c == null ? UI.na('—') : `<span class="badge b-${c >= 0.9 ? 'good' : c >= 0.7 ? 'warning' : 'critical'}">${esc(S.fmt.pct(c * 100, 0))}</span>`}</td><td>${f ? esc(f.page || '—') : '—'}</td><td class="small">${f ? esc(f.method) + (f.snippet ? ` · <q>${esc(f.snippet)}</q>` : '') : ''}</td></tr>`; }).join('')}
        </tbody></table>
        ${d.fields._arithmetic ? `<p>${d.fields._arithmetic.ok ? '✔' : '⚠'} ${esc(t('ocr.arith', 'Arithmetic check: {f} = {c}', { f: d.fields._arithmetic.formula, c: S.fmt.num(d.fields._arithmetic.calc, 2) }))}</p>` : `<p class="muted">${esc(t('ocr.noArith', 'Arithmetic cross-check unavailable (subtotal or total not extracted).'))}</p>`}
        ${d.fields.lines ? `<p>${esc(t('ocr.lines', '{n} line item(s) detected (qty × unit price = amount).', { n: d.fields.lines.value.length }))}</p>` : ''}
        <p class="muted small">${esc(t('ocr.note', 'Confidence is heuristic: label-anchored patterns, OCR word confidence and arithmetic cross-checks. Every correction is written to the audit trail.'))}</p>
        ${!d._pending && d.status !== 'Posted' ? `<div class="btn-row"><button class="btn" data-act="ocrSave" data-doc="${esc(d.docId)}" ${S.can('correct.ocr') ? '' : 'disabled'}>✎ ${esc(t('ocr.save', 'Save corrections'))}</button><button class="btn primary" data-act="ocrPost" data-doc="${esc(d.docId)}" ${S.can('create.invoice') ? '' : 'disabled'}>⤓ ${esc(t('ocr.post', 'Post to invoice register'))}</button></div>` : ''}`
      : `<details><summary>${esc(t('ocr.text', 'Extracted text'))}</summary><pre class="ocr-text">${esc(d.pages.map((p) => p.text).join('\n---\n').slice(0, 6000))}</pre></details><p class="muted small">${esc(t('ocr.supporting', 'Stored as a supporting document; no structured fields are posted automatically.'))}</p>`}
    </div>`).join(''));
  };

  /* ------------------------------ DATA QUALITY ------------------------------ */
  V.quality = {
    title: () => t('nav.quality', 'Data Quality & Control Report'),
    render() {
      const R = S.R, q = R.dq, s = q.summary;
      if (!s.records) return UI.empty();
      const dr = (r) => (r ? `${S.fmt.date(r.from)} → ${S.fmt.date(r.to)}` : t('common.na', 'Not Available in Source Data'));
      return `<div class="page-h"><div><h1>${esc(t('nav.quality', 'Data Quality & Control Report'))}</h1><p class="muted">${esc(t('dq.sub', 'Validation performed before any dashboard is generated.'))} ${UI.demoTag()}</p></div><div class="btn-row"><button class="btn" data-act="report" data-id="dq">⤓ ${esc(t('rep.export', 'Export'))}</button></div></div>
        ${V.stepper(1)}
        <div class="kpis small">
          ${[['dq.files', 'Files', s.files], ['dq.records', 'Records', s.records], ['dq.suppliers', 'Suppliers', s.suppliers], ['dq.invoices', 'Invoices', s.invoices], ['dq.pos', 'Purchase orders', s.pos], ['dq.payments', 'Payments', s.payments], ['dq.bankTxns', 'Bank transactions', s.bankTxns]].map(([k, l, v]) => `<div class="kpi static"><span class="kpi-label">${esc(t(k, l))}</span><span class="kpi-value">${esc(S.fmt.num(v))}</span></div>`).join('')}
          <div class="kpi static"><span class="kpi-label">${esc(t('dq.score', 'Clean-record score'))}</span><span class="kpi-value">${esc(S.fmt.num(q.score))}<small>/100</small></span><span class="kpi-sub">${esc(t('dq.affected', '{n} records affected', { n: S.fmt.num(q.affected) }))}</span></div>
        </div>
        <div class="grid g2">
          ${UI.section(t('dq.coverage', 'Coverage'), `<table class="kv"><tr><th>${esc(t('dq.currencies', 'Currencies'))}</th><td>${esc(s.currencies.join(', ') || '—')}</td></tr>
            <tr><th>${esc(t('dq.rangeInv', 'Invoice dates'))}</th><td>${esc(dr(s.dateRanges.invoices))}</td></tr><tr><th>${esc(t('dq.rangePay', 'Payment dates'))}</th><td>${esc(dr(s.dateRanges.payments))}</td></tr>
            <tr><th>${esc(t('dq.rangePo', 'PO dates'))}</th><td>${esc(dr(s.dateRanges.pos))}</td></tr><tr><th>${esc(t('dq.rangeBank', 'Bank statement dates'))}</th><td>${esc(dr(s.dateRanges.bankTxns))}</td></tr></table>
            <h4>${esc(t('dq.entities', 'Records by entity'))}</h4><div class="chips">${Object.entries(s.byEntity).map(([e, n]) => `<span class="chip ${n ? '' : 'off'}">${esc(entLabel(e))}: <b>${esc(S.fmt.num(n))}</b></span>`).join('')}</div>`)}
          ${UI.section(t('dq.bySev', 'Issues by severity (records)'), S.chart.bars(['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map((k) => ({ label: t('sev.' + k), value: q.bySev[k], tone: { CRITICAL: 'critical', HIGH: 'serious', MEDIUM: 'warning', LOW: 'good' }[k] }))))}
        </div>
        ${UI.section(t('dq.issues', 'Validation findings'), UI.table('dq', [
          { key: 'severity', label: t('common.severity', 'Severity'), render: (i) => UI.sev(i.severity), sort: (i) => ({ CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 })[i.severity] },
          { key: 'check', label: t('dq.check', 'Check'), render: (i) => esc(UI.reason('dq.', i.check)) },
          { key: 'entity', label: t('dq.entity', 'Entity'), render: (i) => esc(entLabel(i.entity)) },
          { key: 'count', label: t('dq.count', 'Records'), num: true, render: (i) => UI.num(i.count) },
          { key: 'detail', label: t('dq.detail', 'Detail'), render: (i) => `<span class="small muted">${esc(i.detail || '')}</span>` },
          { key: 'ev', label: '', nosort: true, render: (i) => UI.evBtn('dq', i.id) },
        ], q.issues, { drill: () => null, pageSize: 40, exportName: 'data_quality' }))}`;
    },
  };

  /* ------------------------------ RECONCILIATION ------------------------------ */
  V.recon = {
    title: () => t('nav.recon', 'Data Reconciliation'),
    render() {
      const R = S.R;
      if (!S.state.data.invoices.length) return UI.empty();
      const g = R.recon.gl;
      return `<div class="page-h"><div><h1>${esc(t('nav.recon', 'Data Reconciliation'))}</h1><p class="muted">${esc(t('rc.sub', 'Supplier ↔ PO ↔ GRN ↔ Invoice ↔ Payment ↔ Bank ↔ GL'))} ${UI.demoTag()}</p></div></div>
        ${UI.section(t('rc.pairs', 'Register reconciliation'), UI.table('reconPairs', [
          { key: 'left', label: t('rc.left', 'Register A') }, { key: 'right', label: t('rc.right', 'Register B') },
          { key: 'population', label: t('rc.population', 'Population'), num: true, render: (p) => UI.num(p.population) },
          { key: 'ex', label: t('rc.exceptions', 'Exceptions'), num: true, render: (p) => UI.num(p.exceptions.length), sort: (p) => p.exceptions.length },
          { key: 'status', label: t('common.status', 'Status'), render: (p) => UI.badge(p.status, 'rc.') },
          { key: 'note', label: t('rc.note', 'Test'), render: (p) => `<span class="small">${esc(p.note || '')}</span>` },
          { key: 'e', label: '', nosort: true, render: (p) => (p.exceptions.length ? UI.evBtn('recon', p.id) : '') },
        ], R.recon.pairs, { drill: () => null, pageSize: 20 }))}

    { key: 'status', label: t('f.status', 'Status'), render: (i) => UI.badge(V.invStatus(i)), sort: (i) => V.invStatus(i) },
  ];
  /** Lifecycle status: source status, refined by payments & approvals (Received → … → Paid) */
  V.invStatus = (i) => {
    if (i._closed) return i.status;
    if (i.total > 0 && i._paid >= i.total - 0.005) return 'Paid';
    const sched = S.state.data.payments.some((p) => p.invoiceNo === i.invoiceNo && ['Scheduled', 'Approved', 'Submitted to Bank', 'Pending'].includes(p.executionStatus));
    if (sched) return 'Scheduled';
    const m = S.R.match.get(i._key);
    if (m && ['DUPLICATE', 'EXCEPTION', 'QUANTITY VARIANCE', 'PRICE VARIANCE', 'MISSING GRN'].includes(m.status)) return 'Exception';
    if (/approved/i.test(i.approvalStatus || '')) return 'Approved';
    if (/reject/i.test(i.approvalStatus || '')) return 'Rejected';
    return i.status && !/approved|paid/i.test(i.status) ? (i.status === 'Received' ? 'Pending Approval' : i.status) : 'Pending Approval';
  };
  V.poCols = () => [
    { key: 'poNo', label: t('f.poNo', 'PO number'), render: (p) => `<b>${esc(p.poNo)}</b>` },

  V.procurement = {

    render() {
      const R = S.R, D = S.state.data;
      if (!D.pos.length && !D.invoices.length) return UI.empty();
      const sumB = (arr, f) => U.sum(arr, f);
      const fx = (c, d) => (R.P.fx.rate(c, d) || {}).rate;
      const prAmt = sumB(D.prs, (p) => (fx(p.currency, p.date) || 0) * (p.amount || 0));
      const rfqN = U.uniq(D.rfqs.map((r) => r.rfqNo)).length;
      const grnVal = sumB(D.grnLines, (l) => { const pl = (R.P.poLines.get(l.poNo) || []).find((x) => x.itemCode === l.itemCode); const po = R.P.po.get(l.poNo); return pl && po && po._fx ? (l.qtyAccepted != null ? l.qtyAccepted : l.qtyReceived) * pl.unitPrice * po._fx.rate : 0; });
      const appr = D.invoices.filter((i) => /approved/i.test(i.approvalStatus || ''));
      const funnel = [
        ['PR', D.prs.length, prAmt, 'procurement'], ['RFQ', rfqN, null, 'procurement'], ['PO', D.pos.length, sumB(D.pos, (p) => p._totalBase || 0), 'pos'], ['GRN', D.grns.length, grnVal, 'pos'],
        ['Invoice', D.invoices.length, sumB(D.invoices, (i) => i._totalBase || 0), 'invoices'], ['Approval', appr.length, sumB(appr, (i) => i._totalBase || 0), 'invoices'], ['Payment', D.payments.filter((p) => p._isPaid).length, R.kpis.paymentRegisterTotal.value, 'payments'],
      ];
      const poUtil = D.pos.filter((p) => p._total > 0).map((p) => U.sum((R.P.invByPo.get(p.poNo) || []).filter((i) => !i._closed), (i) => i.total) / p._total * 100);
      const avgUtil = poUtil.length ? U.sum(poUtil) / poUtil.length : null;

    const invoiced = U.sum(invs, (i) => i.total);
    const paid = U.sum(invs, (i) => i._paid);
    const tot = p._total;

      const tol = 1;
      if (paid > 0 && paid >= invoiced - tol && invoiced >= tot - tol) st = 'Fully Paid';
      else if (paid > 0) st = 'Partially Paid';

    const sessionOpts = (users.length && !inDir ? `<option value="" selected>${esc(s.session.name)} — ${esc(t('role.' + s.session.role, s.session.role))}</option>` : '') + (users.length ? users.map((u) => `<option value="u:${esc(u.userId)}" ${s.session.userId === u.userId ? 'selected' : ''}>${esc(u.name)} — ${esc(t('role.' + u.role, u.role))}</option>`).join('') : Object.keys(s.roles).map((r) => `<option value="r:${esc(r)}" ${s.session.role === r ? 'selected' : ''}>${esc(t('role.' + r, r))}</option>`).join(''));
    return `<div class="brand"><span class="logo" aria-hidden="true">S</span><div><b>${esc(t('app.name', 'SUMED Supplier & Payments'))}</b><small>${esc(t('app.org', 'Arab Petroleum Pipelines Company · Alexandria'))}</small></div></div>
      <span class="mode m-${mode}" title="${esc(mode === 'demo' ? t('demo.tip', 'Synthetic demonstration data — not SUMED data') : '')}">${esc(t('mode.' + mode))}</span>
      <div class="gsearch"><input id="gsearch" type="search" placeholder="${esc(t('search.ph', 'Search supplier, invoice, PO, contract, payment, bank ref, user, project… ( / )'))}" aria-label="${esc(t('search.label', 'Global search'))}" autocomplete="off"><div id="gresults" hidden></div></div>
      <label class="asof">${esc(t('hdr.asOf', 'As of'))} <input type="date" id="asof" value="${esc(s.config.asOfDate || U.todayISO())}"></label>
      <label class="sess" title="${esc(t('hdr.session', 'Signed-in user / role (role-based access)'))}">👤 <select id="session">${sessionOpts}</select></label>
      <div class="seg" role="group" aria-label="Language"><button class="${S.lang() === 'en' ? 'on' : ''}" data-lang="en">ENGLISH</button><button class="${S.lang() === 'ar' ? 'on' : ''}" data-lang="ar" lang="ar">العربية</button></div>
      <button class="btn ghost icon" id="theme" title="${esc(t('hdr.theme', 'Light / dark mode'))}" aria-label="${esc(t('hdr.theme', 'Light / dark mode'))}">${A.isDark() ? '☀' : '☾'}</button>`;
  };
  A.isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' || (document.documentElement.getAttribute('data-theme') !== 'light' && root.matchMedia && root.matchMedia('(prefers-color-scheme: dark)').matches);
  A.nav = (active) => A.NAV.map(([g, items]) => `<div class="ng"><h4>${esc(t('ng.' + g, GROUP[g]))}</h4>${items.map(([id, ic, l]) => `<a href="#/${id}" class="${active === id || (active === 'supplier' && id === 'suppliers') ? 'on' : ''}" ${active === id ? 'aria-current="page"' : ''}><i aria-hidden="true">${ic}</i><span>${esc(t('nav.' + id, l))}</span>${A.badgeFor(id)}</a>`).join('')}</div>`).join('') + `<p class="nav-foot">${esc(t('nav.foot', 'Evidence-first · no invented data'))}</p>`;
  A.badgeFor = (id) => {
    const R = S.R;
    if (!R) return '';
    const n = id === 'actions' ? R.actions.filter((a) => a.bucket === 'today').length : id === 'fraud' ? R.redFlags.filter((f) => f.severity === 'CRITICAL').length : id === 'controls' ? R.controls.summary.FAIL : id === 'quality' ? R.dq.issues.filter((i) => i.severity === 'CRITICAL').length : 0;
    return n ? `<em class="nb">${n}</em>` : '';
  };

  A.render = () => {
    A.shell();
    const html = document.documentElement;
    html.lang = S.lang();
    html.dir = S.isAr() ? 'rtl' : 'ltr';
    // Theme: only touch data-theme when the user chose one in the app (a host page may set its own).
    const th = S.state.prefs.theme;
    if (th !== 'auto') { html.setAttribute('data-theme', th); A._themeSet = true; } else if (A._themeSet) { html.removeAttribute('data-theme'); A._themeSet = false; }
    const r = A.route();
    const view = V[r.name] || V.dashboard;
    document.getElementById('top').innerHTML = A.header();
    document.getElementById('nav').innerHTML = A.nav(r.name);
    const main = document.getElementById('main');
    let out;
    try { out = view.render(r.param); } catch (e) { console.error(e); out = `<div class="warnbar crit">⚠ ${esc(t('err.render', 'This view could not be rendered from the current data.'))}<pre class="small">${esc(e.stack || e)}</pre></div>`; }
    main.innerHTML = `<div class="proto-note" role="note">${esc(t('app.disclaimer', 'Independent prototype built for SUMED — not an official SUMED system.'))}${root.SUMED_ARTIFACT ? ' ' + esc(t('app.webNote', 'Shared web view: exports ask before saving; PDF reports save as a print-ready HTML file; OCR of scanned images needs the local app.')) : ''}</div>` + (S.state.mode === 'demo' ? `<div class="demo-banner" role="note">${esc(t('demo.banner', 'DEMO MODE — all figures are synthetic sample data generated for demonstration. They are not SUMED data. Upload source files to analyse real data.'))}</div>` : '') + out;
    document.title = `${view.title ? view.title() : ''} · ${t('app.short', 'SUMED P2P')}`;
    if (view.after) view.after(main);
  };
  A.rerun = () => { E.run(); A.render(); };

  /* ---------------- Evidence resolver ---------------- */
  S.evidence = (kind, id) => {
    const R = S.R, D = S.state.data;
    const byKey = (k) => R.index.get(k);
    switch (kind) {
      case 'alert': case 'flag': { const a = R.redFlags.find((x) => x.id === id) || R.alerts.list.find((x) => x.id === id); return a && { title: `${t('cat.' + a.category)} — ${S.alertText(a)}`, severity: a.severity, detail: `${esc(t('f.supplierId', 'Supplier'))}: ${esc(UI.supName(a.supplierId) || '—')} · ${esc(t('rf.txn', 'Transaction'))}: ${esc(a.txn || '—')}`, rows: a.rows, calc: a.calc, amount: a.amountBase != null ? UI.base(a.amountBase) : a.amount != null ? UI.money(a.amount, a.currency) : null, action: t('act.' + a.action), completeness: a.rows.every((r) => r && r._src) ? 'High' : 'Medium' }; }
      case 'insight': { const i = R.insights.find((x) => x.id === id); return i && { title: S.insightText(i, 'o'), severity: i.priority, detail: esc(S.insightText(i, 'w')), rows: i.rows, calc: i.calc, amount: i.impact != null ? UI.base(i.impact) : null, action: S.insightText(i, 'a'), completeness: i.completeness }; }
      case 'action': { const a = R.actions.find((x) => x.id === id); return a && { title: t('ac.' + a.key, a.key, a.params), rows: a.rows, action: t('act.' + a.rec), amount: a.impact != null ? UI.base(a.impact) : null }; }
      case 'sum': { const x = (S.vs.summary || V.buildSummary())[+id]; return x && { title: x.text, severity: x.sev, rows: x.rows, calc: x.calc }; }
      case 'dq': { const i = R.dq.issues.find((x) => x.id === id); return i && { title: UI.reason('dq.', i.check), severity: i.severity, detail: esc(i.detail || ''), rows: i.rows }; }
      case 'ctl': { const c = R.controls.tests.find((x) => x.id === id); return c && { title: `${c.id} ${t('ct.' + c.id)} — ${t('ctl.' + c.status)}`, severity: c.status === 'FAIL' ? 'HIGH' : 'MEDIUM', detail: esc(t('ctl.pop', 'Population {p} · exceptions {n}', { p: c.population, n: c.count })), rows: c.exceptions }; }
      case 'sav': { const s = R.savings.find((x) => x.id === id); return s && { title: t('sv.' + s.type), rows: s.rows, calc: s.method, amount: s.saving != null ? UI.base(s.saving) : null, completeness: s.confidence }; }
      case 'risk': { const r = R.risk.get(id); return r && { title: t('risk.explain', 'Supplier risk is {r} ({s}/100) because:', { r: t('sev.' + r.rating), s: r.score }) + ' ' + UI.supName(id), severity: r.rating, detail: `<ol>${r.drivers.map((d) => `<li>+${d.points} ${esc(S.driverText(d))}</li>`).join('')}</ol>`, rows: r.drivers.flatMap((d) => d.rows).concat([R.P.sup.get(id)]), calc: t('risk.calc', 'Score = Σ driver points (capped at 100); bands configurable'), completeness: r.completeness >= 80 ? 'High' : r.completeness >= 50 ? 'Medium' : 'Low' }; }
      case 'driver': { const [sid, k] = id.split('|'); const d = R.risk.get(sid).drivers.find((x) => x.key === k); return d && { title: S.driverText(d), rows: d.rows }; }
      case 'dup': { const d = R.dupInv.list.find((x) => x.id === id); return d && { title: `${t('dup.' + d.level)}: ${d.aNo} ↔ ${d.bNo}`, severity: d.level === 'POSSIBLE DUPLICATE' ? 'MEDIUM' : 'HIGH', detail: esc(d.reasons.map((x) => UI.reason('sig.', x)).join(' · ')), rows: [byKey(d.a), byKey(d.b)], amount: UI.money(d.amount, d.currency) }; }
      case 'dpay': { const d = R.dupPay.find((x) => x.id === id); return d && { title: `${t('dup.' + d.level)}: ${d.aId} ↔ ${d.bId}`, severity: 'CRITICAL', detail: esc(d.reasons.map((x) => UI.reason('sig.', x)).join(' · ')), rows: [byKey(d.a), byKey(d.b)], amount: UI.money(d.amount, d.currency) }; }
      case 'recon': { const p = R.recon.pairs.find((x) => x.id === id); return p && { title: `${p.left} ↔ ${p.right}`, detail: esc(p.note || ''), rows: p.exceptions }; }
      case 'auto': { const a = R.autoAlerts.find((x) => x.type === id); return a && { title: t('aa.' + a.type, a.type, a.params), rows: a.rows }; }
      case 'wcEarly': return { title: t('wc.early', 'Paid > 5 days before due date (no discount)'), rows: R.wc.early.map((x) => x.p), calc: 'payment date < due date − 5 days AND no discount terms captured' };
      default: return null;
    }
  };

  /* ---------------- Forms (modal) ---------------- */
  UI.form = (title, fields, onSubmit, opts = {}) => {
    const html = `<form id="mform" class="mform">${opts.intro ? `<p>${opts.intro}</p>` : ''}${fields.map((f) => `<label><span>${esc(f.label)}${f.required ? ' *' : ''}</span>${f.type === 'select' ? `<select name="${esc(f.name)}">${f.options.map((o) => `<option value="${esc(o[0])}" ${o[0] === f.value ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>` : f.type === 'textarea' ? `<textarea name="${esc(f.name)}" rows="3" ${f.required ? 'required' : ''}>${esc(f.value || '')}</textarea>` : `<input name="${esc(f.name)}" type="${f.type || 'text'}" value="${esc(f.value == null ? '' : f.value)}" ${f.required ? 'required' : ''} ${f.step ? `step="${f.step}"` : ''}>`}</label>`).join('')}
      <div class="btn-row"><button class="btn primary" type="submit">${esc(opts.submit || t('common.confirm', 'Confirm'))}</button><button class="btn ghost" type="button" data-close="modal">${esc(t('common.cancel', 'Cancel'))}</button></div></form>`;
    UI.modal(title, html);
    document.getElementById('mform').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(e.target).entries());
      const missing = fields.find((f) => f.required && !String(v[f.name] || '').trim());
      if (missing) { UI.toast(t('form.required', 'Required: {f}', { f: missing.label }), 'error'); return; }
      const res = onSubmit(v);
      if (res !== false) UI.closeModal();
    });
  };
  const deny = (msg) => { UI.toast(msg || t('perm.denied', 'Your role does not permit this action.'), 'error'); return false; };
  const me = () => S.state.session.userId;
  const userRole = (u) => ((S.R.P.users.get(u) || {}).role) || (u === me() ? S.state.session.role : null);

  /* ---------------- Workflows ---------------- */
  const W = (A.workflows = {});
  /** Invoice approval — multi-level per approval matrix, SoD enforced, override reason for exceptions. */
  W.invApprove = (key) => {
    if (!S.can('approve.invoice')) return deny();
    const inv = S.R.index.get(key);
    if (!inv) return;
    if (inv.enteredBy && inv.enteredBy === me()) return deny(t('sod.selfApprove', 'Segregation of duties: you entered this invoice and cannot approve it.'));
    const approvals = Array.isArray(inv.approvals) ? inv.approvals.slice() : [];
    if (approvals.some((a) => a.user === me())) return deny(t('wf.already', 'You have already approved this document.'));
    const m = S.R.match.get(inv._key);
    const risk = S.R.risk.get(inv.supplierId);
    const req = E.requiredApprovers(inv._totalBase, { currency: inv.currency, emergency: inv.emergency, nonPO: !inv.poNo, supplierRisk: risk && risk.rating }, S.state.config);
    const exception = m && !['MATCHED', 'PARTIALLY MATCHED'].includes(m.status);
    const go = (reason) => {
      approvals.push({ user: me(), role: S.state.session.role, at: new Date().toISOString(), reason: reason || null });
      S.updateRecord('invoices', inv, 'approvals', approvals, reason, exception ? 'invoice.approve.override' : 'invoice.approve');
      // coverage check
      const pool = approvals.map((a) => ({ u: a.user, rank: E.ROLE_RANK[a.role] || 0, role: a.role })).sort((a, b) => b.rank - a.rank);
      const used = new Set(); const missing = [];
      req.roles.map((r) => ({ r, rank: E.ROLE_RANK[r] || 1 })).sort((a, b) => b.rank - a.rank).forEach((n) => { const c = pool.find((p) => !used.has(p.u) && (p.role === n.r || p.rank >= n.rank)); if (c) used.add(c.u); else missing.push(n.r); });
      if (!missing.length) {
        S.updateRecord('invoices', inv, 'approvalStatus', 'Approved', reason, 'invoice.approve.final');
        S.updateRecord('invoices', inv, 'approvedBy', me(), null, 'invoice.approve.final');
        S.updateRecord('invoices', inv, 'approvedDate', S.R.asOf, null, 'invoice.approve.final');
        S.updateRecord('invoices', inv, 'approvedAmount', inv.total, null, 'invoice.approve.final');
        UI.toast(t('wf.invApproved', 'Invoice {n} fully approved.', { n: inv.invoiceNo }), 'ok');
      } else UI.toast(t('wf.invPartial', 'Approval recorded. Still required: {r}', { r: missing.map((r) => t('role.' + r, r)).join(' + ') }), 'info');
      S.emit('data');
    };
    UI.form(t('inv.approve', 'Approve invoice') + ' ' + inv.invoiceNo, exception ? [{ name: 'reason', label: t('wf.override', 'Override reason (match status: {s})', { s: t('m.' + m.status) }), type: 'textarea', required: true }] : [{ name: 'reason', label: t('wf.comment', 'Comment (optional)'), type: 'textarea' }], (v) => go(v.reason), { intro: esc(t('wf.required', 'Required approvals (matrix tier {tier}): {r}', { tier: req.tier || '—', r: req.roles.map((r) => t('role.' + r, r)).join(' + ') })) + (approvals.length ? '<br>' + esc(t('wf.sofar', 'Approved so far: {a}', { a: approvals.map((a) => a.user + ' (' + a.role + ')').join(', ') })) : '') + (exception ? `<br><b class="neg">⚠ ${esc(t('wf.excWarn', 'This invoice has a three-way match exception. Approval requires a documented override.'))}</b>` : '') });
  };
  W.invReject = (key) => {
    if (!S.can('approve.invoice')) return deny();
    const inv = S.R.index.get(key);
    UI.form(t('inv.reject', 'Reject') + ' ' + inv.invoiceNo, [{ name: 'reason', label: t('wf.reason', 'Reason'), type: 'textarea', required: true }], (v) => { S.updateRecord('invoices', inv, 'approvalStatus', 'Rejected', v.reason, 'invoice.reject'); S.updateRecord('invoices', inv, 'status', 'Rejected', v.reason, 'invoice.reject'); S.emit('data'); });
  };
  W.dispute = (key) => {
    if (!S.can('manage.disputes') && !S.can('approve.invoice')) return deny();
    const inv = key ? S.R.index.get(key) : null;
    const types = ['Invoice dispute', 'Supplier dispute', 'Price dispute', 'Quantity dispute', 'Quality dispute', 'Contract dispute', 'Tax dispute', 'Payment dispute'];
    UI.form(t('dsp.raise', 'Raise dispute'), [
      { name: 'type', label: t('f.type', 'Type'), type: 'select', options: types.map((x) => [x, t('dsp.' + x, x)]) },
      { name: 'supplierId', label: t('f.supplierId', 'Supplier'), type: 'select', value: inv && inv.supplierId, options: S.state.data.suppliers.map((s) => [s.supplierId, s.supplierId + ' — ' + s.name]) },
      { name: 'invoiceNo', label: t('f.invoiceNo', 'Invoice'), value: inv ? inv.invoiceNo : '' },
      { name: 'issue', label: t('f.issue', 'Issue'), type: 'textarea', required: true },
      { name: 'owner', label: t('f.owner', 'Owner'), value: me(), required: true },
      { name: 'targetDate', label: t('f.targetDate', 'Resolution target'), type: 'date', value: U.addDays(S.R.asOf, 14), required: true },
    ], (v) => {
      const i = S.R.P.inv.get(v.invoiceNo);
      S.addRecord('disputes', { disputeId: 'DSP-APP-' + String(S.state.data.disputes.length + 1).padStart(3, '0'), type: v.type, supplierId: v.supplierId, invoiceNo: v.invoiceNo || null, amount: i ? i.total : null, currency: i ? i.currency : null, issue: v.issue, owner: v.owner, raisedDate: S.R.asOf, targetDate: v.targetDate, status: 'Open', rootCause: null, resolution: null }, 'dispute.create');
      S.emit('data');
    });
  };
  W.disputeResolve = (key) => {
    const d = S.R.index.get(key);
    if (!S.can('manage.disputes')) return deny();
    UI.form(t('dsp.resolve', 'Resolve') + ' ' + d.disputeId, [{ name: 'rootCause', label: t('f.rootCause', 'Root cause'), type: 'textarea', required: true }, { name: 'resolution', label: t('f.resolution', 'Resolution'), type: 'textarea', required: true }], (v) => { S.updateRecord('disputes', d, 'rootCause', v.rootCause, null, 'dispute.update'); S.updateRecord('disputes', d, 'resolution', v.resolution, null, 'dispute.update'); S.updateRecord('disputes', d, 'status', 'Resolved', v.resolution, 'dispute.resolve'); S.emit('data'); });
  };

  /** Create payment batch(es) from selected, unblocked priority items. Never executes. */
  W.createBatch = () => {
    if (!S.can('create.batch')) return deny();
    const sel = S.vs.paySel || new Set();
    const items = S.R.priority.filter((x) => sel.has(x.key) && !x.blocks.length);
    if (!items.length) return UI.toast(t('pay.selectFirst', 'Select at least one unblocked invoice.'), 'error');
    let nd = U.addDays(S.R.asOf, 1);
    while (S.state.config.weekendDays.includes(U.dow(nd))) nd = U.addDays(nd, 1);
    UI.form(t('pay.createBatch', 'Create payment batch'), [{ name: 'date', label: t('f.paymentDate', 'Payment date'), type: 'date', value: nd, required: true }, { name: 'note', label: t('wf.comment', 'Comment'), type: 'textarea' }], (v) => {
      const D = S.state.data;
      const created = [];
      for (const [cc, its] of U.groupBy(items, (x) => x.inv.currency)) {
        const acc = D.bankAccounts.filter((b) => b.currency === cc).sort((a, b) => (b.availableBalance || 0) - (a.availableBalance || 0))[0];
        if (!acc) { UI.toast(t('pay.noAcc', 'No company bank account in {c} — batch not created for these invoices.', { c: cc }), 'error'); continue; }
        const yr = v.date.slice(0, 4);
        const seq = D.batches.filter((b) => new RegExp('^PB-' + yr + '-\\d+$').test(String(b.batchId))).length + 1;
        const batchId = `PB-${yr}-${String(seq).padStart(3, '0')}`;
        const b = S.addRecord('batches', { batchId, createdDate: S.R.asOf, paymentDate: v.date, bankAccountId: acc.accountId, currency: cc, createdBy: me(), treasuryApprovedBy: null, cfoApprovedBy: null, status: 'Pending Approval', note: v.note || null }, 'batch.create', v.note);
        its.forEach((x, i) => {
          const inv = x.inv, s = S.R.P.sup.get(inv.supplierId) || {};
          const wht = inv.total ? (inv.wht || 0) * (inv._out / inv.total) : 0;
          S.addRecord('payments', { paymentId: `PAY-${batchId}-${String(i + 1).padStart(3, '0')}`, supplierId: inv.supplierId, invoiceNo: inv.invoiceNo, poNo: inv.poNo, paymentDate: v.date, currency: cc, gross: U.round(inv._out, 2), wht: U.round(wht, 2), net: U.round(inv._out - wht, 2), bankAccountId: acc.accountId, beneficiaryIban: s.iban || null, method: 'Bank Transfer', batchId, reference: null, approvalStatus: 'Pending', executionStatus: 'Pending', createdBy: me(), approvedBy: null, executedBy: null, urgent: false, manual: false }, 'payment.create');
        });
        const tot = U.sum(its, (x) => x.inv._out);
        if (acc.availableBalance != null && tot > acc.availableBalance) UI.toast(t('pay.liqWarn', 'Warning: batch {b} exceeds available balance on {a}.', { b: batchId, a: acc.accountId }), 'error');
        created.push(b.batchId);
      }
      S.vs.paySel = new Set();
      S.vs.payTab = 'batches';
      if (created.length) UI.toast(t('pay.created', 'Created {b}. It now requires Treasury (and if applicable CFO) approval.', { b: created.join(', ') }), 'ok');
      S.emit('data');
    }, { intro: esc(t('pay.batchIntro', '{n} invoice(s). One batch per currency. The system will NOT execute the payment.', { n: items.length })) });
  };

  const batchOf = (id) => S.state.data.batches.find((b) => b.batchId === id);
  W.batchOpen = (id) => {
    const b = batchOf(id), info = V.batchInfo(b);
    const can = (p) => S.can(p);
    const st = b.status;
    const btn = (act, label, cls, ok) => `<button class="btn ${cls || ''}" data-act="${act}" data-id="${esc(id)}" ${ok ? '' : 'disabled'}>${esc(label)}</button>`;
    const html = `<table class="kv"><tr><th>${esc(t('f.batchId', 'Batch'))}</th><td><b>${esc(b.batchId)}</b> ${UI.badge(st)} ${b._demo ? UI.demoTag() : ''}</td></tr>
      <tr><th>${esc(t('f.paymentDate', 'Payment date'))}</th><td>${UI.date(b.paymentDate)}</td></tr><tr><th>${esc(t('f.bankAccountId', 'Bank'))}</th><td>${esc(b.bankAccountId)}</td></tr>
      <tr><th>${esc(t('bt.suppliers', 'Suppliers'))} / ${esc(t('bt.invoices', 'Invoices'))}</th><td>${info.suppliers} / ${info.invoices}</td></tr><tr><th>${esc(t('f.total', 'Total'))}</th><td>${UI.money(info.tot, b.currency)} (${UI.base(info.totBase)})</td></tr>
      <tr><th>${esc(t('bt.required', 'Required approvals'))}</th><td>${info.req.roles.map((r) => esc(t('role.' + r, r))).join(' + ')} <div class="small muted">${esc(info.req.reasons.join(' · '))}</div></td></tr>
      <tr><th>${esc(t('f.createdBy', 'Created by'))}</th><td>${UI.v(b.createdBy)}</td></tr><tr><th>${esc(t('bt.treasury', 'Treasury approval'))}</th><td>${UI.v(b.treasuryApprovedBy)}</td></tr><tr><th>${esc(t('bt.cfo', 'CFO approval'))}</th><td>${b.cfoApprovedBy ? esc(b.cfoApprovedBy) : info.needCfo ? UI.na(t('bt.pending', 'Pending')) : esc(t('bt.notReq', 'Not required'))}</td></tr></table>
      <div class="tbl-wrap"><table><thead><tr><th>${esc(t('f.paymentId', 'Payment'))}</th><th>${esc(t('f.supplierId', 'Supplier'))}</th><th>${esc(t('f.invoiceNo', 'Invoice'))}</th><th class="n">${esc(t('f.net', 'Net'))}</th><th>IBAN</th><th>${esc(t('f.executionStatus', 'Status'))}</th><th></th></tr></thead><tbody>${info.ps.map((p) => `<tr><td><a data-drill="${esc(p._key)}">${esc(p.paymentId)}</a></td><td>${esc(UI.supName(p.supplierId))}</td><td>${esc(p.invoiceNo || '')}</td><td class="n">${UI.num(p.net, 2)}</td><td class="mono">${esc(U.maskAccount(p.beneficiaryIban))}</td><td>${UI.badge(p.executionStatus)}</td><td>${st === 'Pending Approval' && can('create.batch') ? `<button class="btn sm ghost" data-act="bRemove" data-id="${esc(id)}" data-key="${esc(p._key)}">${esc(t('bt.remove', 'Remove'))}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <div class="btn-row">${btn('bApproveT', t('bt.approveT', 'Treasury approve'), 'primary', st === 'Pending Approval' && can('approve.batch.treasury') && !b.treasuryApprovedBy)}${btn('bApproveC', t('bt.approveC', 'CFO approve'), 'primary', ['Pending Approval', 'Scheduled'].includes(st) && can('approve.batch.cfo') && info.needCfo && !b.cfoApprovedBy)}${btn('bReject', t('bt.reject', 'Reject'), 'danger', ['Pending Approval', 'Scheduled'].includes(st) && (can('approve.batch.treasury') || can('approve.batch.cfo')))}
        ${btn('bSubmit', t('bt.submit', 'Submit to bank'), '', st === 'Scheduled' && info.ready && can('submit.batch'))}${btn('bExport', t('bt.export', 'Export bank file'), '', ['Scheduled', 'Submitted to Bank'].includes(st) && can('export'))}${btn('bExecute', t('bt.execute', 'Record bank execution'), '', st === 'Submitted to Bank' && can('execute.payment'))}${btn('bReconcile', t('bt.reconcile', 'Reconcile'), '', ['Executed'].includes(st) && can('reconcile'))}</div>
      <p class="small muted">${esc(t('bt.note', 'Approvals are checked against the configured matrix and segregation of duties (creator ≠ approver ≠ executor ≠ reconciler; invoice approver ≠ payment approver). Every step is audit-logged. Execution is only recorded — it happens in the bank, by authorised people.'))}</p>`;
    UI.modal(t('bt.title', 'Payment batch'), html, { wide: true });
  };
  const sodBatch = (b, info, duty) => {
    const u = me();
    if (b.createdBy === u) return t('sod.batchCreator', 'Segregation of duties: you created this batch.');
    if (duty !== 'approve' && (b.treasuryApprovedBy === u || b.cfoApprovedBy === u)) return t('sod.approverExec', 'Segregation of duties: you approved this batch.');
    if (duty === 'approve' && info.ps.some((p) => { const i = S.R.P.inv.get(p.invoiceNo); return i && (i.approvedBy === u || (Array.isArray(i.approvals) && i.approvals.some((a) => a.user === u))); })) return t('sod.invPay', 'Segregation of duties: you approved an invoice in this batch.');
    if (duty === 'reconcile' && info.ps.some((p) => p.executedBy === u)) return t('sod.execRec', 'Segregation of duties: you recorded execution of this batch.');
    return null;
  };
  const setPays = (info, field, val, reason, action) => info.ps.filter((p) => !['Rejected'].includes(p.executionStatus)).forEach((p) => S.updateRecord('payments', p, field, val, reason, action));
  W.bApproveT = (id) => {

  W.bReject = (id) => {

  };
  W.bRemove = (id, key) => {

      S.updateRecord('payments', p, 'executionStatus', 'Rejected', 'Removed from batch: ' + v.reason, 'batch.modify');
      if (b.treasuryApprovedBy || b.cfoApprovedBy) { S.updateRecord('batches', b, 'treasuryApprovedBy', null, 'Batch modified — approvals reset', 'batch.modify'); S.updateRecord('batches', b, 'cfoApprovedBy', null, 'Batch modified — approvals reset', 'batch.modify'); }
      S.emit('data');
    });
  };
  W.bSubmit = (id) => {
    const b = batchOf(id), info = V.batchInfo(b);
    if (!S.can('submit.batch')) return deny();
    if (!info.ready) return deny(t('bt.notReady', 'Required approvals are not complete.'));
    S.updateRecord('batches', b, 'status', 'Submitted to Bank', null, 'batch.submit');
    setPays(info, 'executionStatus', 'Submitted to Bank', null, 'payment.submit');
