<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFO Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column — top bar, intake strip, tab bar, then the active panel.
   Ledger-inspired: cool grey-green paper, deep ink, teal accent, mono figures. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --sunk: #eaeeeb;
  --ink: #142120;
  --muted: #586664;
  --line: #d9dfdc;
  --accent: #0d6b63;
  --accent-ink: #ffffff;
  --accent-soft: #dcefeb;
  --good: #1d7a43; --good-soft: #e1f3e7;
  --warn: #9a6500; --warn-soft: #fbf0d9;
  --bad: #b42318;  --bad-soft: #fbe5e2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --font-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514; --surface: #162120; --sunk: #1d2a28; --ink: #e5ece9; --muted: #9aaba7; --line: #2b3937;
    --accent: #4fc2b5; --accent-ink: #062320; --accent-soft: #173a36;
    --good: #57c785; --good-soft: #163325; --warn: #e5b445; --warn-soft: #382c11; --bad: #f2786e; --bad-soft: #3d1c19;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514; --surface: #162120; --sunk: #1d2a28; --ink: #e5ece9; --muted: #9aaba7; --line: #2b3937;
  --accent: #4fc2b5; --accent-ink: #062320; --accent-soft: #173a36;
  --good: #57c785; --good-soft: #163325; --warn: #e5b445; --warn-soft: #382c11; --bad: #f2786e; --bad-soft: #3d1c19;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
[dir="rtl"] body, body[dir="rtl"] { font-family: 'IBM Plex Sans Arabic', var(--font-body); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .kpi-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* Top bar */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-inline-end: auto; }
.brand h1 { font-size: 1.3rem; letter-spacing: 0.01em; }
.brand .mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); align-self: center; display: grid; place-items: center; }
.brand .mark svg { width: 14px; height: 14px; }
.brand .tagline { color: var(--muted); font-size: 0.85rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }

/* Intake strip */
.intake { padding-block: 16px 8px; display: grid; gap: 10px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; transition: border-color .15s, background .15s; }
.drop.over, body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
.drop .drop-text { flex: 1 1 260px; min-width: 0; }
.drop strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }
.files { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice { font-size: 0.85rem; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice .tag { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 1px 8px; font-weight: 600; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
.errors { display: grid; gap: 6px; }
.error { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 12px; font-size: 0.88rem; }

/* Tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-top: 8px; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-num); font-size: 0.75rem; background: var(--bad-soft); color: var(--bad); border-radius: 999px; padding: 0 7px; margin-inline-start: 4px; }
main { padding-block: 20px 48px; }
.panel { display: grid; gap: 20px; }

/* Cards and sections */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }

/* Overview */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.gauge { width: 132px; height: 132px; position: relative; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge .g-val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.gauge .g-val b { font-family: var(--font-num); font-size: 2rem; display: block; }
.grade { display: inline-block; font-family: var(--font-display); font-weight: 700; border-radius: 4px; padding: 0 8px; margin-inline-start: 6px; }
.hero p { margin: 6px 0 0; max-width: 72ch; }
.group-bars { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 10px; }
.group-bars span { font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.group-bars i { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.group-bars i::after { content: ''; position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--w); background: var(--c); border-radius: 3px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi-label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
[dir="rtl"] .kpi-label { text-transform: none; letter-spacing: 0; }
.kpi-value { font-size: 1.45rem; font-weight: 500; }
.kpi-delta { font-size: 0.8rem; font-family: var(--font-num); }
.kpi svg { width: 100%; height: 28px; display: block; }
[dir="rtl"] .kpi svg { transform: scaleX(-1); }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }

.chart-box { position: relative; height: 260px; }
.chart-box canvas { max-width: 100%; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.na { background: var(--sunk); color: var(--muted); }
.pill.high { background: var(--bad-soft); color: var(--bad); }
.pill.med { background: var(--warn-soft); color: var(--warn); }
.pill.low { background: var(--sunk); color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 8px 12px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 0.78rem; color: var(--muted); background: var(--sunk); position: sticky; top: 0; white-space: nowrap; }
td.n, th.n { text-align: end; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.st-head td { background: var(--sunk); font-family: var(--font-display); font-weight: 600; color: var(--ink); }
tr.subtotal td { font-weight: 600; }
td .meaning { color: var(--muted); font-size: 0.82rem; margin-top: 2px; max-width: 62ch; }
td .formula { font-family: var(--font-num); font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
.ratio-name { font-weight: 600; }
.tag-derived { font-size: 0.7rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-inline-start: 4px; font-family: var(--font-body); }
.cell-bar { display: block; height: 4px; border-radius: 2px; background: var(--s1); margin-top: 3px; margin-inline-start: auto; max-width: 100%; opacity: .75; }
.heat-up { color: var(--good); } .heat-down { color: var(--bad); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: 0.85rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Flags */
.flag { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; border-inline-start: 4px solid var(--muted); min-width: 0; }
.flag.high { border-inline-start-color: var(--bad); }
.flag.med { border-inline-start-color: var(--warn); }
.flag-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.flag dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 0.9rem; }
.flag dt { color: var(--muted); }
.flag dd { margin: 0; min-width: 0; }
.flag dd.ev { font-family: var(--font-num); font-size: 0.84rem; }
.list { display: grid; gap: 10px; }
.strength { display: flex; gap: 10px; font-size: 0.9rem; }
.strength::before { content: '✓'; color: var(--good); font-weight: 700; }

/* Review */
.issues { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; font-size: 0.9rem; }
select.map { max-width: 230px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
select.map.unmapped { border-color: var(--warn); }
tr.not-used td { color: var(--muted); }

/* Report */
.report { max-width: 860px; }
.report h2 { margin-bottom: 4px; }
.report section { display: grid; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.report ul, .report ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
textarea#md-out { width: 100%; min-height: 140px; font: 0.8rem/1.4 var(--font-num); border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--sunk); }

.loading { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; z-index: 50; font-weight: 600; }

@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; justify-items: start; }
  .brand .tagline { display: none; }
  .chart-box { height: 220px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  .topbar, .intake, .tabs, .actions, textarea { display: none !important; }
  .panel[hidden] { display: none !important; }
  body { background: #fff; color: #000; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M2 12V7M5.5 12V4M9 12V8M12.5 12V2" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg></span>
      <h1 data-t="appName">CFO Lens</h1>
      <span class="tagline" data-t="tagline">Financial statement analysis</span>
    </div>
    <button class="btn ghost" id="btn-theme" type="button" aria-label="Theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btn-lang" type="button" data-t="lang">العربية</button>
  </div>
</header>

<div class="wrap">
  <section class="intake">
    <div class="drop" id="drop">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="6" y="3" width="22" height="28" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M11 22h12M11 17h12M11 12h7" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="drop-text">
        <strong data-t="drop">Drop financial statements here</strong>
        <span class="muted small" data-t="dropHint"></span>
      </div>
      <label class="btn primary" for="file-input"><span data-t="browse">Choose files</span></label>
      <input id="file-input" type="file" multiple accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.pdf" hidden>
    </div>
    <div class="notice" id="sample-notice"><span class="tag" data-t="exampleTag">Example</span><span data-t="sampleNotice"></span></div>
    <div class="files" id="files"></div>
    <div class="errors" id="errors"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-tab="ratios">Ratios</button>
    <button class="tab" role="tab" data-tab="vertical">Vertical</button>
    <button class="tab" role="tab" data-tab="horizontal">Horizontal</button>
    <button class="tab" role="tab" data-tab="flags">Red flags</button>
    <button class="tab" role="tab" data-tab="review">Data review</button>
    <button class="tab" role="tab" data-tab="report">Report</button>
  </nav>

  <main>
    <section class="panel" id="p-overview" role="tabpanel">
      <div class="card hero" id="hero"></div>
      <div class="kpis" id="kpis"></div>
      <div class="grid-2">
        <div class="card"><h3 data-t="chart.revenueProfit">Revenue and profit</h3><div class="chart-box"><canvas id="c-revenue" role="img" aria-label="Revenue and net income by year"></canvas></div></div>
        <div class="card"><h3 data-t="chart.margins">Margins</h3><div class="chart-box"><canvas id="c-margins" role="img" aria-label="Margins by year"></canvas></div></div>
        <div class="card"><h3 data-t="chart.structure">Balance-sheet structure</h3><div class="chart-box"><canvas id="c-structure" role="img" aria-label="Funding structure by year"></canvas></div></div>
        <div class="card"><h3 data-t="chart.cash">Cash flow</h3><div class="chart-box"><canvas id="c-cash" role="img" aria-label="Cash flow by year"></canvas></div></div>
      </div>
      <div class="card" id="top-flags"></div>
    </section>
    <section class="panel" id="p-ratios" role="tabpanel" hidden></section>
    <section class="panel" id="p-vertical" role="tabpanel" hidden></section>
    <section class="panel" id="p-horizontal" role="tabpanel" hidden></section>
    <section class="panel" id="p-flags" role="tabpanel" hidden></section>
    <section class="panel" id="p-review" role="tabpanel" hidden></section>
    <section class="panel" id="p-report" role="tabpanel" hidden></section>
  </main>
</div>
<div class="loading" id="loading" hidden><span data-t="reading">Reading files…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

 * expense: true means the value is stored as a positive cost even if the file shows it negative.
 */

<script>
/* File parsers: Excel / CSV / PDF -> "tables" -> statement lines.
 * A line is { label, values: { [period]: number } }.
 * Libraries (SheetJS, PapaParse, pdf.js) are loaded as globals by index.html.
 */
(function (CFO) {
  const AR_DIGITS = { '٠': 0, '١': 1, '٢': 2, '٣': 3, '٤': 4, '٥': 5, '٦': 6, '٧': 7, '٨': 8, '٩': 9,
                      '۰': 0, '۱': 1, '۲': 2, '۳': 3, '۴': 4, '۵': 5, '۶': 6, '۷': 7, '۸': 8, '۹': 9 };
  const latinDigits = s => String(s).replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d]).replace(/٫/g, '.').replace(/٬/g, ',');

  /** Parse an accounting-formatted cell. Returns a number or null. "(1,200)" -> -1200, "-" -> 0. */
  function parseNumber(cell) {
    if (cell == null) return null;
    if (typeof cell === 'number') return isFinite(cell) ? cell : null;
    let s = latinDigits(cell).trim();
    if (!s) return null;
    if (/^[-–—]+$/.test(s)) return 0;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    s = s.replace(/[A-Za-z$€£¥%؀-ۿ\s '’]/g, '');      // currency words/symbols, spaces
    if (/^-/.test(s)) { neg = !neg; s = s.slice(1); }
    if (!/^\d[\d,]*(\.\d+)?$/.test(s)) return null;
    const v = parseFloat(s.replace(/,/g, ''));
    return isFinite(v) ? (neg ? -v : v) : null;
  }

  /** Period found in a header cell: "2024", "FY2024", "31/12/2024", "2024-12-31", Arabic digits. */
  function parsePeriod(cell) {
    if (cell == null || cell === '') return null;
    if (typeof cell === 'number') return cell >= 1900 && cell <= 2100 && Number.isInteger(cell) ? String(cell) : null;
    const s = latinDigits(cell);
    const m = s.match(/(?:^|[^\d])((?:19|20)\d{2})(?!\d)/);
    if (!m) { const fy = s.match(/\bFY\s?'?(\d{2})\b/i); return fy ? '20' + fy[1] : null; }
    // Quarter / half-year labels keep their qualifier so they do not collide with the full year.
    const q = s.match(/\b(Q[1-4]|H[12])\b/i);
    return q ? `${m[1]} ${q[1].toUpperCase()}` : m[1];
  }

  /** Rows (array of arrays) -> { periods, lines }. */
  function rowsToLines(rows) {
    let headerIdx = -1, headerCols = [];
    for (let r = 0; r < Math.min(rows.length, 40); r++) {
      const cols = [];
      (rows[r] || []).forEach((c, i) => { const p = parsePeriod(c); if (p) cols.push({ i, p }); });
      // A header row holds periods and little else numeric (a data row may contain a year-like value).
      const nums = (rows[r] || []).filter(c => parseNumber(c) != null).length;
      if (cols.length >= 1 && cols.length >= nums - 1 && cols.length > headerCols.length) { headerIdx = r; headerCols = cols; }
    }
    if (headerIdx < 0) {
      // No period header: treat every numeric column as an unnamed period.
      const width = Math.max(0, ...rows.map(r => (r || []).length));
      for (let i = 0; i < width; i++) if (rows.some(r => r && typeof r[i] !== 'string' && parseNumber(r[i]) != null)) headerCols.push({ i, p: `P${headerCols.length + 1}` });

    // De-duplicate repeated period names (e.g. two "2024" columns: amount + %); keep the first.
    const seen = new Set();
    headerCols = headerCols.filter(c => !seen.has(c.p) && seen.add(c.p));
    const colSet = new Set(headerCols.map(c => c.i));
    const lines = [];
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const label = row.filter((c, i) => !colSet.has(i) && typeof c === 'string' && c.trim() && parseNumber(c) == null)
                       .map(c => c.trim()).join(' ').trim();
      if (!label) continue;
      const values = {}; let any = false;
      for (const { i, p } of headerCols) { const v = parseNumber(row[i]); if (v != null) { values[p] = v; any = true; } }
      if (any) lines.push({ label, values });

  async function parseExcel(file) {
    const wb = globalThis.XLSX.read(await file.arrayBuffer(), { type: 'array' });

      const rows = globalThis.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });

  /* PDF: rebuild visual lines from positioned text, then assign numbers to the

  async function parsePDF(file) {

        .map(it => ({ s: it.str.trim(), x: it.transform[4], cx: it.transform[4] + (it.width || 0) / 2, y: it.transform[5] }));
      const rows = [];
      items.sort((a, b) => b.y - a.y || a.x - b.x);
      for (const it of items) {
        const row = rows.find(r => Math.abs(r.y - it.y) < 3);
        row ? row.items.push(it) : rows.push({ y: it.y, items: [it] });
      }
      rows.forEach(r => r.items.sort((a, b) => a.x - b.x));

    // The header is re-detected per page block: a row with >= 2 period cells sets the columns.
    let cols = null, periods = [];
    const lines = [];
    const splitTokens = r => r.items.flatMap(it => {
      // pdf.js may join "2024 2023" or "1,200 (300)" into one item; split on wide spaces.
      const parts = it.s.split(/\s{2,}|\s(?=[(\-]?[\d٠-٩])/);
      if (parts.length === 1) return [it];
      return parts.map((s, k) => ({ s: s.trim(), x: it.x + k, cx: it.cx + k * 10, y: it.y })).filter(x => x.s);
    });
    for (const r of rows) {
      const toks = splitTokens(r);
      // Period tokens look like "2024", "FY2024", "31 Dec 2024"; a grouped amount ("2,024") is not one.
      const periodToks = toks.filter(t => parsePeriod(t.s) && !/[,٬]/.test(t.s));
      if (periodToks.length >= 2 && periodToks.length >= toks.filter(t => parseNumber(t.s) != null).length - 1) {
        cols = periodToks.map(t => ({ p: parsePeriod(t.s), cx: t.cx }));
        periods = [...new Set(cols.map(c => c.p))];
        continue;
      }
      if (!cols) continue;
      const nums = toks.filter(t => parseNumber(t.s) != null);
      const label = toks.filter(t => parseNumber(t.s) == null).map(t => t.s).join(' ').trim();
      if (!label || !nums.length) continue;
      const values = {};
      for (const n of nums) {
        let best = null, dist = Infinity;
        for (const c of cols) { const d = Math.abs(c.cx - n.cx); if (d < dist) { dist = d; best = c; } }
        // Numbers far from every period column (e.g. note references) are ignored.
        if (best && dist < 60 && values[best.p] == null) values[best.p] = parseNumber(n.s);
      }
      if (Object.keys(values).length) lines.push({ label, values });
    }
    return { periods, lines };
  }

  /** File -> array of tables. Throws a readable error for unsupported types. */
  async function parseFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'csv' || ext === 'txt' || ext === 'tsv') return parseCSV(file);
    if (['xlsx', 'xls', 'xlsm', 'ods'].includes(ext)) return parseExcel(file);
    if (ext === 'pdf') return parsePDF(file);
    throw new Error(`unsupported:${ext}`);
  }

  CFO.parseNumber = parseNumber;
  CFO.parsePeriod = parsePeriod;
  CFO.rowsToLines = rowsToLines;
  CFO.pdfRowsToLines = pdfRowsToLines;
  CFO.parseFile = parseFile;
})(globalThis.CFO = globalThis.CFO || {});

/* Merge parsed tables into one dataset.
 * dataset = {
 *   periods: ['2022','2023','2024'],            // ascending
 *   data:    { [period]: { [itemKey]: number } },
 *   derived: { [period]: Set(itemKey) },          // values computed, not read from a file
 *   lines:   [{ id, source, label, values, auto, key, statement, used }],
 *   issues:  [{ type, ... }]                      // conflicts, balance-sheet checks, missing data
 * }

(function (CFO) {
  const periodSort = (a, b) => {
    const ya = parseInt(a, 10), yb = parseInt(b, 10);
    return (isNaN(ya) || isNaN(yb) || ya === yb) ? String(a).localeCompare(String(b)) : ya - yb;
  };

  /** tables: output of parseFile for every file; overrides: { lineId: itemKey | '' } */
  function buildDataset(tables, overrides = {}) {
    const lines = [];
    tables.forEach((t, ti) => t.lines.forEach((l, li) => {
      const id = `${ti}:${li}:${CFO.normalize(l.label).slice(0, 40)}`;
      const auto = CFO.matchLabel(l.label);
      const key = Object.prototype.hasOwnProperty.call(overrides, id) ? overrides[id] || null : auto;
      lines.push({ id, table: ti, source: t.source, label: l.label, values: l.values, auto, key, used: false });
    }));

    // Statement of each table = the statement most of its mapped lines belong to.
    const tableSt = tables.map((_, ti) => {
      const count = {};
      lines.filter(l => l.table === ti && l.key).forEach(l => { const st = CFO.ITEM[l.key].st; count[st] = (count[st] || 0) + 1; });
      return Object.keys(count).sort((a, b) => count[b] - count[a])[0] || null;
    });
    lines.forEach(l => { l.statement = l.key ? CFO.ITEM[l.key].st : tableSt[l.table]; });

    const periods = [...new Set(lines.flatMap(l => Object.keys(l.values)))].sort(periodSort);

      }

      if (periods.length && periods.every(p => data[p][k] == null)) issues.push({ type: 'missing', key: k });

    { id: 'equity_multiplier', group: 'leverage', unit: 'x', dir: 'low', good: 2, bad: 3, needs: ['total_assets', 'equity'],

    const P = { good: 100, warn: 55, bad: 10 };
    let sum = 0, w = 0;
    const byGroup = {};
    for (const def of RATIOS) {
      const s = ratios[def.id][period]?.status;

      (byGroup[def.group] = byGroup[def.group] || []).push(P[s]);

    const groups = Object.fromEntries(Object.entries(byGroup).map(([g, a]) => [g, a.reduce((x, y) => x + y, 0) / a.length]));
    const score = w ? Math.round(sum / w) : null;
    const grade = score == null ? null : score >= 80 ? 'A' : score >= 65 ? 'B' : score >= 50 ? 'C' : score >= 35 ? 'D' : 'E';

    const ratios = computeRatios(ds);
    const latest = ds.periods[ds.periods.length - 1];
    return { ds, latest, ratios, dupont: dupont(ds), vertical: vertical(ds), horizontal: horizontal(ds), health: latest ? healthScore(ratios, latest) : null };
  }

  CFO.GROUPS = GROUPS;
  CFO.enrich = enrich;
  CFO.analyze = analyze;

    ctx => {
      const de = ctx.R('debt_to_equity'), nd = ctx.R('net_debt_to_ebitda');
      if ((de == null || de <= 2) && (nd == null || nd <= 3)) return null;
      return { id: 'leverage', sev: (de > 2 || nd > 4) ? 'high' : 'med',
        title: { en: 'High debt load', ar: 'عبء ديون مرتفع' },
        ev: l => [de != null ? (l === 'en' ? `Debt/equity ${x(de, l)}` : `الديون/حقوق الملكية ${x(de, l)}`) : null, nd != null ? (l === 'en' ? `net debt/EBITDA ${x(nd, l)}` : `صافي الدين/EBITDA ${x(nd, l)}`) : null].filter(Boolean).join(l === 'en' ? '; ' : '؛ '),
        rec: { en: 'Set a deleveraging target (e.g. net debt/EBITDA below 2.5×) funded from free cash flow, asset sales or new equity.', ar: 'حدد هدفاً لخفض الديون (مثلاً صافي الدين/EBITDA أقل من 2.5×) يُموّل من التدفق النقدي الحر أو بيع أصول أو زيادة رأس المال.' } };
    },
    ctx => {
      const e = ctx.d().equity;
      if (e == null || e > 0) return null;
      return { id: 'neg_equity', sev: 'high',
        title: { en: 'Negative equity', ar: 'حقوق ملكية سالبة' },
        ev: l => (l === 'en' ? `Total equity ${num(e, l)}: liabilities exceed assets` : `إجمالي حقوق الملكية ${num(e, l)}: الالتزامات تتجاوز الأصول`),
        rec: { en: 'Recapitalise (capital injection or debt-to-equity conversion) and check local company-law thresholds on accumulated losses.', ar: 'أعد الرسملة (ضخ رأس مال أو تحويل ديون لحقوق ملكية) وراجع حدود قانون الشركات بشأن الخسائر المتراكمة.' } };
    },
    ctx => {
      const ni = ctx.d().net_income;
      if (ni == null || ni >= 0) return null;
      return { id: 'loss', sev: 'high',
        title: { en: 'Net loss', ar: 'صافي خسارة' },
        ev: l => (l === 'en' ? `Net income ${num(ni, l)} in ${ctx.p()}` : `صافي الربح ${num(ni, l)} في ${ctx.p()}`),
        rec: { en: 'Split the loss into structural vs one-off items and prepare a break-even plan with cost and pricing actions.', ar: 'افصل الخسارة إلى بنود هيكلية وأخرى غير متكررة، وضع خطة للوصول لنقطة التعادل عبر التكاليف والتسعير.' } };
    },
    ctx => {
      // Earnings quality: operating cash flow persistently below profit.
      const idx = [ctx.i, ctx.i - 1].filter(k => k >= 0);
      const weak = idx.filter(k => { const d = ctx.d(k); return d.cfo != null && d.net_income > 0 && d.cfo < d.net_income; });
      if (!weak.length || (weak.length < 2 && idx.length >= 2 && ctx.d().cfo >= 0)) return null;
      const d = ctx.d();
      return { id: 'earnings_quality', sev: d.cfo < 0 && d.net_income > 0 ? 'high' : 'med',
        title: { en: 'Profits are not turning into cash', ar: 'الأرباح لا تتحول إلى نقد' },
        ev: l => weak.map(k => { const dk = ctx.d(k); return l === 'en' ? `${ctx.p(k)}: CFO ${num(dk.cfo, l)} vs net income ${num(dk.net_income, l)}` : `${ctx.p(k)}: التدفق التشغيلي ${num(dk.cfo, l)} مقابل صافي الربح ${num(dk.net_income, l)}`; }).join(l === 'en' ? '; ' : '؛ '),
        rec: { en: 'Review revenue recognition and working-capital build-up; tighten credit terms and collections.', ar: 'راجع سياسة الاعتراف بالإيراد وتراكم رأس المال العامل؛ شدد شروط الائتمان والتحصيل.' } };
    },
    ctx => {
      const ar = ctx.g('receivables'), rv = ctx.g('revenue');
      if (ar == null || rv == null || ar - rv <= 0.15) return null;
      return { id: 'receivables', sev: ar - rv > 0.3 ? 'high' : 'med',
        title: { en: 'Receivables growing much faster than sales', ar: 'الذمم المدينة تنمو أسرع بكثير من المبيعات' },
        ev: l => (l === 'en' ? `Receivables ${pct(ar, l)} vs revenue ${pct(rv, l)}; DSO ${CFO.fmtVal('days', ctx.R('dso'), l)}` : `الذمم المدينة ${pct(ar, l)} مقابل الإيرادات ${pct(rv, l)}؛ فترة التحصيل ${CFO.fmtVal('days', ctx.R('dso'), l)}`),
        rec: { en: 'Age the receivables, provision for doubtful accounts, stop credit to overdue customers, and consider factoring.', ar: 'أعدّ أعمار الديون، وكوّن مخصصاً للديون المشكوك فيها، وأوقف الائتمان للعملاء المتأخرين، وفكّر في التخصيم.' } };
    },
    ctx => {
      const inv = ctx.g('inventory'), cg = ctx.g('cogs');
      if (inv == null || cg == null || inv - cg <= 0.15) return null;
      return { id: 'inventory', sev: 'med',
        title: { en: 'Inventory building up', ar: 'تراكم المخزون' },
        ev: l => (l === 'en' ? `Inventory ${pct(inv, l)} vs cost of sales ${pct(cg, l)}; DIO ${CFO.fmtVal('days', ctx.R('dio'), l)}` : `المخزون ${pct(inv, l)} مقابل تكلفة المبيعات ${pct(cg, l)}؛ فترة المخزون ${CFO.fmtVal('days', ctx.R('dio'), l)}`),
        rec: { en: 'Identify slow-moving and obsolete stock, test for write-downs, and align purchasing with demand.', ar: 'حدد المخزون الراكد والمتقادم، واختبر الحاجة لتخفيض قيمته، واربط المشتريات بالطلب الفعلي.' } };
    },
    ctx => {
      if (ctx.i < 1) return null;
      const g0 = ctx.R('gross_margin', ctx.i - 1), g1 = ctx.R('gross_margin'), n0 = ctx.R('net_margin', ctx.i - 1), n1 = ctx.R('net_margin');
      const gDrop = g0 != null && g1 != null ? g0 - g1 : 0, nDrop = n0 != null && n1 != null ? n0 - n1 : 0;
      if (gDrop <= 0.03 && nDrop <= 0.03) return null;
      return { id: 'margins', sev: Math.max(gDrop, nDrop) > 0.06 ? 'high' : 'med',
        title: { en: 'Margin compression', ar: 'تآكل الهوامش' },
        ev: l => [gDrop > 0 ? (l === 'en' ? `Gross margin ${pct(g0, l)} → ${pct(g1, l)}` : `هامش مجمل الربح ${pct(g0, l)} ← ${pct(g1, l)}`) : null, nDrop > 0 ? (l === 'en' ? `net margin ${pct(n0, l)} → ${pct(n1, l)}` : `هامش صافي الربح ${pct(n0, l)} ← ${pct(n1, l)}`) : null].filter(Boolean).join(l === 'en' ? '; ' : '؛ '),
        rec: { en: 'Break down the change into price, volume, mix and input cost; review pricing and supplier contracts.', ar: 'حلّل التغير إلى سعر وكمية ومزيج منتجات وتكلفة مدخلات؛ وراجع التسعير وعقود الموردين.' } };
    },
    ctx => {
      const rv = ctx.g('revenue');
      if (rv == null || rv >= 0) return null;
      return { id: 'revenue', sev: rv < -0.1 ? 'high' : 'med',
        title: { en: 'Revenue decline', ar: 'تراجع الإيرادات' },
        ev: l => (l === 'en' ? `Revenue ${pct(rv, l)} year over year` : `الإيرادات ${pct(rv, l)} مقارنة بالعام السابق`),
        rec: { en: 'Analyse lost customers, products and regions; protect the core and resize the cost base to the new volume.', ar: 'حلّل العملاء والمنتجات والمناطق المفقودة؛ احمِ النشاط الأساسي وأعد ضبط هيكل التكاليف للحجم الجديد.' } };
    },
    ctx => {
      const d = CFO.enrich(ctx.d());
      if (d.fcf == null || d.fcf >= 0 || !(d.dividends > 0)) return null;
      return { id: 'fcf_div', sev: 'high',
        title: { en: 'Dividends paid while free cash flow is negative', ar: 'توزيع أرباح رغم تدفق نقدي حر سالب' },
        ev: l => (l === 'en' ? `Free cash flow ${num(d.fcf, l)}; dividends ${num(d.dividends, l)}` : `التدفق النقدي الحر ${num(d.fcf, l)}؛ التوزيعات ${num(d.dividends, l)}`),
        rec: { en: 'Link dividends to free cash flow; pause or cut the payout until FCF is positive. Dividends are currently funded by debt or cash reserves.', ar: 'اربط التوزيعات بالتدفق النقدي الحر؛ أوقفها أو خفّضها حتى يصبح موجباً. التوزيعات حالياً ممولة بالديون أو الاحتياطي النقدي.' } };
    },
    ctx => {
      const po = ctx.R('payout_ratio');
      if (po == null || po <= 1) return null;
      return { id: 'payout', sev: 'med',
        title: { en: 'Dividends exceed earnings', ar: 'التوزيعات تتجاوز الأرباح' },
        ev: l => (l === 'en' ? `Payout ratio ${pct(po, l)}` : `نسبة التوزيع ${pct(po, l)}`),
        rec: { en: 'Adopt a payout policy tied to sustainable earnings (for example 40–60% of net income).', ar: 'اعتمد سياسة توزيع مرتبطة بالأرباح المستدامة (مثلاً 40–60% من صافي الربح).' } };
    },
    ctx => {
      const z = ctx.R('altman_z');
      if (z == null || z > 2.6) return null;
      return { id: 'altman', sev: z < 1.1 ? 'high' : 'low',
        title: { en: z < 1.1 ? 'Altman Z\'\' in distress zone' : 'Altman Z\'\' in grey zone', ar: z < 1.1 ? 'مؤشر ألتمان في منطقة التعثر' : 'مؤشر ألتمان في المنطقة الرمادية' },
        ev: l => (l === 'en' ? `Z'' = ${CFO.fmtVal('score', z, l)} (safe > 2.6, distress < 1.1)` : `Z'' = ${CFO.fmtVal('score', z, l)} (آمن > 2.6، تعثر < 1.1)`),
        rec: { en: 'Prepare a contingency plan: liquidity headroom, covenant tests and a list of non-core assets that could be sold.', ar: 'جهّز خطة طوارئ: هامش سيولة، واختبارات التعهدات البنكية، وقائمة بأصول غير أساسية يمكن بيعها.' } };
    },
    ctx => {
      const cg = ctx.g('cash'), d = CFO.enrich(ctx.d());
      if (cg == null || cg > -0.3 || !(d.fcf < 0)) return null;
      return { id: 'cash_burn', sev: 'med',
        title: { en: 'Cash balance falling fast', ar: 'انخفاض سريع في رصيد النقدية' },
        ev: l => (l === 'en' ? `Cash ${pct(cg, l)} to ${num(d.cash, l)}; free cash flow ${num(d.fcf, l)}` : `النقدية ${pct(cg, l)} إلى ${num(d.cash, l)}؛ التدفق النقدي الحر ${num(d.fcf, l)}`),
        rec: { en: 'Set a minimum cash buffer, defer non-essential capex, and secure committed credit lines now.', ar: 'حدد حداً أدنى للنقدية، وأجّل الإنفاق الرأسمالي غير الضروري، واحصل على خطوط ائتمان ملتزمة الآن.' } };
    },
    ctx => {
      const d1 = CFO.enrich(ctx.d()), d0 = ctx.i > 0 ? CFO.enrich(ctx.d(ctx.i - 1)) : null, rv = ctx.g('revenue');
      if (!d0 || !d0.total_debt || d1.total_debt == null || rv == null) return null;
      const dg = (d1.total_debt - d0.total_debt) / d0.total_debt;
      if (dg - rv <= 0.2) return null;
      return { id: 'debt_growth', sev: 'med',
        title: { en: 'Borrowing growing faster than the business', ar: 'الاقتراض ينمو أسرع من النشاط' },
        ev: l => (l === 'en' ? `Total debt ${pct(dg, l)} vs revenue ${pct(rv, l)}` : `إجمالي الديون ${pct(dg, l)} مقابل الإيرادات ${pct(rv, l)}`),
        rec: { en: 'Check what the new debt funded (working capital, capex, dividends) and whether it earns more than its cost.', ar: 'تحقق مما موّله الدين الجديد (رأس مال عامل، استثمارات، توزيعات) وهل عائده أعلى من تكلفته.' } };
    },
    ctx => {
      const og = ctx.g('opex'), rv = ctx.g('revenue');
      if (og == null || rv == null || og - rv <= 0.05) return null;
      return { id: 'opex', sev: 'low',
        title: { en: 'Overheads growing faster than revenue', ar: 'المصروفات التشغيلية تنمو أسرع من الإيرادات' },
        ev: l => (l === 'en' ? `Operating expenses ${pct(og, l)} vs revenue ${pct(rv, l)}` : `المصروفات التشغيلية ${pct(og, l)} مقابل الإيرادات ${pct(rv, l)}`),
        rec: { en: 'Review headcount and discretionary spend; set opex as a % of revenue budget ceiling.', ar: 'راجع العمالة والمصروفات الاختيارية؛ وحدد سقفاً للمصروفات كنسبة من الإيرادات.' } };
    },
  ];

  /** Data-integrity issues that undermine the analysis itself become flags too. */
  function dataFlags(ds) {
    return ds.issues.filter(i => i.type === 'unbalanced').map(i => ({
      id: 'data_' + i.period, sev: 'high',
      title: { en: 'Balance sheet does not balance', ar: 'الميزانية غير متوازنة' },
      ev: l => (l === 'en' ? `${i.period}: difference ${num(i.gap, l)}` : `${i.period}: الفرق ${num(i.gap, l)}`),
      rec: { en: 'Check the source file for missing lines or wrong mappings before relying on any ratio.', ar: 'راجع الملف المصدر بحثاً عن بنود ناقصة أو ربط خاطئ قبل الاعتماد على أي نسبة.' } }));
  }

  function makeCtx(A) {
    const ds = A.ds, last = ds.periods.length - 1;
    return {
      ds, i: last,
      p: (k = last) => ds.periods[k],
      d: (k = last) => ds.data[ds.periods[k]] || {},
      R: (id, k = last) => A.ratios[id]?.[ds.periods[k]]?.value ?? null,
      g: (key, k = last) => growth(ds, key, k),
    };
  }

  const SEV_ORDER = { high: 0, med: 1, low: 2 };

  function flags(A) {
    if (!A.ds.periods.length) return [];
    const ctx = makeCtx(A);
    const out = [...dataFlags(A.ds)];
    for (const rule of RULES) { try { const f = rule(ctx); if (f) out.push(f); } catch (e) { /* a rule with missing data stays silent */ } }
    return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
  }

  /** Ratios rated healthy in the latest year, best-known first. */
  function strengths(A, lang) {
    const keep = ['current_ratio', 'quick_ratio', 'gross_margin', 'operating_margin', 'net_margin', 'roe', 'roce', 'interest_coverage', 'debt_to_equity', 'cash_conversion', 'fcf', 'altman_z', 'ccc'];
    return keep.filter(id => A.ratios[id]?.[A.latest]?.status === 'good')
      .map(id => ({ id, text: `${CFO.ratioName(id, lang)} ${CFO.fmtVal(CFO.RATIO[id].unit, A.ratios[id][A.latest].value, lang)}: ${CFO.meaning(id, A.ratios[id][A.latest].value, lang)}` }));
  }

  /** Short narrative for the top of the report. */
  function summary(A, F, lang) {
    const ds = A.ds, p = A.latest, d = ds.data[p] || {}, en = lang === 'en';
    if (!p) return '';
    const parts = [];
    const rg = growth(ds, 'revenue', ds.periods.length - 1);
    const h = A.health;
    if (h?.score != null) parts.push(en ? `Overall financial health for ${p} scores ${h.score}/100 (grade ${h.grade}).` : `تحصل الصحة المالية لعام ${p} على ${h.score}/100 (تقدير ${h.grade}).`);
    if (d.revenue != null) parts.push(en
      ? `Revenue was ${num(d.revenue, lang)}${rg != null ? ` (${rg >= 0 ? 'up' : 'down'} ${pct(Math.abs(rg), lang)} on the prior year)` : ''}${d.net_income != null ? ` with net income of ${num(d.net_income, lang)} (net margin ${pct(A.ratios.net_margin[p].value, lang)})` : ''}.`
      : `بلغت الإيرادات ${num(d.revenue, lang)}${rg != null ? ` (${rg >= 0 ? 'بزيادة' : 'بانخفاض'} ${pct(Math.abs(rg), lang)} عن العام السابق)` : ''}${d.net_income != null ? ` وصافي ربح ${num(d.net_income, lang)} (هامش صافي ${pct(A.ratios.net_margin[p].value, lang)})` : ''}.`);
    const hi = F.filter(f => f.sev === 'high'), med = F.filter(f => f.sev === 'med');
    if (F.length) parts.push(en
      ? `The rules raised ${F.length} red flag${F.length > 1 ? 's' : ''} (${hi.length} high, ${med.length} medium). Most urgent: ${(hi[0] || F[0]).title.en.toLowerCase()}.`
      : `أطلقت القواعد ${F.length} إشارات خطر (${hi.length} مرتفعة، ${med.length} متوسطة). الأكثر إلحاحاً: ${(hi[0] || F[0]).title.ar}.`);
    else parts.push(en ? 'No red flags were raised by the rules.' : 'لم تُطلق القواعد أي إشارة خطر.');
    return parts.join(' ');
  }

  CFO.flags = flags;
  CFO.strengths = strengths;
  CFO.summary = summary;
})(globalThis.CFO = globalThis.CFO || {});

</script>

<script>
/* Overview charts (Chart.js) and KPI sparklines (inline SVG). Colours come from CSS tokens. */
(function (CFO) {
  const live = {};
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function base(lang, unit) {
    const muted = css('--muted'), line = css('--line'), ink = css('--ink');
    const rtl = lang === 'ar';
    const fmt = v => unit === '%' ? CFO.fmtPct(v, lang) : CFO.fmtNum(v, 0, lang);
    return {
      responsive: true, maintainAspectRatio: false, animation: false, layout: { padding: { left: 10, right: 10 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { rtl, labels: { color: ink, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', font: { family: css('--font-body') } } },
        tooltip: { rtl, callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } },
      },
      scales: {
        x: { reverse: rtl, grid: { display: false }, ticks: { color: muted }, border: { color: line } },
        y: { position: rtl ? 'right' : 'left', grid: { color: line, drawTicks: false }, border: { display: false },
             ticks: { color: muted, padding: 6, maxTicksLimit: 5, callback: v => unit === '%' ? CFO.fmtPct(v, lang).replace(/\.0%/, '%') : CFO.fmtNum(v, 0, lang) } },
      },
    };
  }

  function put(id, cfg) {
    const el = document.getElementById(id);
    if (!el || !globalThis.Chart) return;
    if (live[id]) live[id].destroy();
    live[id] = new globalThis.Chart(el, cfg);
  }

  const bar = (label, data, color) => ({ type: 'bar', label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 30, categoryPercentage: 0.7, barPercentage: 0.9 });
  const line = (label, data, color) => ({ type: 'line', label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: css('--surface'), pointBorderWidth: 2, tension: 0, spanGaps: true });

  function draw(A, lang) {
    const ds = A.ds, P = ds.periods, L = CFO.UI[lang];
    const get = k => P.map(p => ds.data[p][k] ?? null);
    const R = id => P.map(p => A.ratios[id][p].value);
    const s1 = css('--s1'), s2 = css('--s2'), s3 = css('--s3');
    const name = k => CFO.itemName(k, lang);

    put('c-revenue', { type: 'bar', data: { labels: P, datasets: [bar(name('revenue'), get('revenue'), s1), bar(name('net_income'), get('net_income'), s2)] }, options: base(lang) });
    put('c-margins', { type: 'line', data: { labels: P, datasets: [line(CFO.ratioName('gross_margin', lang), R('gross_margin'), s1), line(CFO.ratioName('operating_margin', lang), R('operating_margin'), s2), line(CFO.ratioName('net_margin', lang), R('net_margin'), s3)] }, options: base(lang, '%') });

    // Funding structure: how each year's assets are financed (shares of total assets, stacked to 100%).
    const share = (k, p) => { const d = CFO.enrich(ds.data[p]); return d.total_assets ? (k === 'ncl' ? (d.total_liabilities != null && d.current_liabilities != null ? d.total_liabilities - d.current_liabilities : null) : d[k]) / d.total_assets : null; };
    const opt = base(lang, '%'); opt.scales.x.stacked = true; opt.scales.y.stacked = true; opt.scales.y.max = 1;
    put('c-structure', { type: 'bar', data: { labels: P, datasets: [
      { ...bar(name('equity'), P.map(p => share('equity', p)), s1), borderRadius: 0, borderColor: css('--surface'), borderWidth: { top: 2 } },
      { ...bar(lang === 'ar' ? 'التزامات غير متداولة' : 'Non-current liabilities', P.map(p => share('ncl', p)), s2), borderRadius: 0, borderColor: css('--surface'), borderWidth: { top: 2 } },
      { ...bar(name('current_liabilities'), P.map(p => share('current_liabilities', p)), s3), borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: false },
    ] }, options: opt });

    put('c-cash', { type: 'bar', data: { labels: P, datasets: [
      bar(name('cfo'), get('cfo'), s1),
      bar(name('capex'), P.map(p => ds.data[p].capex != null ? -ds.data[p].capex : null), s2),
      bar(L.kpi.fcf, P.map(p => CFO.enrich(ds.data[p]).fcf), s3),
    ] }, options: base(lang) });
  }

  /** Small trend line for KPI tiles; the last point is emphasised. */
  function sparkline(values) {
    const pts = values.map((v, i) => [i, v]).filter(([, v]) => v != null);
    if (pts.length < 2) return '';
    const W = 160, H = 28, pad = 3;
    const ys = pts.map(p => p[1]), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
    const X = i => pad + i / (values.length - 1) * (W - 2 * pad), Y = v => H - pad - (v - min) / span * (H - 2 * pad);
    const d = pts.map(([i, v], k) => `${k ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const [li, lv] = pts[pts.length - 1];
    const area = `${d} L${X(li).toFixed(1)},${H} L${X(pts[0][0]).toFixed(1)},${H} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(li).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
  }

  CFO.drawCharts = draw;
  CFO.sparkline = sparkline;
})(globalThis.CFO = globalThis.CFO || {});

<script>
/* Report generation and exports. Everything stays in the browser; files are local downloads. */
(function (CFO) {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KEY_RATIOS = ['current_ratio', 'quick_ratio', 'gross_margin', 'operating_margin', 'net_margin', 'roe', 'roce', 'dso', 'ccc', 'debt_to_equity', 'interest_coverage', 'net_debt_to_ebitda', 'fcf', 'cash_conversion', 'altman_z'];

  /** Items a person should check before the report is used for decisions. */
  function reviewItems(A, F, lang) {
    const L = CFO.UI[lang], ds = A.ds, out = [];
    const n = k => CFO.itemName(k, lang);
    ds.issues.forEach(i => out.push(L.issue[i.type](i, n)));
    const derived = new Set(ds.periods.flatMap(p => [...ds.derived[p]]));
    if (derived.size) out.push((lang === 'en' ? 'Derived (not read from a file): ' : 'بنود محسوبة (غير مقروءة من ملف): ') + [...derived].map(n).join(lang === 'en' ? ', ' : '، '));
    if (ds.sources.some(s => /\.pdf/i.test(s))) out.push(lang === 'en' ? 'PDF input: verify each number against the original statement.' : 'ملفات PDF: طابق كل رقم مع القوائم الأصلية.');
    F.filter(f => f.sev === 'high').forEach(f => out.push((lang === 'en' ? 'Confirm the cause of: ' : 'تأكد من سبب: ') + f.title[lang]));
    return out;
  }

  function reportHTML(A, F, lang) {
    const L = CFO.UI[lang], P = A.ds.periods, p = A.latest;
    const strengths = CFO.strengths(A, lang);
    const rows = KEY_RATIOS.map(id => {
      const def = CFO.RATIO[id], cell = A.ratios[id][p];
      return `<tr><td>${esc(CFO.ratioName(id, lang))}</td>${P.map(q => `<td class="n">${CFO.fmtVal(def.unit, A.ratios[id][q].value, lang)}</td>`).join('')}<td><span class="pill ${cell.status || 'na'}">${L.status[cell.status || (cell.value != null && !def.dir ? 'info' : 'na')]}</span></td><td class="small">${esc(CFO.meaning(id, cell.value, lang))}</td></tr>`;
    }).join('');
    return `
      <h2>${L.reportTitle}</h2>
      <p class="muted small">${esc(A.ds.sources.join(' · '))} · ${P.join(', ')}</p>
      <section><h3>${L.execSummary}</h3><p>${esc(CFO.summary(A, F, lang))}</p></section>
      <section><h3>${L.keyRatios}</h3><div class="table-wrap"><table><thead><tr><th>${L.item}</th>${P.map(q => `<th class="n">${q}</th>`).join('')}<th>${p}</th><th>${L.meaning}</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section><h3>${L.flagsTitle} & ${L.recs}</h3>${F.length ? `<ol>${F.map(f => `<li><span class="pill ${f.sev}">${L.sev[f.sev]}</span> <b>${esc(f.title[lang])}</b> — <span class="small">${esc(f.ev(lang))}</span><br>${esc(f.rec[lang])}</li>`).join('')}</ol>` : `<p>${L.noFlags}</p>`}</section>
      ${strengths.length ? `<section><h3>${L.strengths}</h3><ul>${strengths.map(s => `<li>${esc(s.text)}</li>`).join('')}</ul></section>` : ''}
      <section><h3>${L.needsReview}</h3><ul>${reviewItems(A, F, lang).map(t => `<li>${esc(t)}</li>`).join('') || `<li>${L.noIssues}</li>`}</ul></section>
      <section><h3>${L.assumptions}</h3><ul>${L.assumptionList.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>
      <section><h3>${L.nextSteps}</h3><ol>${L.nextList.map(t => `<li>${esc(t)}</li>`).join('')}</ol></section>`;
  }

  function reportMarkdown(A, F, lang) {
    const L = CFO.UI[lang], P = A.ds.periods, p = A.latest;
    const lines = [`# ${L.reportTitle}`, '', `## ${L.execSummary}`, CFO.summary(A, F, lang), '', `## ${L.keyRatios}`,
      `| ${L.item} | ${P.join(' | ')} | ${p} |`, `|---|${P.map(() => '---:').join('|')}|---|`];
    KEY_RATIOS.forEach(id => { const def = CFO.RATIO[id]; lines.push(`| ${CFO.ratioName(id, lang)} | ${P.map(q => CFO.fmtVal(def.unit, A.ratios[id][q].value, lang)).join(' | ')} | ${L.status[A.ratios[id][p].status || 'na']} |`); });
    lines.push('', `## ${L.flagsTitle} & ${L.recs}`);
    F.length ? F.forEach((f, i) => lines.push(`${i + 1}. **[${L.sev[f.sev]}] ${f.title[lang]}** — ${f.ev(lang)}  \n   ${f.rec[lang]}`)) : lines.push(L.noFlags);
    lines.push('', `## ${L.needsReview}`, ...reviewItems(A, F, lang).map(t => `- ${t}`), '', `## ${L.nextSteps}`, ...L.nextList.map((t, i) => `${i + 1}. ${t}`));
    return lines.join('\n');
  }

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function exportHTML(A, F, lang) {
    const styles = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join('\n'); } catch (e) { return ''; } }).join('\n');
    const doc = `<!doctype html><html lang="${lang}" dir="${lang === 'ar' ? 'rtl' : 'ltr'}" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${CFO.UI[lang].reportTitle}</title><style>${styles}</style></head><body><main class="wrap"><article class="report">${reportHTML(A, F, lang)}</article></main></body></html>`;
    download(`cfo-report-${A.latest || 'analysis'}-${lang}.html`, new Blob([doc], { type: 'text/html' }));
  }

  function exportXLSX(A, F, lang) {
    const X = globalThis.XLSX, L = CFO.UI[lang], P = A.ds.periods, ds = A.ds;
    const wb = X.utils.book_new();
    const add = (name, rows) => X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rows), name);
    add('Summary', [[L.reportTitle], [CFO.summary(A, F, lang)], [], [L.health, A.health?.score, A.health?.grade]]);
    add('Data', [[L.item, ...P], ...CFO.ITEMS.filter(it => P.some(p => ds.data[p][it.key] != null)).map(it => [CFO.itemName(it.key, lang), ...P.map(p => ds.data[p][it.key] ?? '')])]);
    add('Ratios', [[lang === 'ar' ? 'المجموعة' : 'Group', L.item, L.formula, ...P, `${A.latest}`, L.meaning],
      ...CFO.RATIOS.map(def => [L.groups[def.group], CFO.ratioName(def.id, lang), def.f, ...P.map(p => A.ratios[def.id][p].value ?? ''), L.status[A.ratios[def.id][A.latest].status || 'na'], CFO.meaning(def.id, A.ratios[def.id][A.latest].value, lang)])]);
    const label = r => r.key ? CFO.itemName(r.key, lang) : r.label;
    add('Vertical', [['', L.item, ...P.map(p => `${p} %`)], ...A.vertical.map(r => [L.st[r.st], label(r), ...P.map(p => r.pct[p] ?? '')])]);
    add('Horizontal', [['', L.item, ...P.map(p => `${p} ${L.yoy} %`), ...P.map(p => `${p} ${L.index}`), L.cagr],
      ...A.horizontal.map(r => [L.st[r.st], label(r), ...P.map(p => r.yoy[p]?.pct ?? ''), ...P.map(p => r.idx[p] ?? ''), r.cagr ?? ''])]);
    add('Red flags', [[lang === 'ar' ? 'الخطورة' : 'Severity', L.flagsTitle, L.evidence, L.action], ...F.map(f => [L.sev[f.sev], f.title[lang], f.ev(lang), f.rec[lang]])]);
    add('Mapping', [[L.source, L.rawLabel, L.mappedTo, ...P], ...ds.lines.map(l => [l.source, l.label, l.key ? CFO.itemName(l.key, lang) : '', ...P.map(p => l.values[p] ?? '')])]);
    X.writeFile(wb, `cfo-analysis-${A.latest || ''}.xlsx`);
  }

  CFO.reportHTML = reportHTML;
  CFO.reportMarkdown = reportMarkdown;
  CFO.exportHTML = exportHTML;
  CFO.exportXLSX = exportXLSX;
  CFO.esc = esc;
})(globalThis.CFO = globalThis.CFO || {});

</script>
<script>
/* UI wiring: file intake, state, rendering of every tab. */
(function (CFO) {
  const $ = id => document.getElementById(id);
  const esc = CFO.esc;
  const store = {
    get(k) { try { return localStorage.getItem('cfo-lens:' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('cfo-lens:' + k, v); } catch (e) { /* storage unavailable */ } },
  };
  const TABS = ['overview', 'ratios', 'vertical', 'horizontal', 'flags', 'review', 'report'];
  const SUBTOTALS = new Set(['gross_profit', 'operating_income', 'pretax_income', 'net_income', 'current_assets', 'total_assets', 'current_liabilities', 'total_liabilities', 'equity', 'cfo', 'cfi', 'cff']);

  const state = {
    tables: [], files: [], overrides: {}, errors: [], isSample: true,
    lang: store.get('lang') === 'ar' ? 'ar' : 'en',
    tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview',
    hMode: 'pct', A: null, F: [],
  };

  if (globalThis.pdfjsLib) globalThis.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ---------- intake ---------- */
  async function addFiles(fileList) {
    const files = [...fileList];
    if (!files.length) return;
    $('loading').hidden = false;
    if (state.isSample) { state.tables = []; state.files = []; state.overrides = {}; state.isSample = false; }
    state.errors = [];
    const L = () => CFO.UI[state.lang];
    for (const f of files) {
      try {
        const tables = await CFO.parseFile(f);
        if (!tables.length) { state.errors.push(() => L().errNoLines(f.name)); continue; }
        tables.forEach(t => { t.file = f.name; });
        state.tables.push(...tables);
        if (!state.files.includes(f.name)) state.files.push(f.name);
      } catch (e) {
        const ext = /^unsupported:(.*)$/.exec(e.message);
        state.errors.push(ext ? () => L().errUnsupported(ext[1]) : () => L().errRead(f.name));
        console.error(e);
      }
    }
    $('loading').hidden = true;
    render();
  }

  function loadSample() {
    state.tables = CFO.sampleTables().map(t => ({ ...t, file: t.source }));
    state.files = state.tables.map(t => t.file);
    state.overrides = {}; state.errors = []; state.isSample = true;
  }

  function removeFile(name) {
    state.tables = state.tables.filter(t => t.file !== name);
    state.files = state.files.filter(f => f !== name);
    state.overrides = {};
    if (!state.files.length) loadSample();
    render();
  }

  /* ---------- helpers ---------- */
  const T = () => CFO.UI[state.lang];
  const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;
  const statusPill = s => pill(s || 'na', T().status[s || 'na']);
  const label = r => r.key ? CFO.itemName(r.key, state.lang) : r.label;
  const derivedTag = (r, p) => r.derived?.includes(p) ? `<span class="tag-derived" title="${esc(T().derivedNote)}">${T().derived}</span>` : '';

  function trend(id) {
    const P = state.A.ds.periods; if (P.length < 2) return '';
    const a = state.A.ratios[id][P[P.length - 2]].value, b = state.A.ratios[id][P[P.length - 1]].value, def = CFO.RATIO[id];
    if (a == null || b == null) return '';
    const up = b > a, same = Math.abs(b - a) < Math.abs(a) * 0.01;
    const better = def.dir ? (def.dir === 'high' ? up : !up) : null;
    const cls = same || better == null ? 'flat' : better ? 'up' : 'down';
    return `<span class="${cls}" aria-label="${up ? 'up' : 'down'}">${same ? '→' : up ? '▲' : '▼'}</span>`;
  }

  /* ---------- panels ---------- */
  function renderOverview() {
    const { A, F } = state, L = T(), lang = state.lang, p = A.latest, P = A.ds.periods;
    const h = A.health || {};
    const color = h.score >= 65 ? 'var(--good)' : h.score >= 45 ? 'var(--warn)' : 'var(--bad)';
    const C = 2 * Math.PI * 52, frac = (h.score || 0) / 100;
    $('hero').innerHTML = `
      <div class="gauge" role="img" aria-label="${L.health} ${h.score ?? '—'} ${L.healthOf}">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}"/></svg>
        <div class="g-val"><div><b>${h.score ?? '—'}</b><span class="muted small">${L.healthOf}</span></div></div>
      </div>
      <div style="min-width:0">
        <h2>${L.health} · ${esc(p || '')}${h.grade ? `<span class="grade" style="background:${color};color:var(--surface)">${h.grade}</span>` : ''}</h2>
        <p>${esc(CFO.summary(A, F, lang))}</p>
        <div class="group-bars">${Object.entries(h.groups || {}).map(([g, v]) => `<span><i style="--w:${v}%;--c:${v >= 65 ? 'var(--good)' : v >= 45 ? 'var(--warn)' : 'var(--bad)'}"></i>${L.groups[g]}</span>`).join('')}</div>
      </div>`;

    const kpis = [
      ['revenue', 'money', P.map(q => A.ds.data[q].revenue ?? null), true],
      ['net_income', 'money', P.map(q => A.ds.data[q].net_income ?? null), true],
      ['fcf', 'money', P.map(q => A.ratios.fcf[q].value), true],
      ['current_ratio', 'x', P.map(q => A.ratios.current_ratio[q].value), true],
      ['debt_to_equity', 'x', P.map(q => A.ratios.debt_to_equity[q].value), false],
      ['roe', '%', P.map(q => A.ratios.roe[q].value), true],
    ];
    $('kpis').innerHTML = kpis.map(([k, unit, vals, highGood]) => {
      const cur = vals[vals.length - 1], prev = vals[vals.length - 2];
      let delta = '';
      if (cur != null && prev != null && prev !== 0) {
        const ch = unit === 'money' ? (cur - prev) / Math.abs(prev) : cur - prev;
        const good = (ch >= 0) === highGood;
        const txt = unit === 'money' ? CFO.fmtPct(ch, lang) : unit === '%' ? `${(ch * 100).toFixed(1)} ${L.pts}` : CFO.fmtVal('x', ch, lang);
        delta = `<span class="kpi-delta ${Math.abs(ch) < 1e-9 ? 'flat' : good ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${txt.replace(/^\((.*)\)$/, '$1')} <span class="muted">${L.vs} ${P[P.length - 2]}</span></span>`;
      }
      return `<div class="kpi"><span class="kpi-label">${L.kpi[k]}</span><span class="kpi-value">${CFO.fmtVal(unit, cur, lang)}</span>${delta || '<span class="kpi-delta muted">&nbsp;</span>'}${CFO.sparkline(vals)}</div>`;
    }).join('');

    const top = F.slice(0, 3);
    $('top-flags').innerHTML = `<div class="section-head"><h3>${L.flagsTitle}</h3><button class="btn" type="button" data-go="flags">${F.length} →</button></div>
      <div class="list" style="margin-top:10px">${top.length ? top.map(flagCard).join('') : `<p class="muted">${L.noFlags}</p>`}</div>`;
    requestAnimationFrame(() => CFO.drawCharts(A, lang));
  }

  function flagCard(f) {
    const L = T(), lang = state.lang;
    return `<article class="flag ${f.sev}"><div class="flag-head">${pill(f.sev, L.sev[f.sev])}<h3>${esc(f.title[lang])}</h3></div>
      <dl><dt>${L.evidence}</dt><dd class="ev">${esc(f.ev(lang))}</dd><dt>${L.action}</dt><dd>${esc(f.rec[lang])}</dd></dl></article>`;
  }

  function renderRatios() {
    const { A } = state, L = T(), lang = state.lang, P = A.ds.periods;
    const groups = CFO.GROUPS.map(g => {
      const rows = CFO.RATIOS.filter(r => r.group === g).map(def => {
        const cell = A.ratios[def.id][A.latest];
        const missing = def.needs.filter(k => A.ds.periods.every(p => A.ds.data[p][k] == null));
        const meaning = cell.value != null ? CFO.meaning(def.id, cell.value, lang) : `${L.notAvail}: ${missing.map(k => CFO.itemName(k, lang)).join(', ') || '—'}`;
        const avg = P.some(p => A.ratios[def.id][p].avgUsed) ? ` · ${L.avgNote}` : '';
        return `<tr><td><div class="ratio-name">${esc(CFO.ratioName(def.id, lang))}</div><div class="meaning">${esc(meaning)}</div><div class="formula" dir="ltr">${esc(def.f)}${esc(avg)}</div></td>
          ${P.map(p => `<td class="n">${CFO.fmtVal(def.unit, A.ratios[def.id][p].value, lang)}</td>`).join('')}
          <td class="n">${trend(def.id)}</td><td>${cell.value != null && !def.dir ? pill('na', T().status.info) : statusPill(cell.status)}</td></tr>`;
      }).join('');
      return `<div class="card" style="padding:0;overflow:hidden"><div style="padding:14px 16px 10px"><h3>${L.groups[g]}</h3>${g === 'distress' ? `<span class="muted small">${L.zZones}</span>` : ''}</div>
        <div class="table-wrap" style="border:0;border-radius:0;border-top:1px solid var(--line)"><table><thead><tr><th>${L.item}</th>${P.map(p => `<th class="n">${p}</th>`).join('')}<th class="n"></th><th>${A.latest}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }).join('');
    const dp = A.dupont;
    const dupont = `<div class="card"><h3>${L.dupont}</h3><p class="muted small">${L.dupontHint}</p>
      <div class="table-wrap"><table><thead><tr><th>${L.period}</th><th class="n">${CFO.ratioName('net_margin', lang)}</th><th class="n">${CFO.ratioName('asset_turnover', lang)}</th><th class="n">${CFO.ratioName('equity_multiplier', lang)}</th><th class="n">ROE</th></tr></thead>
      <tbody>${dp.map(r => `<tr><td>${r.period}</td><td class="n">${CFO.fmtPct(r.net_margin, lang)}</td><td class="n">${CFO.fmtVal('x', r.asset_turnover, lang)}</td><td class="n">${CFO.fmtVal('x', r.equity_multiplier, lang)}</td><td class="n">${CFO.fmtPct(r.roe, lang)}</td></tr>`).join('')}</tbody></table></div></div>`;
    $('p-ratios').innerHTML = groups + dupont;
  }

  function statementTables(rows, cellsFor, headFor) {
    const L = T(), P = state.A.ds.periods;
    return ['IS', 'BS', 'CF'].map(st => {
      const rs = rows.filter(r => r.st === st);
      if (!rs.length) return '';
      return `<div class="card" style="padding:0;overflow:hidden"><div style="padding:14px 16px 10px"><h3>${L.st[st]}</h3></div>
        <div class="table-wrap" style="border:0;border-radius:0;border-top:1px solid var(--line)"><table><thead><tr><th>${L.item}</th>${headFor(st, P)}</tr></thead>
        <tbody>${rs.map(r => `<tr class="${SUBTOTALS.has(r.key) ? 'subtotal' : ''}"><td>${esc(label(r))}${r.key ? '' : ' <span class="muted small">*</span>'}</td>${cellsFor(r, P)}</tr>`).join('')}</tbody></table></div></div>`;
    }).join('');
  }

  function renderVertical() {
    const L = T(), lang = state.lang;
    const html = statementTables(state.A.vertical,
      (r, P) => P.map(p => {
        const v = r.pct[p];
        const w = v == null ? 0 : Math.min(100, Math.abs(v) * 100);
        return `<td class="n">${v == null ? '—' : CFO.fmtPct(v, lang)}${derivedTag(r, p)}<span class="cell-bar" style="width:${w}%"></span><div class="muted small">${CFO.fmtNum(r.values[p], 0, lang)}</div></td>`;
      }).join(''),
      (st, P) => P.map(p => `<th class="n">${p}<br><span class="small">${st === 'BS' ? L.ofAssets : L.ofRevenue}</span></th>`).join(''));
    $('p-vertical').innerHTML = `<p class="muted small" style="margin:0">${lang === 'en' ? 'Each line as a share of revenue (income statement, cash flow) or of total assets (balance sheet). * = line not matched to a standard item.' : 'كل بند كنسبة من الإيرادات (قائمة الدخل والتدفقات) أو من إجمالي الأصول (الميزانية). * = بند غير مربوط ببند قياسي.'}</p>` + html;
  }

  function renderHorizontal() {
    const L = T(), lang = state.lang, mode = state.hMode;
    const seg = `<div class="seg" role="group">${[['pct', L.yoy + ' %'], ['abs', L.yoy], ['idx', L.index]].map(([m, t]) => `<button type="button" data-hmode="${m}" aria-pressed="${mode === m}">${esc(t)}</button>`).join('')}</div>`;
    const html = statementTables(state.A.horizontal,
      (r, P) => P.map((p, i) => {
        const amt = `<div>${CFO.fmtNum(r.values[p], 0, lang)}${derivedTag(r, p)}</div>`;
        let ch = '';
        if (mode === 'idx') ch = r.idx[p] == null ? '—' : r.idx[p].toFixed(0);
        else if (i > 0) {
          const y = r.yoy[p];
          if (!y) ch = '—';
          else {
            const v = mode === 'pct' ? y.pct : y.abs;
            const cls = v == null || Math.abs(v) < 1e-9 ? 'muted' : v > 0 ? 'heat-up' : 'heat-down';
            ch = v == null ? '—' : `<span class="${cls}">${v > 0 ? '+' : ''}${mode === 'pct' ? CFO.fmtPct(v, lang) : CFO.fmtNum(v, 0, lang)}</span>`;
          }
        }
        return `<td class="n">${amt}<div class="small">${ch}</div></td>`;
      }).join('') + `<td class="n">${r.cagr == null ? '—' : CFO.fmtPct(r.cagr, lang)}</td>`,
      (st, P) => P.map(p => `<th class="n">${p}</th>`).join('') + `<th class="n">${L.cagr}</th>`);
    $('p-horizontal').innerHTML = `<div class="section-head"><p class="muted small" style="margin:0">${lang === 'en' ? 'Amount per year, with the change beneath it. Green = increase, red = decrease (an increase in costs or debt is not automatically good).' : 'القيمة لكل سنة والتغير أسفلها. الأخضر = زيادة والأحمر = نقص (زيادة التكاليف أو الديون ليست أمراً جيداً بالضرورة).'}</p>${seg}</div>` + html;
  }

  function renderFlags() {
    const L = T(), lang = state.lang, S = CFO.strengths(state.A, lang);
    $('p-flags').innerHTML = `<div class="section-head"><h2>${L.flagsTitle}</h2><span class="muted small">${state.F.length}</span></div>
      <div class="list">${state.F.length ? state.F.map(flagCard).join('') : `<p>${L.noFlags}</p>`}</div>
      <div class="card"><h3>${L.strengths}</h3><div class="list" style="margin-top:8px">${S.length ? S.map(s => `<div class="strength"><span>${esc(s.text)}</span></div>`).join('') : '<span class="muted">—</span>'}</div></div>`;
  }

  function renderReview() {
    const L = T(), lang = state.lang, ds = state.A.ds, P = ds.periods;
    const n = k => CFO.itemName(k, lang);
    const opts = key => `<option value="">${L.ignore}</option>` + ['IS', 'BS', 'CF'].map(st => `<optgroup label="${L.st[st]}">${CFO.ITEMS.filter(i => i.st === st).map(i => `<option value="${i.key}"${i.key === key ? ' selected' : ''}>${esc(n(i.key))}</option>`).join('')}</optgroup>`).join('');
    const issues = ds.issues.map(i => `<li>${esc(L.issue[i.type](i, n))}</li>`).join('');
    $('p-review').innerHTML = `<div class="card"><h3>${L.issues}</h3>${issues ? `<ul class="issues" style="margin-top:8px">${issues}</ul>` : `<p class="muted">${L.noIssues}</p>`}</div>
      <div><h2>${L.reviewTitle}</h2><p class="muted small">${L.reviewHint}</p></div>
      <div class="table-wrap"><table><thead><tr><th>${L.source}</th><th>${L.rawLabel}</th><th>${L.mappedTo}</th>${P.map(p => `<th class="n">${p}</th>`).join('')}</tr></thead>
      <tbody>${ds.lines.map(l => `<tr class="${l.key && !l.used ? 'not-used' : ''}"><td class="small muted">${esc(l.source)}</td><td>${esc(l.label)}</td>
        <td><select class="map${l.key ? '' : ' unmapped'}" data-line="${esc(l.id)}" aria-label="${esc(l.label)}">${opts(l.key)}</select></td>
        ${P.map(p => `<td class="n">${CFO.fmtNum(l.values[p], 0, lang)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function renderReport() {
    const L = T(), { A, F } = state, lang = state.lang;
    $('p-report').innerHTML = `<div class="actions">
        <button class="btn primary" type="button" id="x-xlsx">${L.exportXlsx}</button>
        <button class="btn" type="button" id="x-html">${L.exportHtml}</button>
        <button class="btn" type="button" id="x-md">${L.copyMd}</button><span id="copy-msg" class="muted small" role="status"></span>
      </div>
      <article class="card report">${CFO.reportHTML(A, F, lang)}</article>
      <textarea id="md-out" readonly aria-label="Markdown">${esc(CFO.reportMarkdown(A, F, lang))}</textarea>`;
  }

  /* ---------- shell ---------- */
  function renderChrome() {
    const L = T();
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(el => {
      const v = el.dataset.t.split('.').reduce((o, k) => o?.[k], L);
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('.tab').forEach(b => {
      const t = b.dataset.tab;
      b.innerHTML = esc(L.tabs[t]) + (t === 'flags' && state.F.length ? `<span class="count">${state.F.length}</span>` : '');
      b.setAttribute('aria-selected', String(t === state.tab));
    });
    TABS.forEach(t => { $('p-' + t).hidden = t !== state.tab; });
    $('sample-notice').hidden = !state.isSample;
    $('files').innerHTML = state.isSample ? '' : `<span class="muted small">${L.filesLoaded}:</span>` +
      state.files.map(f => `<span class="chip" title="${esc(f)}">${esc(f)} <button type="button" class="btn ghost" style="padding:0 4px;border:0" data-remove="${esc(f)}" aria-label="Remove ${esc(f)}">×</button></span>`).join('') +
      ` <button class="btn ghost small" type="button" id="btn-sample">${L.loadSample}</button>`;
    $('errors').innerHTML = state.errors.map(e => `<div class="error">${esc(e())}</div>`).join('');
  }

  const PANELS = { overview: renderOverview, ratios: renderRatios, vertical: renderVertical, horizontal: renderHorizontal, flags: renderFlags, review: renderReview, report: renderReport };

  function render() {
    const ds = CFO.buildDataset(state.tables, state.overrides);
    state.A = CFO.analyze(ds);
    state.F = CFO.flags(state.A);
    renderChrome();
    if (!ds.periods.length) { $('p-' + state.tab).innerHTML = ''; return; }
    PANELS[state.tab]();
  }

  function setTab(t) {
    state.tab = t;
    try { history.replaceState(null, '', '#' + t); } catch (e) { /* sandboxed */ }
    renderChrome();
    if (state.A?.ds.periods.length) PANELS[t]();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) return setTab(t.dataset.tab);
    const g = e.target.closest('[data-go]'); if (g) return setTab(g.dataset.go);
    const h = e.target.closest('[data-hmode]'); if (h) { state.hMode = h.dataset.hmode; return renderHorizontal(); }
    const r = e.target.closest('[data-remove]'); if (r) return removeFile(r.dataset.remove);
    if (e.target.closest('#btn-sample')) { loadSample(); return render(); }
    if (e.target.closest('#x-xlsx')) return CFO.exportXLSX(state.A, state.F, state.lang);
    if (e.target.closest('#x-html')) return CFO.exportHTML(state.A, state.F, state.lang);
    if (e.target.closest('#x-md')) {
      const text = CFO.reportMarkdown(state.A, state.F, state.lang), msg = $('copy-msg');
      const fail = () => { msg.textContent = T().copyFail; $('md-out').select(); };
      try { navigator.clipboard.writeText(text).then(() => { msg.textContent = T().copied; }, fail); } catch (err) { fail(); }
    }
  });
  document.addEventListener('change', e => {
    if (e.target.matches('select.map')) { state.overrides[e.target.dataset.line] = e.target.value; render(); }
    if (e.target.id === 'file-input') { addFiles(e.target.files); e.target.value = ''; }
  });
  $('btn-lang').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'ar' : 'en'; store.set('lang', state.lang); render(); });
  $('btn-theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    store.set('theme', root.dataset.theme);
    if (state.tab === 'overview') CFO.drawCharts(state.A, state.lang);
  });
  const theme = store.get('theme'); if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (state.tab === 'overview') CFO.drawCharts(state.A, state.lang); });

  // Drop anywhere on the page.
  let depth = 0;
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { depth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

  loadSample();
  render();
  CFO.state = state; CFO.addFiles = addFiles;
})(globalThis.CFO = globalThis.CFO || {});

</script>
</body>
</html>
