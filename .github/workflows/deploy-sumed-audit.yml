name: Deploy SUMED Audit Platform to GitHub Pages

on:
  push:
    branches: [main, claude/charming-newton-rwsex6]
    paths: ['sumed-audit/**', '.github/workflows/deploy-sumed-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sumed-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sumed-audit/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp release/SUMED-Audit-Platform.html dist/SUMED-Audit-Platform.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sumed-audit/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
